"Cognitive Processing Therapy",C:"EMDR",D:"Present-Centered Therapy"},correct:"C",rationale:"EMDR (Eye Movement Desensitization and Reprocessing) pairs repeated recall of a distressing memory with bilateral sensory stimulation (commonly guided eye movements), distinct from PE's exposure-based approach or CPT's cognitive restructuring. (Wheeler Ch. 7; Boland Ch. 10)"},{topic:"PTSD",vignette:"A 50-year-old survivor of a hurricane that destroyed her home reports she deliberately avoids thinking about the storm and pushes away any memories or feelings connected to it whenever they arise, even without any external reminder present.",question:"Which PTSD criterion is being described?",options:{A:"Criterion B (intrusion)",B:"Criterion C, avoidance of internal reminders",C:"Criterion D (negative cognition/mood)",D:"Criterion E (arousal/reactivity)"},correct:"B",rationale:"Criterion C (avoidance) has two components: avoidance of internal reminders (distressing memories, thoughts, feelings) and avoidance of external reminders (people, places, objects). Deliberately pushing away memories/feelings themselves -- with no external cue described -- is the internal-reminder component. (DSM-5-TR)"},{topic:"PTSD",vignette:"A 46-year-old man with PTSD is started on venlafaxine after not tolerating an SSRI.",question:"How does Boland characterize the evidence for venlafaxine in PTSD relative to sertraline and paroxetine?",options:{A:"Venlafaxine has no evidence at all for PTSD",B:"Venlafaxine has strong evidence, equal to sertraline and paroxetine",C:"Venlafaxine has a strong evidence base as an SNRI option, though sertraline and paroxetine carry the most robust SSRI evidence",D:"Venlafaxine is contraindicated in PTSD"},correct:"C",rationale:"Boland Ch. 10 lists venlafaxine (SNRI) as having a strong evidence base for PTSD, positioned alongside sertraline and paroxetine as the SSRIs with the most robust evidence -- venlafaxine is a reasonable alternative/adjunct rather being either equivalent in evidence strength or contraindicated. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 69-year-old assisted-living resident is physically assaulted by another resident during a confused episode. She subsequently develops PTSD symptoms directly related to this assault.",question:"Which Criterion A exposure pathway does this represent?",options:{A:"Direct personal experience of the traumatic event",B:"Witnessing the event happen to someone else in person",C:"Learning that a close family member experienced the trauma",D:"Repeated or extreme exposure to aversive details of the event"},correct:"A",rationale:"Being physically assaulted herself is direct personal experience of the traumatic event -- the most straightforward of the four Criterion A exposure pathways. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 33-year-old woman meets full PTSD criteria, but her symptoms only became fully apparent 7 months after a serious assault -- for the first several months she had only mild, subthreshold symptoms.",question:"Which PTSD specifier applies to this presentation?",options:{A:"With dissociative symptoms",B:"With delayed expression",C:"Provisional",D:"With good prognostic features"},correct:"B",rationale:"'With delayed expression' applies when full diagnostic criteria are not met until at least 6 months after the trauma, even if some symptoms were present earlier. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 58-year-old man survived a building fire 2 weeks ago. He reports feeling detached from his own body during flashbacks, as though he is watching himself from outside, along with intrusion, avoidance, and hyperarousal symptoms.",question:"Within his current diagnosis, what does this depersonalization experience represent?",options:{A:"It indicates he actually has Panic Disorder instead",B:"A dissociative symptom, part of the required dissociation category within Acute Stress Disorder's criteria",C:"It has no diagnostic significance",D:"It confirms a psychotic disorder"},correct:"B",rationale:"At 2 weeks post-trauma, he is within the Acute Stress Disorder window, and dissociative symptoms (depersonalization/derealization) are one of the 5 required symptom categories for ASD. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 63-year-old retired firefighter has unpredictable episodes of sudden dread, palpitations, and shortness of breath that started 3 years after he stopped working, with no relationship to any specific memory or reminder of his job.",question:"What feature of this presentation argues against a trauma-related disorder diagnosis?",options:{A:"The episodes are physical in nature",B:"The episodes are not linked to any identifiable trauma cue or reminder, unlike PTSD's cued re-experiencing",C:"He is retired",D:"The episodes are unpredictable"},correct:"B",rationale:"PTSD re-experiencing symptoms are typically triggered by trauma-related cues/reminders. Attacks with no relationship to any trauma reminder, occurring 'out of the blue,' are more consistent with Panic Disorder, which requires no trauma exposure at all. (DSM-5-TR; Boland Ch. 8)"},{topic:"PTSD Neuroanatomy",vignette:"A clinician explains to a colleague why prazosin is sometimes used for PTSD-related nightmares, referencing a specific neurochemical finding.",question:"Which finding provides the rationale for prazosin's use in PTSD?",options:{A:"Elevated peripheral noradrenergic (norepinephrine) tone",B:"Deficient dopamine transmission",C:"Elevated serotonin exclusively",D:"Reduced glutamate signaling"},correct:"A",rationale:"PTSD is associated with increased noradrenergic tone (elevated CRH and norepinephrine, linked to locus coeruleus activity); prazosin, an alpha-1 adrenergic antagonist, directly targets this elevated noradrenergic signaling to reduce nightmares. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 35-year-old man with a childhood history of Tourette's syndrome develops new OCD symptoms as an adult, with prominent symmetry and ordering compulsions.",question:"Which OCD specifier is most relevant to document given his history?",options:{A:"With good or fair insight",B:"With poor insight",C:"Tic-related",D:"With absent insight/delusional beliefs"},correct:"C",rationale:"The tic-related specifier applies when there is a current or past history of a tic disorder, which is clinically relevant given the genetic overlap and treatment implications between tic disorders and OCD. (DSM-5-TR)"},{topic:"OCD",vignette:"A 41-year-old woman has recurrent, intrusive urges to check that her front door is locked. She performs the checking behavior repeatedly to reduce the anxiety these urges provoke, even though she recognizes the checking is excessive.",question:"In DSM-5-TR terms, which part of this description is the compulsion?",options:{A:"The intrusive urge to check the door",B:"The repetitive checking behavior performed to reduce anxiety",C:"Her recognition that the checking is excessive",D:"The anxiety itself"},correct:"B",rationale:"Compulsions are the repetitive behaviors or mental acts performed in response to an obsession, aimed at reducing distress -- here, the repeated checking. The intrusive urge itself is the obsession; her insight is a separate specifier consideration. (DSM-5-TR)"},{topic:"OCD",vignette:"A 55-year-old man has accumulated so many newspapers and empty containers in his home over several years that most rooms are impassable, and he becomes acutely distressed at the thought of discarding any of them.",question:"This symptom pattern is most consistent with which OCD-related concern?",options:{A:"Contamination/cleansing",B:"Pathologic doubt/checking",C:"Hoarding-type concerns",D:"Symmetry/ordering"},correct:"C",rationale:"Difficulty discarding possessions leading to accumulation and functional impairment describes hoarding-type concerns, one of the recognized symptom patterns within the OCD spectrum. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 77-year-old widow has become afraid to be at home by herself since her husband's death, and now insists a family member stay with her at all times, even though she has no fear of public places.",question:"Which specific agoraphobia situation does this represent?",options:{A:"Using public transportation",B:"Being in open spaces",C:"Being outside the home alone",D:"Standing in line or being in a crowd"},correct:"C",rationale:"Fear specifically of being outside the home alone is one of the 5 agoraphobia-defining situations under Criterion A -- note that agoraphobia's situations are not limited to public places; being alone at home can also qualify. (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A 48-year-old man meets full diagnostic criteria for both Panic Disorder and Agoraphobia.",question:"How should this be handled diagnostically per DSM-5?",options:{A:"Only Panic Disorder should be diagnosed, since Agoraphobia is now considered a specifier of Panic Disorder",B:"Only Agoraphobia should be diagnosed",C:"Both diagnoses should be assigned, since DSM-5 treats them as independent conditions",D:"Neither can be diagnosed if both sets of criteria are met simultaneously"},correct:"C",rationale:"Since DSM-5, Agoraphobia is diagnosed independently of Panic Disorder. If a patient meets criteria for both, both diagnoses are assigned rather than one subsuming the other. (DSM-5-TR; Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"During a panic attack, a 39-year-old woman reports feeling 'like I was watching myself from outside my body' and that her surroundings 'felt unreal.'",question:"Which panic attack symptom category is she describing?",options:{A:"Paresthesias",B:"Derealization/depersonalization",C:"Chills/heat sensations",D:"Choking sensation"},correct:"B",rationale:"Feeling detached from oneself (depersonalization) or that surroundings are unreal (derealization) are two of the 13 recognized panic attack symptoms under DSM-5-TR Criterion A. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 44-year-old man with panic disorder has not responded adequately to an SSRI and venlafaxine trial.",question:"Which of the following has additional evidence as an option for panic disorder per Boland, beyond first-line SSRIs/SNRIs?",options:{A:"Clomipramine only",B:"Agomelatine, pregabalin, buspirone, or quetiapine",C:"Prazosin",D:"Valbenazine"},correct:"B",rationale:"Boland Ch. 8 lists agomelatine, pregabalin, buspirone, and quetiapine as other agents with evidence for panic disorder beyond first-line SSRIs/SNRIs. Prazosin is specific to PTSD nightmares; valbenazine is for tardive dyskinesia. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"Research in panic disorder demonstrates reduced GABA-A/benzodiazepine receptor binding on functional imaging.",question:"What is the clinical implication of this specific finding?",options:{A:"It explains why SSRIs are ineffective in panic disorder",B:"It provides the mechanistic rationale for benzodiazepines' acute efficacy in panic disorder",C:"It means panic disorder cannot be treated pharmacologically",D:"It is unrelated to any treatment approach"},correct:"B",rationale:"Reduced GABA-A/benzodiazepine receptor binding is part of the neurochemical basis for panic disorder, providing the rationale for why benzodiazepines (which potentiate GABA-A receptor activity) work quickly for acute panic symptoms. (Boland Ch. 8, Table 8-9)"},{topic:"SAD vs. Specific Phobia",vignette:"A 66-year-old retired farmer has an intense, longstanding fear of thunderstorms, refusing to go outside whenever storm clouds appear, even though he has no fear of other outdoor activities.",question:"Which specific phobia subtype does this best represent?",options:{A:"Animal type",B:"Natural environment type",C:"Situational type",D:"Blood-injection-injury type"},correct:"B",rationale:"Fear of natural environment phenomena such as storms, heights, or water is classified as the natural environment type of specific phobia. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 29-year-old woman has an intense, persistent fear of dogs that began after being bitten as a young adult, leading her to avoid parks and any home she knows has a dog.",question:"Which specific phobia subtype does this represent?",options:{A:"Animal type",B:"Natural environment type",C:"Situational type",D:"Other type"},correct:"A",rationale:"Fear centered on a specific animal (dogs) is classified as the animal type of specific phobia, one of the five DSM-5-TR subtypes. (DSM-5-TR)"},{topic:"GAD",vignette:"A 52-year-old man recognizes that his worry about his adult children, his health, and his retirement savings is excessive, but reports he simply cannot stop the worry once it starts, regardless of how hard he tries.",question:"Which GAD criterion is specifically being described?",options:{A:"Criterion A (excessive worry about multiple domains)",B:"Criterion B (the worry is difficult to control)",C:"Criterion D (causes impairment)",D:"Criterion F (not better explained by another disorder)"},correct:"B",rationale:"Criterion B specifically requires that the individual finds it difficult to control the worry -- distinct from Criterion A, which establishes that the worry itself is excessive and spans multiple domains. (DSM-5-TR)"},{topic:"GAD",vignette:"A 60-year-old woman with GAD and well-controlled hypertension is being started on medication. Her provider wants to avoid an agent that could interact with her antihypertensive regimen or worsen fall risk.",question:"Which of the following is a non-habit-forming option for GAD, useful in patients where minimizing sedation and fall risk is a priority?",options:{A:"Alprazolam",B:"Buspirone",C:"Diazepam",D:"Lorazepam"},correct:"B",rationale:"Buspirone is a non-habit-forming anxiolytic specific to GAD, without the sedation and fall-risk profile associated with benzodiazepines -- an important consideration in older adults. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 31-year-old man is diagnosed with Schizophreniform Disorder 5 weeks into his psychotic episode, before it is known whether he will recover within 6 months.",question:"How should this diagnosis be documented at this point?",options:{A:"Definite",B:"Provisional",C:"In remission",D:"Chronic"},correct:"B",rationale:"When Schizophreniform Disorder must be diagnosed before recovery or before the full duration outcome is known, it should be qualified as 'provisional.' (DSM-5-TR)"},{topic:"Schizophreniform Disorder",vignette:"A 25-year-old man's psychotic symptoms (delusions and hallucinations) fully resolved after 3 weeks, never reaching the 1-month minimum duration required for Schizophreniform Disorder.",question:"Which diagnosis is most appropriate given this short duration?",options:{A:"Schizophreniform Disorder",B:"Schizophrenia",C:"Brief Psychotic Disorder",D:"Schizoaffective Disorder"},correct:"C",rationale:"An episode lasting less than 1 month is classified as Brief Psychotic Disorder -- Schizophreniform Disorder specifically requires a minimum duration of 1 month. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 32-year-old accountant, previously reliable and social, has become increasingly withdrawn from coworkers over the past several months following his mother's sudden death. He has also developed unexplained back pain that has not responded to any treatment, and his supervisor has noted a decline in his work quality.",question:"What does this vignette illustrate about the relationship between life stressors and the onset of schizophrenia's prodromal phase?",options:{A:"Life stressors have no relationship to prodromal onset",B:"A significant life stressor, such as a relative's death, can serve as a precipitant that brings the prodromal disturbance to clinical attention",C:"This vignette only describes normal grief with no prodromal significance",D:"Prodromal symptoms cannot include somatic complaints"},correct:"B",rationale:"Boland Ch. 5 notes that social or environmental stressors -- such as the death of a relative -- may precipitate or unmask an evolving prodromal disturbance, alongside classic somatic complaints and social withdrawal. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 29-year-old woman's family recalls that, in retrospect, she had been increasingly preoccupied with elaborate religious and philosophical theories for nearly two years before her first psychotic break.",question:"What does Boland note about the typical length of the prodromal syndrome?",options:{A:"It never lasts more than a few days",B:"It may last a year or more before the emergence of overt psychosis",C:"It always resolves without progressing to psychosis",D:"It is identical in length to the active phase of illness"},correct:"B",rationale:"Boland Ch. 5 notes the prodromal syndrome may last a year or more before the disturbing symptoms of active psychosis develop -- consistent with this two-year retrospective account. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 39-year-old man's presentation includes both major depressive episodes and manic episodes, occurring alongside psychotic symptoms that meet Criterion A of schizophrenia.",question:"Which subtype specifier applies?",options:{A:"Depressive type",B:"Bipolar type",C:"Mixed type",D:"Cyclothymic type"},correct:"B",rationale:"'Bipolar type' applies when a manic episode is part of the presentation (major depressive episodes may also occur); if only major depressive episodes occur, 'depressive type' would apply instead. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 45-year-old man's psychotic and mood symptoms began within days of starting high-dose prednisone, and both fully resolved after the medication was discontinued.",question:"Which schizoaffective disorder criterion would this presentation fail to meet?",options:{A:"Criterion A (mood episode with concurrent psychosis)",B:"Criterion B (\u22652 weeks of psychosis without a mood episode)",C:"Criterion D (not attributable to a substance or medical condition)",D:"None of the criteria; this is consistent with schizoaffective disorder"},correct:"C",rationale:"Criterion D requires the disturbance not be attributable to a substance or another medical condition. Symptoms tightly linked in time to a corticosteroid course, resolving with discontinuation, instead point toward Substance/Medication-Induced Psychotic Disorder (with mood features) rather than schizoaffective disorder. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A psychiatric NP is counseling a family about the expected long-term course of their relative's newly diagnosed schizoaffective disorder.",question:"How does Boland generally describe the prognosis of schizoaffective disorder relative to schizophrenia and mood disorders with psychotic features?",options:{A:"Prognosis is always worse than schizophrenia",B:"Prognosis is generally intermediate between schizophrenia and mood disorders with psychotic features",C:"Prognosis is always better than mood disorders with psychotic features",D:"There is no established difference in prognosis among these conditions"},correct:"B",rationale:"Boland Ch. 5 describes schizoaffective disorder's prognosis as generally intermediate between that of schizophrenia (typically worse) and mood disorders with psychotic features (typically better). (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A clinician is trying to differentiate Major Depressive Disorder with psychotic features from Schizoaffective Disorder, depressive type, in a 50-year-old woman with both depression and hallucinations.",question:"Which single piece of history would most support Schizoaffective Disorder over MDD with psychotic features?",options:{A:"The hallucinations only ever occur during her depressive episodes",B:"A clear 3-week period in which hallucinations persisted despite her mood being fully euthymic",C:"Her depression responded well to an antidepressant",D:"She has a family history of depression"},correct:"B",rationale:"A period of \u22652 weeks of psychosis in the absence of a mood episode (Criterion B) is the defining feature that distinguishes Schizoaffective Disorder from a mood disorder with psychotic features, where psychosis is confined entirely to mood episodes. (DSM-5-TR)"},{topic:"Positive vs. Negative Symptoms",vignette:"A psychiatric NP is teaching a nursing student about the three broad symptom domains of schizophrenia described in Boland Ch. 5.",question:"Beyond positive and negative symptoms, which third domain does Boland identify as clinically significant?",options:{A:"Autonomic symptoms",B:"Cognitive symptoms (attention, working memory, executive function)",C:"Somatic symptoms",D:"Dissociative symptoms"},correct:"B",rationale:"Boland Ch. 5 identifies cognitive symptoms -- impairments in attention, working memory, and executive function -- as a distinct third domain from positive and negative symptoms, often subtle early in the illness but a major driver of long-term disability. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 47-year-old man with schizophrenia is started on an antipsychotic. Within 3 weeks, his auditory hallucinations and paranoid delusions have significantly diminished.",question:"This rapid response is most consistent with which general principle?",options:{A:"Positive symptoms typically respond well to D2 receptor blockade",B:"Negative symptoms always respond first",C:"Cognitive symptoms are the most medication-responsive domain",D:"This response pattern is atypical and should raise concern"},correct:"A",rationale:"Positive symptoms (hallucinations, delusions) generally respond well to both first- and second-generation antipsychotics via D2 receptor blockade, often within weeks -- unlike negative or cognitive symptoms, which are more treatment-resistant. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 37-year-old woman with treatment-resistant depression is being considered for maprotiline after multiple SSRI/SNRI failures.",question:"What is a key safety consideration with this tetracyclic antidepressant?",options:{A:"It has no notable seizure risk",B:"It carries a notable seizure risk",C:"It is the safest antidepressant in patients with a seizure history",D:"It has no cardiac considerations"},correct:"B",rationale:"Maprotiline, a tetracyclic antidepressant, carries a notable seizure risk -- an important safety consideration, particularly in patients with any predisposing risk factors. (Boland Ch. 5, general psychopharmacology)"},{topic:"Seizure Threshold",vignette:"An NP is comparing chlorpromazine and haloperidol for a patient with a known seizure disorder who requires an antipsychotic.",question:"Which statement about their relative seizure risk is accurate?",options:{A:"Chlorpromazine (low-potency) carries greater seizure risk than haloperidol (high-potency)",B:"Haloperidol carries greater seizure risk than chlorpromazine",C:"Both carry identical seizure risk",D:"Neither antipsychotic carries any seizure risk"},correct:"A",rationale:"Low-potency first-generation antipsychotics like chlorpromazine carry greater seizure risk than high-potency FGAs like haloperidol -- an important distinction when selecting an antipsychotic for a patient with a seizure disorder. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"Research into exposure therapy augmentation for anxiety disorders has explored a glutamatergic agent believed to enhance extinction learning during exposure sessions.",question:"Which agent, and which imbalance does it target?",options:{A:"D-cycloserine; targets the imbalance between GABAergic inhibition and glutamatergic excitation",B:"Propranolol; targets dopaminergic excess",C:"Buspirone; targets glutamate directly",D:"Prazosin; targets glutamate receptors"},correct:"A",rationale:"D-cycloserine has been studied as an adjunct to exposure therapy, targeting the glutamatergic system to enhance fear-extinction learning -- addressing the GABA/glutamate imbalance implicated in anxiety disorders. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher notes that some anxiety states are associated with excessive mesocortical dopamine release.",question:"Which medication is sometimes used adjunctively, targeting this dopaminergic system?",options:{A:"Bupropion",B:"Sertraline",C:"Diazepam",D:"Propranolol"},correct:"A",rationale:"Bupropion, which affects dopaminergic (and noradrenergic) signaling, is sometimes used adjunctively in anxiety presentations associated with dopaminergic dysregulation, per Boland Ch. 8's neurochemical systems table. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A 44-year-old man with schizophrenia says, 'My neighbors know exactly what I'm thinking because my thoughts are being sent out over the airwaves for anyone to pick up.'",question:"How does this delusion differ from a delusion of reference?",options:{A:"Thought broadcasting involves the belief that one's own private thoughts are being transmitted outward; a delusion of reference involves believing external, neutral events (e.g., a news broadcast) refer specifically to oneself",B:"They are identical concepts with different names",C:"Delusions of reference always involve thought transmission",D:"Thought broadcasting cannot occur in schizophrenia"},correct:"A",rationale:"Thought broadcasting is specifically about one's own thoughts being transmitted outward for others to perceive. A delusion of reference, by contrast, involves believing that unrelated external events or media are directed at or refer specifically to oneself -- a related but distinct delusion subtype. (Boland Ch. 5, Table 5-1)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 26-year-old man develops paranoid delusions and disorganized behavior after several days of heavy cannabis use. His symptoms fully resolve within a week of stopping use, with no prior psychiatric history.",question:"This course is most consistent with which diagnosis?",options:{A:"Schizophrenia",B:"Substance/Medication-Induced Psychotic Disorder",C:"Schizoaffective disorder",D:"Delusional disorder"},correct:"B",rationale:"Symptoms temporally linked to a substance known to be capable of producing psychosis (cannabis), with resolution shortly after cessation and no prior independent psychotic history, is the classic picture of Substance/Medication-Induced Psychotic Disorder. (DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 60-year-old man with acute alcohol intoxication is noted to have visual hallucinations, but he is also disoriented to time and place and has fluctuating levels of consciousness throughout the assessment.",question:"What diagnostic consideration is most important given the fluctuating consciousness and disorientation?",options:{A:"The clinician should immediately diagnose Substance-Induced Psychotic Disorder",B:"Substance-Induced Psychotic Disorder cannot be diagnosed if the presentation occurs exclusively during delirium",C:"Disorientation is expected and irrelevant to the diagnosis",D:"This presentation confirms schizophrenia"},correct:"B",rationale:"DSM-5-TR Criterion D specifies that Substance/Medication-Induced Psychotic Disorder does not apply if the psychotic symptoms occur exclusively during the course of a delirium -- fluctuating consciousness and disorientation should prompt evaluation for delirium instead. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A 33-year-old man with schizophrenia reports a voice telling him to jump in front of a moving vehicle.",question:"What is the most immediate clinical priority upon eliciting this history?",options:{A:"Documenting the hallucination and continuing the interview as usual",B:"Assessing safety, given this is a command hallucination with direct self-harm content",C:"Assuming the patient will not act on it since he is voluntarily disclosing it",D:"Deferring safety assessment to the next scheduled visit"},correct:"B",rationale:"Command hallucinations, especially those involving self-harm or harm to others, always warrant an immediate, thorough safety assessment -- this is a well-established clinical safety priority. (Boland Ch. 5)"},{topic:"Understanding Hallucinations",vignette:"A 56-year-old woman with schizophrenia describes an unfounded sensation that her brain is 'burning' and that her bone marrow is being 'cut,' without any identifiable medical cause.",question:"This unusual bodily hallucination type is best classified as:",options:{A:"Tactile hallucination",B:"Cenesthetic hallucination",C:"Gustatory hallucination",D:"Auditory hallucination"},correct:"B",rationale:"Cenesthetic hallucinations are unfounded sensations of altered states in bodily organs (e.g., a burning sensation in the brain, a cutting sensation in the bone marrow) -- a distinct hallucination type described in Boland's discussion of schizophrenia's clinical presentation. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 51-year-old man with schizophrenia states, 'The sun is yellow, so bananas must control the weather, which means my neighbor is stealing my mail.'",question:"This chain of non-sequitur reasoning, where conclusions do not logically follow from the premises, is best described as:",options:{A:"Illogicality",B:"Clanging",C:"Pressure of speech",D:"Echolalia"},correct:"A",rationale:"Illogicality describes conclusions that do not logically follow from their premises -- a formal thought disorder distinct from tangentiality, clanging, or echolalia. (Boland Ch. 5, Table 5-1)"},{topic:"Disorganized Speech",vignette:"A 43-year-old man with schizophrenia speaks so rapidly and continuously during the interview that the clinician has difficulty interjecting a single question.",question:"This finding is best described as:",options:{A:"Pressure of speech",B:"Thought blocking",C:"Perseveration",D:"Circumstantiality"},correct:"A",rationale:"Pressure of speech describes rapid, driven speech that is difficult to interrupt -- one of the formal thought disorder patterns listed in Boland Table 5-1. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 22-year-old man is started on a high-potency FGA in the emergency department for acute agitation.",question:"Which patient characteristic is most classically associated with elevated risk for acute dystonic reactions?",options:{A:"Young age and male sex",B:"Advanced age and female sex",C:"Long-term antipsychotic exposure of several years",D:"Concurrent use of an anticholinergic"},correct:"A",rationale:"Young men on high-potency FGAs are classically at highest risk for acute dystonic reactions, which is why prophylactic anticholinergics are sometimes considered in this specific population. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 55-year-old woman on a long-term antipsychotic develops bradykinesia, cogwheel rigidity, and a resting tremor over several weeks.",question:"Which of the four EPS subtypes does this represent?",options:{A:"Acute dystonia",B:"Akinesia/drug-induced parkinsonism",C:"Akathisia",D:"Tardive dyskinesia"},correct:"B",rationale:"The classic parkinsonism triad (bradykinesia, rigidity, tremor), developing over days to weeks, is drug-induced parkinsonism/akinesia -- distinct from the sudden-onset dystonia, subjective restlessness of akathisia, or the choreoathetoid movements of TD that develop after months to years. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient develops subjective restlessness and pacing shortly after an antipsychotic dose increase; the prescriber considers first-line treatment.",question:"Which medication class is considered first-line specifically for this EPS subtype, distinct from the others?",options:{A:"Anticholinergics",B:"Beta-blockers",C:"VMAT2 inhibitors",D:"Dopamine agonists"},correct:"B",rationale:"Beta-blockers (e.g., propranolol) are first-line for akathisia specifically -- unlike dystonia and parkinsonism, where anticholinergics are first-line, or tardive dyskinesia, where VMAT2 inhibitors are used. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A patient newly started on clozapine for its suicidality-reduction indication asks about the required blood monitoring schedule.",question:"Which schedule accurately reflects the REMS-mandated ANC monitoring for clozapine?",options:{A:"Monthly monitoring for the entire duration of treatment, with no changes over time",B:"Weekly for the first 6 months, biweekly for the next 6 months, then monthly thereafter",C:"A single baseline check with no further monitoring required",D:"Annual monitoring only"},correct:"B",rationale:"Clozapine's REMS program requires weekly ANC monitoring for the first 6 months, biweekly for the next 6 months, then monthly thereafter, given agranulocytosis risk. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A prescriber is explaining to a patient's family why clozapine is being recommended specifically for a diagnosis of schizophrenia with recurrent suicidal behavior, rather than lithium.",question:"What is the most accurate explanation for choosing clozapine over lithium here?",options:{A:"Lithium has no role in suicide risk reduction for any condition",B:"Clozapine has an FDA-approved indication for suicidality specifically in schizophrenia/schizoaffective disorder, while lithium's strongest suicide-risk evidence is in mood disorders",C:"Clozapine and lithium are interchangeable for this indication",D:"Lithium is preferred for schizophrenia-related suicidality"},correct:"B",rationale:"Clozapine's FDA-approved suicidality indication is specific to schizophrenia/schizoaffective disorder, while lithium's strongest suicide-risk-reduction evidence lies in mood disorders (bipolar disorder, recurrent MDD) -- the diagnosis determines which medication has the stronger evidence base. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A prescriber is starting a high-potency FGA in a young male patient and considers whether to co-prescribe a prophylactic anticholinergic.",question:"In which situation does Boland suggest prophylactic anticholinergics may be considered?",options:{A:"In all patients starting any antipsychotic, regardless of risk factors",B:"In high-risk patients, such as young men on high-potency FGAs or those with prior EPS sensitivity",C:"Only in elderly patients with tardive dyskinesia",D:"Anticholinergics should never be used prophylactically"},correct:"B",rationale:"Boland Ch. 5 notes that prophylactic anticholinergics may be considered specifically in high-risk patients -- young men on high-potency FGAs or those with a prior history of EPS sensitivity -- rather than universally in all patients. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A patient on a long-term antipsychotic is noted at a routine visit to have a new BARS score indicating significant symptoms.",question:"Which EPS subtype is the BARS scale specifically designed to monitor?",options:{A:"Acute dystonia",B:"Drug-induced parkinsonism",C:"Akathisia",D:"Tardive dyskinesia"},correct:"C",rationale:"The Barnes Akathisia Rating Scale (BARS) is specifically designed to assess and monitor akathisia, distinct from the AIMS, which monitors tardive dyskinesia. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"During an interview, a 64-year-old patient displays a narrow range of emotional expression, with only subtle changes in facial expression regardless of the topic discussed, though he is not entirely flat.",question:"Which affect descriptor best fits this finding?",options:{A:"Full range",B:"Constricted/restricted",C:"Labile",D:"Euthymic"},correct:"B",rationale:"Constricted (or restricted) affect describes a reduction in the range and intensity of emotional expression that is less se
