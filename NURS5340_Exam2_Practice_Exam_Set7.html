ual treatment",B:"It has been particularly successful with survivors of shared catastrophic events, reducing isolation",C:"It is only appropriate for combat-related trauma",D:"It eliminates the need for pharmacotherapy"},correct:"B",rationale:"Boland Ch. 10 notes group therapy has been particularly successful with survivors of catastrophic disasters (as well as combat veterans), leveraging shared experience to reduce isolation -- not a replacement for other treatment modalities. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 52-year-old man with PTSD and significant marital strain is starting treatment. His spouse also struggles to understand his symptoms.",question:"Which modality does Boland specifically note as useful for this situation?",options:{A:"Family therapy",B:"Psychoanalysis only",C:"Electroconvulsive therapy",D:"Hypnosis alone"},correct:"A",rationale:"Boland Ch. 10 notes family therapy is effective for PTSD, particularly when relational strain and family understanding of the illness are part of the clinical picture. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 60-year-old man with PTSD is prescribed an SNRI after not tolerating two different SSRIs.",question:"Which SNRI is supported for this indication?",options:{A:"Duloxetine",B:"Venlafaxine",C:"Desvenlafaxine",D:"Levomilnacipran"},correct:"B",rationale:"Venlafaxine is the SNRI specifically noted in Boland Ch. 10 as having a strong evidence base for PTSD, positioned as a reasonable option after SSRI intolerance. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 66-year-old man with PTSD reports his trauma-related nightmares are improving on prazosin, but he now also has new orthostatic dizziness.",question:"What is the most appropriate initial action?",options:{A:"Immediately discontinue prazosin without follow-up",B:"Reassess his dose and monitor orthostatic symptoms, since alpha-1 blockade can cause hypotension",C:"Add a second alpha-1 antagonist",D:"Ignore the symptom since it is unrelated to the medication"},correct:"B",rationale:"Prazosin's alpha-1 antagonism can cause orthostatic hypotension; dose reassessment and monitoring is the appropriate first step rather than abrupt discontinuation or an unrelated addition. (Boland Ch. 10; general psychopharmacology)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 36-year-old man is 6 days out from surviving a building collapse, with intrusive memories, numbing, and severe anxiety.",question:"Which diagnosis is most appropriate at this point?",options:{A:"PTSD",B:"Acute Stress Disorder",C:"Panic Disorder",D:"Brief Psychotic Disorder"},correct:"B",rationale:"At 6 days post-trauma, he is within the ASD window (3 days\u20131 month). PTSD requires symptoms to persist beyond 1 month. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 58-year-old woman has recurring, unprovoked episodes of dread and sweating that occur regardless of setting or activity, with no history of any traumatic event.",question:"What single feature makes Panic Disorder more likely than a trauma-related disorder here?",options:{A:"The episodes involve sweating",B:"No trauma/stressor exposure is present in her history",C:"She is older",D:"The episodes are recurrent"},correct:"B",rationale:"PTSD and ASD require a Criterion A trauma exposure; her history has none, pointing toward Panic Disorder, which requires no trauma trigger. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 63-year-old man's trauma-related symptoms have persisted continuously for 9 months following an assault.",question:"Which diagnosis applies given this duration?",options:{A:"Acute Stress Disorder",B:"PTSD",C:"Adjustment Disorder only",D:"Brief Psychotic Disorder"},correct:"B",rationale:"Symptoms persisting well beyond 1 month satisfy PTSD's Criterion F duration requirement. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A clinician explains that patients with PTSD often show reduced top-down inhibitory control over fear responses.",question:"Which brain region's hypoactivity is most responsible for this finding?",options:{A:"Medial prefrontal cortex",B:"Cerebellum",C:"Primary visual cortex",D:"Thalamus"},correct:"A",rationale:"The medial prefrontal cortex normally exerts top-down inhibitory control over the amygdala; its hypoactivity in PTSD contributes to exaggerated, poorly-regulated fear responses. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 39-year-old man with OCD is beginning ERP. His therapist has him touch a doorknob he considers contaminated and then refrain from washing his hands.",question:"What is the therapeutic principle behind preventing the handwashing?",options:{A:"It has no specific purpose, just discomfort tolerance",B:"It blocks the compulsion so the patient learns the feared outcome does not occur and anxiety naturally declines",C:"It punishes the patient for the obsession",D:"It replaces one compulsion with another"},correct:"B",rationale:"Response prevention is the core mechanism of ERP -- blocking the compulsion allows the patient to learn the feared consequence doesn't occur and that anxiety declines on its own without the ritual, breaking the obsession-compulsion cycle. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 44-year-old woman with OCD has been on an adequate clomipramine trial for 10 weeks with only minimal improvement, after previously failing two SSRIs.",question:"What should the PMHNP consider given this treatment-resistant course?",options:{A:"This is expected and no further evaluation is needed",B:"Reassess the diagnosis and consider augmentation strategies given multiple treatment failures",C:"Immediately discontinue all medication",D:"OCD is not medication-responsive at all"},correct:"B",rationale:"Multiple adequate medication trial failures should prompt diagnostic reassessment and consideration of augmentation strategies -- OCD is medication-responsive, but treatment-resistant presentations require a structured reassessment. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 31-year-old man has intrusive religious doubts that he finds distressing and repeatedly seeks reassurance from his pastor, without any physical ritual.",question:"Which OCD pattern does this represent?",options:{A:"Contamination/cleansing",B:"Symmetry/ordering",C:"Intrusive/forbidden thoughts",D:"Hoarding-type concerns"},correct:"C",rationale:"Ego-dystonic intrusive thoughts (here, religious) without an accompanying physical ritual, but with reassurance-seeking, is the intrusive/forbidden thoughts pattern. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 67-year-old widower refuses to attend his grandson's wedding because it will be held in a large banquet hall, fearing he won't be able to leave if he feels unwell.",question:"Which agoraphobia situation is being described?",options:{A:"Using public transportation",B:"Being in enclosed places or crowds",C:"Being outside the home alone",D:"Standing in an open field"},correct:"B",rationale:"Fear of being unable to escape a large enclosed gathering is one of the defining agoraphobia situations under Criterion A. (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A 45-year-old woman meets full criteria for both Panic Disorder and Agoraphobia.",question:"How should the PMHNP approach documentation of her diagnoses?",options:{A:"Only Panic Disorder should be documented",B:"Only Agoraphobia should be documented",C:"Both diagnoses should be documented, since DSM-5 treats them as independent conditions",D:"Neither can be diagnosed simultaneously"},correct:"C",rationale:"Since DSM-5, Agoraphobia is diagnosed independently of Panic Disorder; if criteria for both are met, both are documented. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 41-year-old woman is taught to breathe into a paper bag and practice slow, controlled breathing at the first sign of a panic attack.",question:"What is this technique primarily intended to address?",options:{A:"Cognitive distortions about the meaning of symptoms",B:"Hyperventilation-related physical symptoms during an attack",C:"The underlying trauma causing the attacks",D:"Long-term prevention with no acute benefit"},correct:"B",rationale:"Breathing retraining/relaxation techniques target the acute hyperventilation-related physical symptoms (dizziness, paresthesias) that occur during a panic attack. (Boland Ch. 8, Table 8-7)"},{topic:"Panic Disorder",vignette:"A 49-year-old man's panic attacks are found to involve abnormal peripheral levels of a neurosteroid.",question:"Which of the following is implicated per Boland's neurochemical review of panic disorder?",options:{A:"Allopregnanolone",B:"Estrogen exclusively",C:"Testosterone",D:"Cortisol only"},correct:"A",rationale:"Boland Ch. 8 notes abnormal peripheral allopregnanolone levels have been reported in some panic disorder studies, though findings are inconsistent. (Boland Ch. 8, Table 8-9)"},{topic:"Panic Disorder",vignette:"A 35-year-old woman with panic disorder has had a partial response to sertraline after 6 weeks at a moderate dose.",question:"What is the most appropriate next step?",options:{A:"Switch immediately to a benzodiazepine as monotherapy",B:"Continue and consider optimizing the dose before switching, since adequate trials take time",C:"Discontinue all treatment",D:"Add an antipsychotic"},correct:"B",rationale:"Pharmacotherapy for anxiety disorders may require 8\u201312 weeks at optimum doses to assess efficacy; optimizing the current medication is reasonable before switching. (Boland Ch. 8, Table 8-7)"},{topic:"SAD vs. Specific Phobia",vignette:"A 38-year-old man avoids all group activities at work -- meetings, lunches, team events -- fearing he will say something embarrassing and be judged, though he manages one-on-one interactions fine.",question:"Which diagnosis fits best?",options:{A:"Specific phobia",B:"Social Anxiety Disorder",C:"Agoraphobia",D:"GAD"},correct:"B",rationale:"Fear of negative judgment across a range of social situations (not limited to a single object/situation) is characteristic of Social Anxiety Disorder rather than a specific phobia. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 54-year-old man has an intense, longstanding fear of deep water that began after a near-drowning experience decades ago.",question:"Which specific phobia subtype does this represent?",options:{A:"Animal type",B:"Natural environment type",C:"Situational type",D:"Blood-injection-injury type"},correct:"B",rationale:"Fear of natural environment phenomena such as water, storms, or heights is classified as the natural environment type of specific phobia. (DSM-5-TR)"},{topic:"GAD",vignette:"A 46-year-old woman recognizes her worry about her job, health, and finances is excessive but reports she cannot stop it once it begins, despite trying hard to control it.",question:"Which GAD criterion does this describe?",options:{A:"Criterion A only",B:"Criterion B (difficulty controlling the worry)",C:"Criterion E",D:"Criterion F"},correct:"B",rationale:"Criterion B specifically requires that the individual finds it difficult to control the worry, distinct from Criterion A (worry is excessive and spans multiple domains). (DSM-5-TR)"},{topic:"GAD",vignette:"A 58-year-old man with GAD and mild renal impairment needs a medication that avoids extensive hepatic or renal dosing complications for anxiolysis, aside from an SSRI trial already underway.",question:"Which adjunct is a reasonable non-benzodiazepine, non-habit-forming option?",options:{A:"Buspirone",B:"Alprazolam",C:"Lorazepam",D:"Diazepam"},correct:"A",rationale:"Buspirone remains a non-habit-forming adjunct/alternative specific to GAD, in contrast to the benzodiazepines listed, which carry dependence risk and are not preferred long-term. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 28-year-old woman has had active psychotic symptoms meeting Criterion A for 2 months, with good premorbid functioning and confusion at onset.",question:"Which diagnosis and specifier combination fits best if she also had no blunted affect and onset within 4 weeks of her first behavioral change?",options:{A:"Schizophreniform Disorder, with good prognostic features",B:"Schizophrenia, chronic type",C:"Brief Psychotic Disorder",D:"Schizoaffective Disorder"},correct:"A",rationale:"A 2-month duration fits Schizophreniform Disorder (1\u20136 months), and meeting \u22652 of the 4 good-prognostic-features criteria (rapid onset, confusion, good premorbid functioning, absence of blunted affect) supports that specifier. (DSM-5-TR)"},{topic:"Schizophreniform Disorder",vignette:"A 33-year-old man's psychotic episode has lasted exactly 3 weeks and fully resolved.",question:"Which diagnosis fits this course, rather than Schizophreniform Disorder?",options:{A:"Schizophrenia",B:"Brief Psychotic Disorder",C:"Schizoaffective Disorder",D:"Delusional Disorder"},correct:"B",rationale:"An episode under 1 month falls short of Schizophreniform Disorder's minimum duration and instead fits Brief Psychotic Disorder. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 30-year-old man has become increasingly withdrawn and preoccupied with unusual philosophical theories over the past several months, with declining personal hygiene noted by his roommate.",question:"What is the most appropriate initial clinical approach to this presentation?",options:{A:"Reassure the family that this is normal and no follow-up is needed",B:"Conduct a thorough psychiatric evaluation, since this pattern is consistent with a possible prodromal phase",C:"Start an antipsychotic immediately without further evaluation",D:"Diagnose schizophrenia definitively at this visit"},correct:"B",rationale:"Social withdrawal, declining hygiene, and preoccupation with unusual ideas are recognized prodromal features warranting careful evaluation -- not immediate antipsychotic initiation or a premature schizophrenia diagnosis, since prodromal presentations don't yet meet full Criterion A. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 26-year-old woman's new, unexplained somatic complaints (headaches, GI upset) preceded her eventual psychotic break by several months.",question:"What does Boland note about somatic complaints in this context?",options:{A:"They are never related to prodromal schizophrenia",B:"They can be an early prodromal sign, sometimes misattributed to other causes before psychosis is recognized",C:"They only occur after the first psychotic episode",D:"They confirm a primary GI disorder"},correct:"B",rationale:"Boland Ch. 5 notes somatic complaints can be an early sign of the prodromal phase, sometimes misdiagnosed initially as an unrelated medical or somatic condition before the psychotic illness is recognized. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 43-year-old man's psychotic symptoms have persisted for 3 weeks with no mood episode present at any point during that window, though he later develops a major depressive episode concurrent with ongoing psychosis.",question:"Does the 3-week psychosis-only period support Criterion B for schizoaffective disorder?",options:{A:"No, because it must occur after the mood episode, not before",B:"Yes, \u22652 weeks of psychosis without a mood episode satisfies Criterion B",C:"No, because 3 weeks exceeds the maximum allowed",D:"Yes, but only if it lasts exactly 2 weeks"},correct:"B",rationale:"Criterion B requires \u22652 weeks of psychosis in the absence of a mood episode at ANY point during the illness -- 3 weeks satisfies this threshold regardless of when it occurs relative to mood episodes. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 49-year-old woman with schizoaffective disorder, bipolar type, is being counseled on her diagnosis.",question:"What defines the 'bipolar type' specifier?",options:{A:"Only major depressive episodes ever occur",B:"A manic episode is part of the presentation, though major depressive episodes may also occur",C:"The patient must have rapid cycling",D:"Psychosis must be absent during all mood episodes"},correct:"B",rationale:"'Bipolar type' applies when a manic episode is part of the clinical presentation; major depressive episodes may also occur, but the presence of mania is what defines this subtype. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 40-year-old man's mood episodes make up roughly 70% of his total illness duration, with the remaining time showing persistent psychosis without mood symptoms.",question:"Does this satisfy Criterion C for schizoaffective disorder?",options:{A:"No, 70% is insufficient",B:"Yes, mood symptoms present for the majority (>50%) of the total illness duration satisfies Criterion C",C:"No, Criterion C requires 100% of the duration",D:"Yes, but only if it's exactly 50%"},correct:"B",rationale:"Criterion C requires mood symptoms be present for the MAJORITY of the total illness duration; 70% clearly satisfies this. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A clinician is explaining to a patient's family why the diagnosis of schizoaffective disorder carries a different treatment approach than schizophrenia alone.",question:"What is the most clinically accurate explanation?",options:{A:"Treatment must always target only the psychotic symptoms",B:"Treatment often needs to address both mood and psychotic symptoms given the combined presentation",C:"Mood symptoms in schizoaffective disorder never require treatment",D:"Antipsychotics are never indicated in schizoaffective disorder"},correct:"B",rationale:"Because schizoaffective disorder combines mood-episode symptoms with psychotic symptoms, treatment typically must address both domains -- distinguishing its management approach from schizophrenia alone. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 50-year-old man with schizophrenia has poverty of speech content and difficulty initiating conversation, though his speech is not literally reduced in amount.",question:"Which negative symptom domain does this represent?",options:{A:"Avolition",B:"Alogia",C:"Anhedonia",D:"Affective flattening"},correct:"B",rationale:"Alogia includes poverty of speech content (speaking but conveying little meaningful information), distinct from avolition (lack of motivation), anhedonia (loss of pleasure), or affective flattening (reduced emotional expression). (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A family asks why their relative's flat affect and social withdrawal haven't improved despite good control of his hallucinations on medication.",question:"What is the most accurate explanation?",options:{A:"The medication has completely failed",B:"Negative symptoms are generally more treatment-resistant than positive symptoms",C:"This means the diagnosis is wrong",D:"Negative symptoms always resolve after positive symptoms improve"},correct:"B",rationale:"Negative symptoms are well known to be more treatment-resistant than positive symptoms, which typically respond better to antipsychotics via D2 blockade. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 33-year-old man with depression and a history of a single unprovoked seizure 5 years ago is being considered for bupropion.",question:"What is the most appropriate action?",options:{A:"Prescribe bupropion at standard dose without concern",B:"Avoid bupropion given his seizure history and consider an alternative antidepressant",C:"Prescribe bupropion only in extended-release form with no other precautions",D:"Seizure history is irrelevant to antidepressant selection"},correct:"B",rationale:"Bupropion carries the highest seizure risk among antidepressants and is generally avoided in patients with a seizure history; an alternative antidepressant should be considered. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 40-year-old woman on clozapine develops a new seizure. Her current dose is 700 mg/day.",question:"What does this dose level suggest about her risk?",options:{A:"This dose carries no elevated seizure risk",B:"This dose is above the 600 mg/day threshold associated with up to 5% seizure risk",C:"Seizure risk with clozapine is unrelated to dose",D:"This dose is below any risk threshold"},correct:"B",rationale:"Boland Ch. 5 cites clozapine seizure risk reaching up to 5% at doses above 600 mg/day; her 700 mg/day dose is within this higher-risk range. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher notes persistently increased CRH concentration in a group of anxiety disorder patients and proposes a CRH-1 antagonist trial.",question:"What does Boland note about this treatment approach's track record?",options:{A:"It has shown strong, consistent efficacy",B:"CRH-1 receptor antagonists have, to date, failed to demonstrate efficacy in clinical trials",C:"It is already FDA-approved for GAD",D:"It has never been studied"},correct:"B",rationale:"Despite the theoretical rationale, Boland Ch. 8 notes CRH-1 receptor antagonists have to date failed to demonstrate efficacy in clinical trials. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 44-year-old man with an anxiety disorder shows excessive mesocortical dopamine release on functional imaging.",question:"Which medication is sometimes used adjunctively, targeting this system?",options:{A:"Bupropion",B:"Sertraline",C:"Diazepam",D:"Propranolol"},correct:"A",rationale:"Bupropion, which affects dopaminergic signaling, is sometimes used adjunctively in anxiety presentations associated with dopaminergic dysregulation per Boland's neurochemical systems table. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A 55-year-old woman with schizophrenia is convinced her thoughts are being transmitted through the television so that the news anchors can respond to them.",question:"Which symptom is this?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Thought broadcasting",D:"Delusion of control"},correct:"C",rationale:"Thought broadcasting is the delusional belief that one's own private thoughts are being transmitted outward for others (or media) to perceive. (Boland Ch. 5, Table 5-1)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 37-year-old man's hallucinations began during a 5-day period of heavy synthetic cannabinoid use and resolved within days of stopping.",question:"Which diagnosis fits this course?",options:{A:"Schizophrenia",B:"Substance/Medication-Induced Psychotic Disorder",C:"Schizoaffective disorder",D:"Delusional disorder"},correct:"B",rationale:"Symptoms tightly linked in time to substance use, resolving shortly after cessation, is the classic picture of Substance/Medication-Induced Psychotic Disorder. (DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 62-year-old man with well-controlled Parkinson's disease develops new visual hallucinations after a dopaminergic medication dose increase.",question:"What is the most appropriate initial step?",options:{A:"Immediately diagnose primary schizophrenia",B:"Consider the temporal relationship to the medication change as a possible cause",C:"Ignore the hallucinations since he has Parkinson's disease",D:"Start an antipsychotic without addressing the medication change"},correct:"B",rationale:"New psychotic symptoms that develop soon after a medication change known to be capable of producing such symptoms should prompt consideration of a medication-induced etiology as part of the initial workup. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A 45-year-old man with schizophrenia discloses that a voice is telling him to harm his neighbor.",question:"What is the most urgent clinical priority?",options:{A:"Document and move to the next topic",B:"Conduct an immediate, thorough safety assessment given the command hallucination's harm content",C:"Assume he will not act on it since he disclosed it voluntarily",D:"Defer assessment to the next visit"},correct:"B",rationale:"Command hallucinations involving harm to others always warrant an immediate, thorough safety assessment, including risk to the identified third party. (Boland Ch. 5)"},{topic:"Understanding Hallucinations",vignette:"A 58-year-old man describes a persistent sensation that his liver is 'twisting' inside him, with no medical explanation found.",question:"This unusual bodily hallucination is best classified as:",options:{A:"Tactile hallucination",B:"Cenesthetic hallucination",C:"Auditory hallucination",D:"Visual hallucination"},correct:"B",rationale:"Cenesthetic hallucinations are unfounded sensations of altered states in bodily organs -- a distinct hallucination type described in Boland's discussion of schizophrenia's clinical presentation. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 48-year-old man with schizophrenia says, 'I need to find my keys, my feet are made of glass, the president called me yesterday about the moon.'",question:"This chain of unrelated ideas without logical connection is best described as:",options:{A:"Circumstantiality",B:"Derailment (loose associations)",C:"Pressure of speech",D:"Perseveration"},correct:"B",rationale:"Derailment (loose associations) describes ideas that slip from one topic to an unrelated one in a disconnected chain -- distinct from circumstantiality, which eventually reaches the point. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 53-year-old man with schizophrenia says, 'I like the light, the light is bright, bright is a sight, sight is my delight.'",question:"This word choice governed by sound rather than meaning is best described as:",options:{A:"Clanging",B:"Word salad",C:"Tangentiality",D:"Thought blocking"},correct:"A",rationale:"Clanging describes speech in which word choice is governed by sound or rhyme rather than meaning -- illustrated here by the rhyming chain. (Boland Ch. 5, Table 5-1)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 30-year-old man develops sudden jaw spasm and difficulty speaking within a day of starting an antipsychotic.",question:"Which condition is this, and what is the appropriate treatment?",options:{A:"Tardive dyskinesia; VMAT2 inhibitor",B:"Acute dystonia; IM/IV benztropine or diphenhydramine",C:"Akathisia; propranolol",D:"Parkinsonism; amantadine"},correct:"B",rationale:"Sudden muscle contraction (here, jaw/speech muscles) within hours to a day of antipsychotic initiation is acute dystonia, treated with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 56-year-old woman on an antipsychotic for 2 weeks develops bradykinesia, rigidity, and a resting tremor.",question:"Which EPS subtype is this, and how does its onset compare to acute dystonia?",options:{A:"Akinesia/parkinsonism; onset over days to weeks, slower than dystonia's hours-to-days onset",B:"Acute dystonia; identical onset to parkinsonism",C:"Tardive dyskinesia; onset over years",D:"Akathisia; onset within minutes"},correct:"A",rationale:"Drug-induced parkinsonism develops over days to weeks, a slower onset than acute dystonia's hours-to-days presentation. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 74-year-old woman develops orofacial dyskinetic movements after 5 years on a first-generation antipsychotic. Her family asks if switching her to an anticholinergic would help.",question:"What is the most accurate response?",options:{A:"Yes, anticholinergics are first-line for this condition",B:"No, anticholinergics can worsen tardive dyskinesia and should be avoided",C:"Anticholinergics have no effect either way",D:"Anticholinergics should be combined with a VMAT2 inhibitor for best effect"},correct:"B",rationale:"Anticholinergics can worsen tardive dyskinesia and should be avoided; management instead involves dose reduction, switching agents (e.g., to clozapine), or VMAT2 inhibitors. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A 48-year-old woman with schizophrenia and a history of two suicide attempts has failed adequate trials of risperidone and olanzapine.",question:"Which medication should be strongly considered next, given both her diagnosis and history?",options:{A:"Aripiprazole",B:"Clozapine",C:"Ziprasidone",D:"Paliperidone"},correct:"B",rationale:"Clozapine is both the most effective option for treatment-resistant schizophrenia and carries an FDA-approved indication specifically for reducing suicidal behavior in this population. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A 55-year-old man with recurrent major depressive disorder and a history of a serious suicide attempt is being considered for long-term suicide risk reduction, separate from his antidepressant regimen.",question:"Which medication has the strongest evidence for this specific purpose in mood disorders?",options:{A:"Clozapine",B:"Lithium",C:"Valproate",D:"Quetiapine"},correct:"B",rationale:"Lithium has the strongest evidence base for reducing suicide risk in mood disorders, including recurrent MDD -- distinct from clozapine's role, which is specific to schizophrenia/schizoaffective disorder. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A 26-year-old man starting a high-potency FGA has no prior antipsychotic exposure and is at elevated risk for one particular EPS subtype based on his age and sex.",question:"Which EPS subtype is he at highest risk for, and should prophylaxis be considered?",options:{A:"Tardive dyskinesia; no prophylaxis exists",B:"Acute dystonia; prophylactic anticholinergics may be considered in this high-risk group",C:"Akathisia; prophylactic beta-blockers are always required",D:"Parkinsonism; no preventive measures exist"},correct:"B",rationale:"Young men on high-potency FGAs are at highest risk for acute dystonia, and Boland notes prophylactic anticholinergics may be considered specifically in this high-risk population. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A patient's EPS symptoms partially improve with an anticholinergic but residual bradykinesia and rigidity remain.",question:"What does Boland note about anticholinergic effectiveness in this context?",options:{A:"Anticholinergics always completely resolve EPS",B:"Anticholinergics are often only partially effective, and residual EPS is common",C:"Anticholinergics have no role in EPS management",D:"This indicates a new diagnosis of tardive dyskinesia"},correct:"B",rationale:"Boland Ch. 5 notes anticholinergics are often only partially effective, and patients may be left with residual extrapyramidal symptoms despite treatment. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"A 62-year-old patient reports feeling 'terrible' but the clinician observes him smiling broadly and joking throughout the encounter.",question:"How should this be documented?",options:{A:"Mood: smiling; Affect: terrible",B:"Mood: 'terrible' (patient-reported); Affect: euthymic/smiling, mood-incongruent",C:"Mood and affect must always match, so this is a charting error",D:"No documentation is needed since the presentation is contradictory"},correct:"B",rationale:"Mood is the patient's subjective report; affect is the clinician's objective observation. Incongruence between the two, as here, is itself a documented clinical finding. (Boland Ch. 1)"},{topic:"Mood vs. Affect",vignette:"A 70-year-old patient shows almost no variation in facial expression or vocal tone throughout a 45-minute interview, regardless of topic.",question:"This finding in affect is best documented as:",options:{A:"Full range",B:"Flat/blunted",C:"Labile",D:"Euthymic"},correct:"B",rationale:"A near-total absence of variation in facial expression and vocal tone describes flat or blunted affect -- a severe restriction in emotional expression. (Boland Ch. 1)"}],bt=vn.length;function xf(){let[t,l]=(0,yn.useState)(0),[e,a]=(0,yn.useState)(Array(bt).fill(null)),[n,i]=(0,yn.us
