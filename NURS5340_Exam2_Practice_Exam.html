rsist every night.",question:"Which medication is most appropriate to add specifically to target his nightmares?",options:{A:"Prazosin",B:"Clonazepam",C:"Diphenhydramine",D:"Bupropion"},correct:"A",rationale:"Prazosin, an alpha-1 adrenergic antagonist, has specific evidence for reducing trauma-related nightmares by blunting central noradrenergic tone. Benzodiazepines like clonazepam lack efficacy for core PTSD symptoms and are relatively contraindicated. Diphenhydramine and bupropion have no specific evidence for PTSD nightmares. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A rape survivor with PTSD begins a psychotherapy that involves repeated imaginal recounting of the assault memory, paired with graduated real-world (in-vivo) exposure to trauma reminders such as walking past the location of the assault.",question:"This describes which evidence-based psychotherapy for PTSD?",options:{A:"Cognitive Processing Therapy",B:"Prolonged Exposure",C:"EMDR",D:"Present-Centered Therapy"},correct:"B",rationale:"Prolonged Exposure (PE) is defined by repeated imaginal exposure (recounting the trauma memory) plus in-vivo exposure to real-world reminders, aiming to reduce avoidance and facilitate reprocessing. CPT instead targets cognitive distortions/attributions; EMDR uses bilateral stimulation paired with memory recall; PCT deliberately avoids direct trauma processing. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A psychiatric NP is starting pharmacotherapy for a patient newly diagnosed with PTSD who also has a history of alcohol use disorder in early remission.",question:"Which medication class should generally be avoided as a treatment for this patient's PTSD?",options:{A:"SSRIs",B:"SNRIs",C:"Benzodiazepines",D:"Alpha-1 antagonists"},correct:"C",rationale:"Benzodiazepines lack evidence for treating core PTSD symptoms and are considered relatively contraindicated, particularly given misuse/dependence risk -- an important consideration in a patient with a substance use history. SSRIs (sertraline/paroxetine) remain first-line. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A woman with PTSD reports that she 'can't remember big parts of what happened' during her assault, feels persistently detached from friends and family, and describes an ongoing sense that 'the world is a dangerous place I can't trust.'",question:"These symptoms best reflect which PTSD symptom cluster?",options:{A:"Intrusion",B:"Avoidance",C:"Negative alterations in cognition and mood",D:"Alterations in arousal and reactivity"},correct:"C",rationale:"Dissociative amnesia for the event, detachment from others, and persistent negative beliefs about the world are hallmark features of Criterion D (negative alterations in cognition/mood) -- distinct from re-experiencing (Criterion B), avoidance (Criterion C), and hyperarousal (Criterion E). (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 28-year-old woman was involved in a serious car accident 10 days ago. She reports intrusive memories, an inability to experience positive emotions, dissociative flashbacks, avoidance of driving, and difficulty sleeping since the accident.",question:"Which diagnosis is most appropriate given the current timeframe?",options:{A:"PTSD",B:"Acute Stress Disorder",C:"Adjustment disorder",D:"Generalized Anxiety Disorder"},correct:"B",rationale:"At 10 days post-trauma (within the 3-day-to-1-month window), Acute Stress Disorder is the appropriate diagnosis if the required symptom threshold is met (\u22659 of 14 symptoms across 5 categories). PTSD cannot be diagnosed until symptoms persist beyond 1 month. (DSM-5-TR; Boland Ch. 10)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 40-year-old man reports several episodes over the past 2 months of sudden, intense chest pain, palpitations, sweating, and a feeling of impending doom that peak within 5 minutes and resolve within 20 minutes. He denies any specific trigger and has since become persistently worried about having another episode, avoiding the gym where his first episode occurred.",question:"Which feature most clearly distinguishes his presentation from PTSD or Acute Stress Disorder?",options:{A:"The episodes are brief",B:"No identifiable trauma or stressor preceded the episodes",C:"He has physical symptoms",D:"He has avoidance behavior"},correct:"B",rationale:"Unlike PTSD/ASD, which both require a Criterion A trauma exposure, Panic Disorder requires no external trauma/stressor trigger -- attacks classically occur 'out of the blue.' Physical symptoms, brief duration, and avoidance can all occur across these conditions, so they don't reliably differentiate. (DSM-5-TR; Boland Ch. 8)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A patient meets full criteria for a trauma-related disorder that began 7 months ago and has been continuous since, including 6 additional weeks of hypervigilance and exaggerated startle beyond when her avoidance symptoms began.",question:"Given the duration described, which diagnosis applies?",options:{A:"Acute Stress Disorder",B:"Schizophreniform Disorder",C:"PTSD",D:"Brief Psychotic Disorder"},correct:"C",rationale:"Symptoms persisting past 1 month (here, 7 months) satisfy PTSD's duration requirement (Criterion F, >1 month). ASD would only apply within the first month after the trauma; schizophreniform/brief psychotic disorder pertain to an entirely different (psychotic) symptom domain not described here. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A researcher is comparing brain imaging findings in patients with chronic PTSD to healthy controls.",question:"Which pattern of findings is most consistent with the current understanding of PTSD neurobiology?",options:{A:"Decreased amygdala activity and increased hippocampal volume",B:"Increased amygdala activity, decreased hippocampal volume, and reduced prefrontal regulation",C:"Isolated cerebellar atrophy with normal amygdala function",D:"Persistently elevated cortisol identical to major depressive disorder"},correct:"B",rationale:"PTSD is classically associated with amygdala hyperactivity, reduced hippocampal volume/activity impairing fear-extinction learning, and reduced prefrontal cortical top-down inhibition of the amygdala. Unlike chronic stress/depression, PTSD cortisol is often low/blunted rather than persistently elevated -- a key distinguishing feature. (Standard psychiatric neuroscience; supplementary to Boland Ch. 10, which covers genetic risk factors)"},{topic:"OCD",vignette:"A 24-year-old man spends over 3 hours daily performing handwashing rituals due to intrusive thoughts about contamination. He recognizes his beliefs are 'probably not true' but cannot resist the urge to wash.",question:"Which insight specifier applies to this patient?",options:{A:"With absent insight/delusional beliefs",B:"With poor insight",C:"With good or fair insight",D:"With tic-related features"},correct:"C",rationale:"'Good or fair insight' applies when the patient recognizes OCD beliefs are definitely or probably not true, as in this case. 'Poor insight' means the patient thinks the beliefs are probably true; 'absent insight/delusional' means complete conviction the beliefs are true. (DSM-5-TR)"},{topic:"OCD",vignette:"A patient with OCD has failed an adequate 12-week trial of fluoxetine at the maximal tolerated dose.",question:"Which medication is an evidence-based next step, despite a less favorable side-effect profile?",options:{A:"Buspirone",B:"Clomipramine",C:"Prazosin",D:"Propranolol"},correct:"B",rationale:"Clomipramine, a tricyclic/serotonin reuptake inhibitor, has head-to-head evidence showing equal efficacy to SSRIs for OCD but worse tolerability (anticholinergic effects, seizure threshold lowering, cardiotoxicity in overdose) -- making it a reasonable next step after SSRI failure. Buspirone lacks OCD evidence; prazosin and propranolol are not indicated. (Boland Ch. 9)"},{topic:"OCD",vignette:"A patient describes hours-long rituals of arranging objects with exact symmetry before she can leave a room, stating, 'if it's not perfect, something bad will happen.'",question:"This presentation is most consistent with which OCD symptom pattern?",options:{A:"Contamination/cleansing",B:"Pathologic doubt/checking",C:"Symmetry/ordering",D:"Intrusive/forbidden thoughts"},correct:"C",rationale:"The need for exactness/symmetry leading to compulsive slowness is the hallmark of the symmetry/ordering pattern. Contamination/cleansing involves washing; pathologic doubt/checking involves repeated checking behaviors (locks, stoves); intrusive/forbidden thoughts involve ego-dystonic sexual/aggressive/religious obsessions without a compulsion. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 45-year-old woman avoids grocery stores, movie theaters, and public buses because she fears she won't be able to escape or get help if she starts to feel panicky. She has never met full criteria for panic disorder but has had these fears for the past 8 months and requires her husband to accompany her whenever she leaves home.",question:"Which diagnosis best fits this presentation?",options:{A:"Panic Disorder",B:"Specific phobia, situational type",C:"Agoraphobia",D:"Social Anxiety Disorder"},correct:"C",rationale:"Fear of \u22652 situations (enclosed places, crowds, public transportation) due to difficulty escaping or getting help, with avoidance/companion requirement for \u22656 months, is classic agoraphobia -- diagnosed independently of panic disorder since DSM-5, even without ever meeting full panic disorder criteria. (DSM-5-TR; Boland Ch. 8)"},{topic:"Agoraphobia",vignette:"A patient with severe agoraphobia has become essentially housebound over the past year, refusing to leave home even for medical appointments.",question:"What does this presentation most likely reflect, per Boland?",options:{A:"A mild, self-limiting phobia unlikely to require treatment",B:"One of the most disabling of the phobias due to its severe impact on work and social functioning",C:"A symptom of an unrelated primary sleep disorder",D:"A normal variant of situational caution"},correct:"B",rationale:"Boland Ch. 8 specifically describes agoraphobia as potentially the most disabling of the phobias, given how significantly it can interfere with a person's ability to function in work and social situations outside the home -- severely affected patients may refuse to leave the house entirely. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"A patient reports a single, isolated episode last month of sudden chest tightness, dizziness, and fear of dying that resolved within 10 minutes, with no recurrence and no ongoing worry about future episodes.",question:"Does this patient meet full criteria for Panic Disorder?",options:{A:"Yes, one panic attack is sufficient for diagnosis",B:"No, because Criterion B (\u22651 month of worry/behavior change) has not been met",C:"Yes, because the episode included \u22654 physical symptoms",D:"No, because panic attacks must be triggered by an identifiable stressor"},correct:"B",rationale:"A single panic attack is necessary but not sufficient for Panic Disorder -- Criterion B requires at least 1 month of persistent worry about additional attacks or a significant behavioral change following an attack. Without ongoing worry/avoidance, full diagnostic criteria are not met. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A patient with panic disorder is started on an SSRI. While waiting for the medication to reach full effect, the NP considers a short-term adjunct for rapid symptom control.",question:"Which is an appropriate short-term bridging strategy?",options:{A:"Long-term benzodiazepine monotherapy",B:"A brief course of a benzodiazepine while the SSRI takes effect",C:"Discontinuing the SSRI in favor of buspirone",D:"Adding clomipramine"},correct:"B",rationale:"Benzodiazepines can appropriately bridge acute symptom relief while an SSRI/SNRI reaches full effect but are not preferred as long-term monotherapy given dependence risk. Buspirone lacks efficacy for panic disorder; clomipramine is an OCD-specific alternative. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"Neuroimaging research in panic disorder implicates overactivity of a specific noradrenergic brainstem nucleus during attacks.",question:"Which structure is most classically implicated?",options:{A:"Locus coeruleus",B:"Substantia nigra",C:"Nucleus accumbens",D:"Dorsal raphe nucleus"},correct:"A",rationale:"The locus coeruleus, the brain's primary noradrenergic nucleus, is classically implicated in panic disorder -- its overactivity is thought to drive the autonomic surge characteristic of panic attacks. The substantia nigra relates to dopaminergic/GABA pathways, the nucleus accumbens to reward/dopamine, and the dorsal raphe to serotonergic output. (Boland Ch. 8, Table 8-9)"},{topic:"SAD vs. Specific Phobia",vignette:"A college student avoids giving presentations in class, fearing he will visibly tremble and be humiliated in front of classmates, though he has no difficulty with one-on-one conversations or being observed while eating.",question:"Which specifier best fits this presentation, assuming full criteria for the disorder are met?",options:{A:"Performance only",B:"With poor insight",C:"Situational type",D:"Generalized type"},correct:"A",rationale:"When social anxiety is restricted specifically to performing/speaking in public (rather than a broader range of social interactions), the 'performance only' specifier for Social Anxiety Disorder applies. Insight specifiers apply to OCD, not SAD; 'situational type' is a specific phobia specifier. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A patient becomes lightheaded and faints whenever she receives a blood draw, and has done so consistently since childhood, leading her to avoid all medical procedures involving needles.",question:"Which diagnosis and mechanism best fit this presentation?",options:{A:"Specific phobia, blood-injection-injury type, with a vasovagal response",B:"Panic disorder, with a typical sympathetic surge",C:"Social anxiety disorder, performance only type",D:"Agoraphobia, related to fear of medical settings"},correct:"A",rationale:"Blood-injection-injury (BII) type specific phobia is unique among the phobias for provoking a vasovagal (fainting) response rather than the typical sympathetic activation/panic-like surge seen in other phobia types or panic disorder. (DSM-5-TR; Boland Ch. 8)"},{topic:"GAD",vignette:"A 35-year-old teacher presents with 8 months of excessive worry about her job performance, finances, and her children's health. She reports that even when she tries to relax, she cannot set these worries aside, and she has developed tension headaches, fatigue, and trouble falling asleep.",question:"Which diagnosis is most consistent with this presentation?",options:{A:"Panic Disorder",B:"Generalized Anxiety Disorder",C:"Adjustment disorder with anxiety",D:"Illness Anxiety Disorder"},correct:"B",rationale:"Excessive, hard-to-control worry about multiple everyday domains (work, finances, family) for \u22656 months, with associated somatic symptoms (muscle tension, fatigue, sleep disturbance) and an inability to 'set worries aside,' is the classic GAD presentation. (DSM-5-TR; Boland Ch. 8)"},{topic:"GAD",vignette:"An NP is choosing a medication for a patient with GAD who has a history of substance misuse and specifically wants to avoid habit-forming medications.",question:"Which medication would be most appropriate given this history?",options:{A:"Alprazolam",B:"Buspirone",C:"Diazepam",D:"Lorazepam"},correct:"B",rationale:"Buspirone is a non-habit-forming option specifically useful for GAD (though it is not effective for panic disorder and has no acute/PRN role, since it takes weeks to reach effect). The benzodiazepines listed all carry dependence risk and are not preferred given this patient's history. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 22-year-old man has experienced delusions and disorganized speech continuously for 3 months, with no mood episode present during this time and no functional decline noted by his family.",question:"Which diagnosis is most likely at this point in his illness course?",options:{A:"Schizophrenia",B:"Schizophreniform Disorder",C:"Brief Psychotic Disorder",D:"Schizoaffective Disorder"},correct:"B",rationale:"An episode duration of \u22651 month but <6 months, with Criterion A symptoms met, is Schizophreniform Disorder -- notably, unlike schizophrenia, a decline in functioning is not a required criterion for this diagnosis. Schizophrenia requires \u22656 months; brief psychotic disorder requires <1 month. (DSM-5-TR; Boland Ch. 5)"},{topic:"Schizophreniform Disorder",vignette:"A patient diagnosed with Schizophreniform Disorder had sudden onset of psychotic symptoms within 3 weeks of a noticeable change in behavior, presented with confusion and perplexity, had good premorbid social functioning, and shows no blunted affect.",question:"Which specifier applies to this presentation?",options:{A:"With catatonia",B:"With good prognostic features",C:"With poor prognostic features",D:"Provisional"},correct:"B",rationale:"'With good prognostic features' requires \u22652 of: onset of psychotic symptoms within 4 weeks of the first noticeable behavioral change, confusion/perplexity, good premorbid functioning, and absence of blunted/flat affect -- this patient meets all four. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 17-year-old previously high-achieving student has withdrawn from friends over the past year, dropped out of the soccer team, and now spends most of his time alone reading about conspiracy theories. His parents also note chronic headaches and stomachaches with no medical explanation, and his grades have declined sharply.",question:"This presentation is most consistent with which phase of illness?",options:{A:"Active-phase schizophrenia",B:"Prodromal phase of schizophrenia",C:"Schizoaffective disorder, depressive type",D:"Malingering"},correct:"B",rationale:"Social withdrawal, functional/academic decline, unexplained somatic complaints, and increasing preoccupation with unusual ideas are classic prodromal features that often precede frank psychotic symptoms by months to years -- notably, positive symptoms like hallucinations/delusions are not yet described here. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A clinician evaluating an adolescent for early signs of a psychotic disorder notes new-onset obsessive-compulsive behaviors that were absent in childhood.",question:"How should this finding be interpreted in this context?",options:{A:"It rules out a psychotic illness",B:"It can be part of the prodromal picture of schizophrenia",C:"It confirms a primary OCD diagnosis",D:"It suggests a substance-induced etiology"},correct:"B",rationale:"Boland notes that some adolescents show a sudden onset of obsessive-compulsive behavior as part of the prodromal picture preceding schizophrenia -- this alone doesn't confirm psychosis, but it is a recognized prodromal feature rather than something that rules out or confirms an alternative diagnosis. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A patient experienced a 3-week major depressive episode with concurrent auditory hallucinations and persecutory delusions. Once the depressive episode resolved, the hallucinations and delusions also completely resolved.",question:"Is a diagnosis of Schizoaffective Disorder appropriate here?",options:{A:"Yes, because psychotic symptoms occurred during a mood episode",B:"No, because psychotic symptoms never occurred for \u22652 weeks in the absence of a mood episode",C:"Yes, because the episode lasted more than 2 weeks",D:"No, because the patient never had a manic episode"},correct:"B",rationale:"The defining feature of Schizoaffective Disorder (Criterion B) is that delusions or hallucinations occur for \u22652 weeks in the ABSENCE of a mood episode at some point in the illness. Since psychotic symptoms here only occurred during the mood episode and resolved with it, this presentation instead fits Major Depressive Disorder with psychotic features. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A patient has chronic auditory hallucinations that persist during both depressive episodes and euthymic periods, but her depressive episodes have made up only about 20% of her total 5-year illness course.",question:"Which criterion for Schizoaffective Disorder is NOT met in this case?",options:{A:"Criterion A (mood episode concurrent with Criterion A symptoms of schizophrenia)",B:"Criterion B (\u22652 weeks of psychosis without a mood episode)",C:"Criterion C (mood symptoms present for the majority of the total illness duration)",D:"Criterion D (not attributable to a substance or medical condition)"},correct:"C",rationale:"Criterion C requires that mood-episode symptoms be present for the MAJORITY of the total active/residual illness duration. If depressive episodes account for only 20% of the illness course, this criterion fails, even if Criteria A, B, and D might otherwise be satisfied. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A patient with schizoaffective disorder has experienced only major depressive episodes throughout her illness course and has never had a manic or hypomanic episode.",question:"Which subtype specifier applies?",options:{A:"Bipolar type",B:"Depressive type",C:"Mixed type",D:"Unspecified type"},correct:"B",rationale:"'Depressive type' applies when only major depressive episodes are part of the presentation; 'Bipolar type' applies if a manic episode is present (major depressive episodes may also occur in that subtype). (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 47-year-old woman has a decade-long history of chronic auditory hallucinations that intensify during depressive episodes but persist even when her mood is euthymic. She has been unable to maintain steady employment and lives alone.",question:"This clinical picture is most classic for which diagnosis?",options:{A:"Major depressive disorder with psychotic features",B:"Schizoaffective disorder",C:"Brief psychotic disorder",D:"Delusional disorder"},correct:"B",rationale:"The persistence of hallucinations independent of mood state, combined with a chronic course and significant functional impairment, is the classic presentation of Schizoaffective Disorder described in Boland Ch. 5 -- distinct from MDD with psychotic features, where psychosis would resolve alongside the mood episode. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A patient with chronic schizophrenia shows minimal facial expression, speaks very little, has lost interest in previously enjoyed hobbies, and rarely initiates social contact. He denies any current hallucinations or delusions.",question:"These findings are best classified as which type of symptom?",options:{A:"Positive symptoms",B:"Negative symptoms",C:"Cognitive symptoms",D:"Extrapyramidal symptoms"},correct:"B",rationale:"Affective flattening, alogia, avolition, and asociality are classic negative symptoms -- defined by the ABSENCE of normal function. They are typically more persistent and harder to treat than positive symptoms (hallucinations, delusions), which are absent here. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A psychiatric NP explains to a family that certain symptoms of their loved one's schizophrenia are less likely to improve significantly with a first-generation antipsychotic.",question:"Which category of symptoms is being described?",options:{A:"Positive symptoms",B:"Negative symptoms",C:"Prodromal symptoms",D:"Catatonic symptoms"},correct:"B",rationale:"Negative symptoms respond poorly to first-generation antipsychotics, with second-generation agents offering only modest additional benefit -- unlike positive symptoms, which generally respond well to both drug classes via D2 blockade. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A patient with treatment-resistant depression and a history of bulimia nervosa is being considered for bupropion.",question:"What is the primary safety concern with this choice?",options:{A:"Bupropion has no antidepressant efficacy",B:"Bupropion lowers the seizure threshold, and eating disorders further increase this risk",C:"Bupropion causes significant weight gain in this population",D:"Bupropion is contraindicated in all psychiatric patients"},correct:"B",rationale:"Bupropion carries the highest seizure risk among antidepressants, particularly above 450 mg/day or with rapid titration; this risk is compounded in patients with eating disorders due to electrolyte disturbances that further lower the seizure threshold -- making it relatively contraindicated in this population. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A patient with treatment-resistant schizophrenia is started on a medication known for superior efficacy but requiring counseling about a specific dose-dependent risk that increases substantially above 600 mg/day.",question:"Which medication and risk does this describe?",options:{A:"Risperidone; agranulocytosis",B:"Clozapine; seizures",C:"Haloperidol; tardive dyskinesia",D:"Olanzapine; hyperprolactinemia"},correct:"B",rationale:"Clozapine's seizure risk is dose-dependent, reaching as high as 5% in patients on doses above 600 mg/day per Boland Ch. 5 -- a specific, well-known threshold. Agranulocytosis is also a clozapine risk (managed via ANC/REMS monitoring, ~0.3% incidence) but is not the dose-dependent risk being described here. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher studying anxiety disorders finds that patients demonstrate low postsynaptic 5-HT1A receptor activity.",question:"This finding is most classically associated with which conditions?",options:{A:"Panic disorder and social anxiety disorder",B:"GAD and OCD only",C:"Specific phobia only",D:"Schizophrenia and bipolar disorder"},correct:"A",rationale:"Low postsynaptic 5-HT1A receptor activity has been implicated specifically in panic disorder and social anxiety disorder, providing part of the rationale for SSRI/SNRI efficacy in these conditions. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A patient with performance-related social anxiety is prescribed a medication to take as needed before public speaking engagements, targeting peripheral autonomic symptoms like tremor and tachycardia.",question:"Which medication class is being used, and which neurotransmitter system does it target?",options:{A:"SSRI; serotonergic system",B:"Beta-blocker; noradrenergic system",C:"Benzodiazepine; GABAergic system",D:"TCA; noradrenergic and serotonergic systems"},correct:"B",rationale:"Beta-blockers like propranolol target the noradrenergic system and are specifically used for performance-related/situational anxiety to blunt physical autonomic symptoms -- distinct from the chronic, first-line role of SSRIs/SNRIs in most anxiety disorders. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A patient with schizophrenia states, 'Everyone on the bus could hear what I was thinking -- my thoughts were being played out loud for everyone to know.'",question:"This is an example of which symptom?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Thought broadcasting",D:"Ideas of reference"},correct:"C",rationale:"Thought broadcasting is the delusional belief that one's private thoughts are being transmitted/broadcast so others can hear or know them -- distinct from thought insertion (thoughts placed into the mind by an outside force) and thought withdrawal (thoughts being removed). Both are Schneiderian first-rank symptoms of schizophrenia. (Boland Ch. 5, Table 5-1; DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A patient developed vivid auditory and visual hallucinations during a 3-day methamphetamine binge. Two months after complete abstinence with no further substance use, the hallucinations persist unchanged and she now also endorses several negative symptoms.",question:"Which diagnosis is now more likely, given the persistence of symptoms?",options:{A:"Substance/Medication-Induced Psychotic Disorder",B:"A primary (independent) psychotic disorder",C:"Delirium",D:"Normal substance withdrawal"},correct:"B",rationale:"Persistence of psychotic symptoms for a substantial period (about 1 month or more per DSM-5-TR) after cessation of acute intoxication/withdrawal is evidence pointing AWAY from a substance-induced etiology and toward an independent primary psychotic disorder. (DSM-5-TR; Boland Ch. 5)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A patient presents with new-onset delusions that began during a corticosteroid course for a rheumatologic condition, with no prior psychiatric history.",question:"To diagnose Substance/Medication-Induced Psychotic Disorder, which additional criterion must be confirmed?",options:{A:"The delusions must persist for more than 6 months",B:"The medication must be capable of producing psychotic symptoms and the timeline must fit",C:"The patient must also have hallucinations",D:"The patient must have a family history of psychosis"},correct:"B",rationale:"Criterion B requires evidence that (1) the psychotic symptoms developed during or soon after the substance/medication exposure, AND (2) the substance/medication is capable of producing such symptoms (corticosteroids are a recognized cause) -- both components must be established. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A patient with chronic schizophrenia reports ongoing auditory hallucinations of voices commenting on his actions, as well as occasional visual hallucinations of shadowy figures.",question:"According to Boland, how should these findings be interpreted?",options:{A:"Both are unusual and should prompt an urgent medical workup",B:"Both auditory and visual hallucinations are common in schizophrenia itself",C:"The visual hallucinations alone suggest a medical/organic cause",D:"Neither type of hallucination is consistent with schizophrenia"},correct:"B",rationale:"Per Boland Ch. 5, both auditory and visual hallucinations are common in schizophrenia; it is specifically tactile, olfactory, and gustatory hallucinations that are 'unusual' in primary psychosis and should prompt consideration of an underlying medical/neurologic cause. (Boland Ch. 5)"},{topic:"Understanding Hallucinations",vignette:"A patient in alcohol withdrawal reports a sensation of insects crawling on his skin.",question:"This finding is best classified as which type of hallucination, and what does it suggest?",options:{A:"Auditory hallucination; classic for schizophrenia",B:"Tactile hallucination; classically associated with stimulant use or alcohol withdrawal",C:"Olfactory hallucination; suggests temporal lobe epilepsy",D:"Gustatory hallucination; suggests a mood disorder"},correct:"B",rationale:"Tactile hallucinations, including formication (the sensation of insects crawling on/under the skin), are classically associated with stimulant intoxication and alcohol withdrawal (delirium tremens) -- an 'unusual' hallucination type that should prompt consideration of a medical/substance-related cause. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"When asked how she has been sleeping, a patient with schizophrenia responds, 'Sleeping, yes, the moon sleeps too, and moons are made of cheese, and cheese comes from cows, and cows are sacred in some countries...'",question:"This pattern of speech is best described as:",options:{A:"Circumstantiality",B:"Tangentiality",C:"Derailment (loose associations)",D:"Clanging"},correct:"C",rationale:"Derailment (loose associations) describes ideas that slip from one topic to a loosely or unrelated one, as shown in this chain of disconnected associations. Circumstantiality eventually returns to the original point (this patient never does); tangentiality gives one oblique, irrelevant answer rather than wandering topic-to-topic; clanging is speech governed by rhyme/sound. (Boland Ch. 5, Table 5-1)"},{topic:"Disorganized Speech",vignette:"A patient responds to 'What did you have for breakfast?' with a 5-minute answer full of excessive, unnecessary detail about his entire morning routine before eventually answering, 'eggs.'",question:"This speech pattern is best described as:",options:{A:"Tangentiality",B:"Circumstantiality",C:"Incoherence",D:"Thought blocking"},correct:"B",rationale:"Circumstantiality involves excessive, unnecessary detail before eventually reaching the point -- unlike tangentiality, which never returns to answer the original question. Circumstantiality is more classically associated with anxiety, OCD, or mania than with schizophrenia specifically. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"Within 24 hours of receiving an IM dose of haloperidol, a patient develops sudden, sustained neck twisting, and his eyes roll upward involuntarily.",question:"Which condition is this, and what is the appropriate immediate treatment?",options:{A:"Tardive dyskinesia; switch to clozapine",B:"Acute dystonia; IM/IV benztropine or diphenhydramine",C:"Akathisia; propranolol",D:"Drug-induced parkinsonism; amantadine"},correct:"B",rationale:"Sudden, sustained muscle contraction (torticollis, oculogyric crisis) within hours to days of antipsychotic initiation is classic acute dystonia, requiring prompt treatment with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient on risperidone for 3 weeks reports intense inner restlessness, stating, 'I feel like I want to crawl out of my skin,' and is observed pacing and repeatedly shifting his weight while seated.",question:"Which treatment is considered first-line for this condition?",options:{A:"Benztropine",B:"Trihexyphenidyl",C:"Propranolol",D:"Valbenazine"},correct:"C",rationale:"Akathisia is best treated first-line with a beta-blocker like propranolol (30-90 mg/day); anticholinergics (benztropine, trihexyphenidyl) are less effective for akathisia specifically, even though they help dystonia and parkinsonism. Valbenazine is used for tardive dyskinesia. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient who has been on a first-generation antipsychotic for 8 years develops involuntary lip smacking, tongue protrusion, and chewing movements.",question:"Which medication should generally be AVOIDED in managing this condition?",options:{A:"Clozapine",B:"Valbenazine",C:"Benztropine",D:"Deutetrabenazine"},correct:"C",rationale:"Anticholinergics like benztropine should be avoided in tardive dyskinesia, as they can worsen it -- even though they are helpful for the other EPS subtypes (dystonia, parkinsonism, akathisia). VMAT2 inhibitors (valbenazine, deutetrabenazine) and switching to clozapine are appropriate management strategies for TD. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A patient with treatment-resistant schizophrenia has had two serious suicide attempts in the past year despite adequate trials of two different antipsychotics.",question:"Which medication has an FDA-approved indication specifically for reducing suicidal behavior in this population?",options:{A:"Risperidone",B:"Clozapine",C:"Aripiprazole",D:"Quetiapine"},correct:"B",rationale:"Clozapine is the only antipsychotic with an FDA-approved indication specifically for reducing recurrent suicidal behavior in schizophrenia/schizoaffective disorder, based on the InterSePT trial. It also requires REMS monitoring of ANC given agranulocytosis risk. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A patient with bipolar I disorder and a history of multiple suicide attempts is being considered for a medication specifically to reduce long-term suicide risk.",question:"Which medication has the strongest evidence base for this purpose in mood disorders?",options:{A:"Valproate",B:"Lithium",C:"Lamotrigine",D:"Quetiapine"},correct:"B",rationale:"Lithium has the strongest evidence base for reducing suicide risk specifically in mood disorders (bipolar disorder and recurrent MDD) -- the parallel answer to clozapine's role in schizophrenia/schizoaffective disorder. (Boland Ch. 5; general psychopharmacology)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A patient started on a high-potency first-generation antipsychotic 2 weeks ago now demonstrates a masked, expressionless face, a resting 'pill-rolling' tremor, cogwheel rigidity, and a shuffling gait.",question:"Which condition is being described, and what is an appropriate treatment?",options:{A:"Tardive dyskinesia; valbenazine",B:"Akinesia/drug-induced parkinsonism; anticholinergic or dose reduction",C:"Acute dystonia; IM benztropine",D:"Neuroleptic malignant syndrome; dantrolene"},correct:"B",rationale:"The classic parkinsonism triad (bradykinesia, rigidity, tremor) plus masked facies and shuffling gait, developing over days to weeks, describes drug-induced parkinsonism/akinesia. First-line treatment includes anticholinergics (benztropine, trihexyphenidyl), amantadine, or dose reduction. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A clinician wants to objectively monitor a patient on long-term antipsychotic therapy for early signs of abnormal involuntary movements at routine visits.",question:"Which standardized rating scale is most appropriate for this purpose?",options:{A:"Barnes Akathisia Rating Scale (BARS)",B:"Abnormal Involuntary Movement Scale (AIMS)",C:"Hamilton Anxiety Rating Scale",D:"PANSS"},correct:"B",rationale:"The AIMS is the standard scale for monitoring tardive dyskinesia/abnormal involuntary movements; BARS is used specifically for akathisia. Neither the Hamilton Anxiety scale nor the PANSS assesses movement disorders. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"During a mental status exam, a patient states, 'I feel great today,' but the clinician observes a flat, unchanging facial expression, monotone speech, and no spontaneous gestures throughout the interview.",question:"How should the clinician document this finding?",options:{A:"Mood: flat; Affect: euthymic",B:"Mood: 'great' (patient-reported); Affect: blunted/flat, mood-incongruent",C:"Mood and affect are both euthymic and congruent",D:"This is a normal finding requiring no further documentation"},correct:"B",rationale:"Mood is the patient's subjective report ('I feel great'), while affect is the clinician's objective observation (flat, blunted expression) -- here, mood and affect are incongruent, an important clinical finding often seen in schizophrenia. (Boland Ch. 1)"},{topic:"Mood vs. Affect",vignette:"A patient's chart states: 'Mood: anxious and on edge (patient's words). Affect: full range, appropriate to content, mildly anxious throughout the interview.'",question:"What does this documentation demonstrate?",options:{A:"Mood and affect are the same concept documented twice",B:"Affect is the sustained internal state; mood is the momentary observation",C:"Mood is the patient's subjective report and affect is the clinician's objective observation, and here they are congruent",D:"This documentation is incorrect because affect cannot be 'full range'"},correct:"C",rationale:"This is a well-documented, congruent example: mood is quoted directly from the patient ('anxious and on edge' -- subjective), while affect describes the clinician's objective observation of the patient's emotional expression during the encounter (full range, appropriate, mildly anxious) -- the two align here. (Boland Ch. 1)"}],bt=yi.length;function xo(){let[t,e]=(0,mi.useState)(0),[l,a]=(0,mi.useState)(Array(bt).fill(null)),[i,n]=(0,mi.useState)(Array(bt).fill(!1)),[u,c]=(0,mi.useState)(!1),o=yi[t],r=i[t],y=l[t];function p(S){if(r)ret
