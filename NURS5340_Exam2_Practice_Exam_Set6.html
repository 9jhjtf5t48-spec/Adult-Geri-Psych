:{A:"Begin processing the worst trauma memory immediately",B:"Complete the preparation phase, ensuring safety and coping resources first",C:"Skip preparation since he already disclosed the trauma",D:"Refer directly to medication only"},correct:"B",rationale:"Wheeler Ch. 7's 8-phase EMDR protocol places history-taking and a dedicated Preparation phase (assessing readiness, safety, and coping resources) before the processing phases begin -- critical when safety or substance use concerns are present. (Wheeler Ch. 7, Table 7.4)"},{topic:"PTSD",vignette:"A 58-year-old veteran with PTSD reports his trauma-related nightmares are the most distressing and disruptive symptom, more than his daytime intrusive thoughts.",question:"Which medication most directly targets this specific symptom?",options:{A:"Sertraline",B:"Prazosin",C:"Buspirone",D:"Clomipramine"},correct:"B",rationale:"Prazosin, an alpha-1 antagonist, has evidence specifically for trauma-related nightmares by reducing central noradrenergic tone -- distinct from the SSRIs' broader symptom coverage. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 45-year-old man returned from a deployment 6 weeks ago and now reports nightmares, hypervigilance, and poor sleep that are worsening his ability to function at work.",question:"What is the most appropriate initial clinical priority?",options:{A:"Begin trauma-focused exposure therapy immediately at the first visit",B:"Stabilize sleep and ensure safety before initiating trauma-processing therapy",C:"Refer for inpatient psychiatric admission",D:"Defer any intervention until symptoms have lasted a full year"},correct:"B",rationale:"Consistent with trauma-treatment frameworks in Wheeler (stabilization before processing), addressing sleep disruption and ensuring safety/stability is prioritized before moving into intensive trauma-processing work. (Wheeler Ch. 7)"},{topic:"PTSD",vignette:"A 50-year-old woman with newly diagnosed PTSD and a distant history of benzodiazepine misuse is starting pharmacotherapy for the first time.",question:"Which medication class should be avoided as first-line therapy?",options:{A:"SSRIs",B:"SNRIs",C:"Benzodiazepines",D:"Alpha-1 antagonists"},correct:"C",rationale:"Benzodiazepines lack evidence for core PTSD symptoms and carry misuse/dependence risk, making them relatively contraindicated -- particularly given her history. SSRIs remain first-line. (Boland Ch. 10)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 27-year-old woman is 3 weeks removed from a serious assault, with intrusion, dissociation, and avoidance symptoms significantly impairing her daily functioning.",question:"Which diagnosis is most appropriate at this point in her course?",options:{A:"PTSD",B:"Acute Stress Disorder",C:"Panic Disorder",D:"Generalized Anxiety Disorder"},correct:"B",rationale:"At 3 weeks post-trauma, she remains within the Acute Stress Disorder window (3 days\u20131 month); PTSD cannot be diagnosed until symptoms persist beyond 1 month. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 43-year-old man has recurring episodes of sudden dread and chest tightness with no relationship to any past traumatic event he can identify.",question:"What key feature distinguishes this from a trauma-related disorder?",options:{A:"The episodes involve physical symptoms",B:"No trauma/stressor exposure is present",C:"The episodes are recurrent",D:"He is male"},correct:"B",rationale:"PTSD and ASD both require a Criterion A trauma exposure. Episodes with no identifiable trauma trigger point toward Panic Disorder instead, which requires no trauma exposure. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 39-year-old woman's trauma-related symptoms have been continuous for 10 months since a violent carjacking.",question:"Given this duration, which diagnosis applies?",options:{A:"Acute Stress Disorder",B:"PTSD",C:"Brief Psychotic Disorder",D:"Adjustment Disorder only"},correct:"B",rationale:"Symptoms persisting well beyond 1 month satisfy PTSD's Criterion F duration requirement; ASD is capped at 1 month. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A researcher is designing a study to explain why patients with chronic PTSD have difficulty unlearning fear responses even after the threat is gone.",question:"Which brain region's dysfunction best explains this impaired fear-extinction learning?",options:{A:"Cerebellum",B:"Hippocampus",C:"Occipital cortex",D:"Basal ganglia"},correct:"B",rationale:"Reduced hippocampal volume/activity impairs contextual memory processing and fear-extinction learning, a key contributor to PTSD's persistent, poorly-extinguished fear responses. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 36-year-old man with OCD has a partial response after 4 weeks on sertraline 100 mg.",question:"What is the most appropriate next step?",options:{A:"Switch immediately to clomipramine",B:"Increase toward a therapeutic OCD dose and reassess at 8\u201312 weeks",C:"Discontinue medication since it isn't working",D:"Add a benzodiazepine for OCD symptoms"},correct:"B",rationale:"OCD requires higher SSRI doses and a longer trial (8\u201312 weeks) than depression before determining adequate response -- switching or stopping after only 4 weeks would be premature. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 42-year-old accountant spends hours checking his calculations, recognizing the behavior is irrational but unable to stop.",question:"Which psychotherapy is best supported by evidence for this presentation?",options:{A:"Supportive therapy",B:"Exposure and Response Prevention",C:"Psychoanalysis",D:"Interpersonal therapy"},correct:"B",rationale:"ERP -- exposure to feared triggers while preventing the compulsive response -- is the first-line, evidence-based psychotherapy specifically for OCD. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 50-year-old woman is fully convinced her repeated praying rituals are the only thing preventing her family's death, with no doubt about this belief whatsoever.",question:"Which insight specifier applies?",options:{A:"Good or fair insight",B:"Poor insight",C:"Absent insight/delusional beliefs",D:"Tic-related"},correct:"C",rationale:"Complete conviction with no recognition the belief could be false meets criteria for 'absent insight/delusional beliefs.' (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A 33-year-old woman had a panic attack at a crowded concert venue and now avoids all concerts, sporting events, and busy restaurants, shopping only during off-peak hours when stores are empty.",question:"Which diagnosis best fits this pattern?",options:{A:"Panic Disorder",B:"Agoraphobia",C:"Social Anxiety Disorder",D:"Specific Phobia"},correct:"B",rationale:"Avoidance of crowded settings out of fear of being unable to escape or get help, restricting her routine to avoid the situation, is classic agoraphobia. (DSM-5-TR; Boland Ch. 8)"},{topic:"Agoraphobia",vignette:"A 55-year-old man has had agoraphobic avoidance of enclosed spaces for 5 months following a frightening episode in an elevator.",question:"Does he currently meet the duration criterion for agoraphobia?",options:{A:"Yes, any duration qualifies",B:"No, \u22656 months is required",C:"Yes, since it followed a specific event",D:"No, agoraphobia requires 12 months"},correct:"B",rationale:"Agoraphobia's Criterion F requires the fear/avoidance be persistent, typically \u22656 months. At 5 months, this specific criterion is not yet met. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"During CBT for panic disorder, a patient is guided to spin in a chair to intentionally provoke dizziness, then practice tolerating the sensation without escaping.",question:"This technique illustrates:",options:{A:"Cognitive reframing",B:"Panic Control Therapy targeting fear of bodily sensations",C:"Free association",D:"Systematic desensitization to an external object"},correct:"B",rationale:"Panic Control Therapy, named explicitly among Boland's behavioral techniques, involves deliberately provoking panic-like physical sensations so the patient can practice tolerating them without escape, reducing the fear of the sensations themselves. (Boland Ch. 8, Table 8-7)"},{topic:"Panic Disorder",vignette:"A 46-year-old man's panic attacks are linked on imaging to overactivity of the brain's primary noradrenergic nucleus.",question:"Which structure is this?",options:{A:"Locus coeruleus",B:"Substantia nigra",C:"Dorsal raphe nucleus",D:"Nucleus accumbens"},correct:"A",rationale:"The locus coeruleus is the brain's primary noradrenergic nucleus, classically implicated in driving the autonomic surge of panic attacks. (Boland Ch. 8, Table 8-9)"},{topic:"Panic Disorder",vignette:"A 30-year-old woman with panic disorder is starting pharmacotherapy for the first time, with no comorbid conditions.",question:"Which class is first-line?",options:{A:"Benzodiazepines",B:"SSRIs or SNRIs",C:"Antipsychotics",D:"Tricyclic antidepressants"},correct:"B",rationale:"SSRIs or the SNRI venlafaxine are first-line for panic disorder. (Boland Ch. 8)"},{topic:"SAD vs. Specific Phobia",vignette:"A 41-year-old woman with a fear of driving on highways is beginning behavioral therapy.",question:"What should the PMHNP prioritize first?",options:{A:"Have her drive on the highway during rush hour immediately",B:"Develop a graded exposure hierarchy, starting with less anxiety-provoking steps",C:"Prescribe a benzodiazepine as the primary treatment",D:"Recommend she avoid driving indefinitely"},correct:"B",rationale:"For specific phobias, Boland Ch. 8 describes gradually increasing exposure to the feared stimulus in successive steps, paired with relaxation techniques, until each level is mastered -- a graded exposure hierarchy, not immediate full exposure. (Boland Ch. 8)"},{topic:"SAD vs. Specific Phobia",vignette:"A 60-year-old man has fainted during every blood draw since young adulthood, a pattern distinct from typical panic-type reactions.",question:"What physiological mechanism explains this specific phobia subtype?",options:{A:"A typical sympathetic surge",B:"A vasovagal (fainting) response",C:"No physiological response occurs",D:"Hyperventilation exclusively"},correct:"B",rationale:"Blood-injection-injury type specific phobia is unique for provoking a vasovagal response rather than the sympathetic activation seen in other phobia types. (DSM-5-TR)"},{topic:"GAD",vignette:"A 48-year-old woman with GAD reports persistent muscle tension despite an adequate SSRI trial and ongoing psychotherapy.",question:"Which evidence-based adjunct approach is appropriate?",options:{A:"Increase caffeine intake",B:"Add a stimulant",C:"Incorporate relaxation techniques",D:"Start an antipsychotic"},correct:"C",rationale:"Relaxation techniques are explicitly listed among Boland's evidence-based behavioral approaches for anxiety disorders and are a reasonable adjunct for persistent somatic tension. (Boland Ch. 8, Table 8-7)"},{topic:"GAD",vignette:"A 52-year-old man with GAD wants a medication option that is not habit-forming and has no role in as-needed dosing.",question:"Which medication fits this description?",options:{A:"Alprazolam",B:"Buspirone",C:"Lorazepam",D:"Diazepam"},correct:"B",rationale:"Buspirone is non-habit-forming, specific to GAD, and has no acute/PRN role since it takes weeks to reach effect. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 29-year-old man has had active delusions and disorganized speech for 4 months, with no mood episode present.",question:"Which diagnosis fits this duration?",options:{A:"Brief Psychotic Disorder",B:"Schizophreniform Disorder",C:"Schizophrenia",D:"Schizoaffective Disorder"},correct:"B",rationale:"A duration of \u22651 month but <6 months with Criterion A symptoms met is Schizophreniform Disorder. (DSM-5-TR)"},{topic:"Schizophreniform Disorder",vignette:"A 25-year-old woman is diagnosed with Schizophreniform Disorder at week 5 of her episode, before it's known whether she will recover within 6 months.",question:"How should this diagnosis be qualified?",options:{A:"Definite",B:"Provisional",C:"In remission",D:"Chronic"},correct:"B",rationale:"When diagnosed before recovery or the full duration outcome is known, Schizophreniform Disorder should be qualified as 'provisional.' (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 28-year-old graduate student has withdrawn from labmates and developed unexplained headaches over the past 9 months, with no hallucinations or delusions yet present.",question:"What phase of illness does this most likely represent?",options:{A:"Active-phase schizophrenia",B:"Prodromal phase",C:"Residual phase",D:"Malingering"},correct:"B",rationale:"Social withdrawal and unexplained somatic complaints, without positive symptoms yet, is the classic prodromal picture that can precede overt psychosis by months to years. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 32-year-old man's family recalls his prodromal symptoms were present for over a year before his first psychotic episode.",question:"Is this timeline consistent with Boland's description?",options:{A:"No, prodromes never last more than days",B:"Yes, the prodromal syndrome may last a year or more",C:"No, this is already active-phase illness",D:"Yes, but only after age 50"},correct:"B",rationale:"Boland Ch. 5 notes the prodromal syndrome may last a year or more before overt psychosis emerges. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 44-year-old man's auditory hallucinations occur exclusively during his major depressive episodes and fully resolve as his mood improves.",question:"Does this meet Criterion B for schizoaffective disorder?",options:{A:"Yes, hallucinations occurred",B:"No, psychosis must occur for \u22652 weeks without a mood episode present",C:"Yes, because the episode was prolonged",D:"No, because he's never had mania"},correct:"B",rationale:"Criterion B specifically requires \u22652 weeks of psychosis in the ABSENCE of a mood episode. Psychosis confined to mood episodes instead fits a mood disorder with psychotic features. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 51-year-old woman with schizoaffective disorder has experienced both major depressive and manic episodes throughout her illness.",question:"Which subtype applies?",options:{A:"Depressive type",B:"Bipolar type",C:"Mixed type",D:"Unspecified type"},correct:"B",rationale:"'Bipolar type' applies when a manic episode is part of the presentation, even if major depressive episodes also occur. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 47-year-old man's mood episodes account for only about 10% of his total illness duration, though psychosis is otherwise consistent with schizoaffective criteria.",question:"Which criterion fails?",options:{A:"Criterion A",B:"Criterion B",C:"Criterion C",D:"Criterion D"},correct:"C",rationale:"Criterion C requires mood symptoms be present for the MAJORITY of the total illness duration. At only 10%, this criterion is not met. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A family asks how schizoaffective disorder's expected course typically compares to schizophrenia.",question:"What does Boland state?",options:{A:"Always identical to schizophrenia",B:"Generally intermediate between schizophrenia and mood disorders with psychosis",C:"Always milder than any mood disorder",D:"There is no established difference"},correct:"B",rationale:"Boland describes schizoaffective disorder's prognosis as generally intermediate between schizophrenia and mood disorders with psychotic features. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 40-year-old man with schizophrenia shows minimal facial expression and has stopped initiating any social contact, with no current hallucinations.",question:"Which category of symptoms is this?",options:{A:"Positive symptoms",B:"Negative symptoms",C:"Extrapyramidal symptoms",D:"Prodromal symptoms only"},correct:"B",rationale:"Affective flattening and social withdrawal (asociality) are classic negative symptoms, defined by absence of normal function. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 37-year-old man's hallucinations and delusions resolve within 3 weeks of starting an antipsychotic, but his flat affect persists unchanged.",question:"What does this pattern illustrate?",options:{A:"Positive symptoms respond faster to D2 blockade than negative symptoms",B:"Negative symptoms always resolve first",C:"The medication is not working",D:"This suggests misdiagnosis"},correct:"A",rationale:"Positive symptoms typically respond well and relatively quickly to antipsychotics via D2 blockade, while negative symptoms are far more treatment-resistant. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 29-year-old woman with a history of bulimia nervosa and depression is being considered for bupropion.",question:"What is the primary concern?",options:{A:"Bupropion causes hyperprolactinemia",B:"Bupropion lowers the seizure threshold, compounded by her eating disorder",C:"Bupropion is not an antidepressant",D:"Bupropion requires blood monitoring"},correct:"B",rationale:"Bupropion carries the highest seizure risk among antidepressants; this risk is compounded in patients with eating disorders due to electrolyte disturbances. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 39-year-old man on clozapine 650 mg/day is being counseled on side-effect risks.",question:"What dose-dependent risk becomes especially relevant at this dose?",options:{A:"Seizures, reaching up to 5% risk above 600 mg/day",B:"Hair loss",C:"Hyperthyroidism",D:"Hypertension only"},correct:"A",rationale:"Boland Ch. 5 cites clozapine seizure risk reaching up to 5% in patients on doses above 600 mg/day. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 35-year-old woman with panic disorder is found to have reduced GABA-A receptor binding on functional imaging.",question:"Which medication class's mechanism directly addresses this finding?",options:{A:"SSRIs",B:"Benzodiazepines",C:"Beta-blockers",D:"TCAs"},correct:"B",rationale:"Benzodiazepines directly potentiate GABA-A receptor activity, addressing the reduced GABA-A binding implicated in panic disorder. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher studying social anxiety disorder and panic disorder finds low postsynaptic 5-HT1A receptor activity in both groups.",question:"What does this finding help explain?",options:{A:"Why antipsychotics are first-line for these conditions",B:"The rationale for SSRI/SNRI efficacy in these conditions",C:"Why benzodiazepines are contraindicated",D:"Why these conditions never respond to medication"},correct:"B",rationale:"Low postsynaptic 5-HT1A receptor activity provides part of the neurochemical rationale for SSRI/SNRI efficacy in panic disorder and social anxiety disorder. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A 46-year-old man with schizophrenia insists people on the subway can hear his thoughts as though they were spoken aloud through a speaker.",question:"Which symptom is this?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Thought broadcasting",D:"Ideas of reference"},correct:"C",rationale:"Thought broadcasting is the delusional belief that one's private thoughts are being transmitted outward for others to hear. (Boland Ch. 5, Table 5-1)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 30-year-old man's paranoid delusions began during a 4-day methamphetamine binge and fully resolved within a week of stopping use.",question:"Which diagnosis fits this course?",options:{A:"Schizophrenia",B:"Substance/Medication-Induced Psychotic Disorder",C:"Schizoaffective disorder",D:"Delusional disorder"},correct:"B",rationale:"Symptoms tightly linked in time to substance use, resolving shortly after cessation, is the classic picture of Substance/Medication-Induced Psychotic Disorder. (DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 55-year-old man's psychotic symptoms, which began during a stimulant binge, persist unchanged 5 weeks after complete abstinence.",question:"What does this persistence suggest about the underlying diagnosis?",options:{A:"It confirms substance-induced psychosis",B:"It suggests an independent (primary) psychotic disorder is now more likely",C:"It indicates normal withdrawal",D:"It confirms delirium"},correct:"B",rationale:"Persistence of psychotic symptoms roughly a month or more beyond cessation points away from a substance-induced cause and toward a primary psychotic disorder. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A 49-year-old man with schizophrenia describes hearing a running commentary of two voices discussing his every move.",question:"What hallucination type is this, and how common is it in schizophrenia?",options:{A:"Visual; rare",B:"Auditory; the most common type in schizophrenia",C:"Olfactory; common",D:"Tactile; expected finding"},correct:"B",rationale:"Auditory hallucinations, including voices commenting or conversing, are the most common hallucination type in schizophrenia. (Boland Ch. 5, Table 5-1)"},{topic:"Understanding Hallucinations",vignette:"A 63-year-old man reports a persistent taste of metal in his mouth that no one else notices and that has no dental or medical explanation.",question:"Per Boland, what does this specific hallucination type suggest?",options:{A:"It is expected in schizophrenia and needs no further workup",B:"It is unusual in primary psychosis and warrants a medical/neurologic workup",C:"It confirms a mood disorder",D:"It has no clinical significance"},correct:"B",rationale:"Gustatory hallucinations are 'unusual' in primary psychotic disorders per Boland Ch. 5 and should prompt consideration of an underlying medical/neurologic cause. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 52-year-old man with schizophrenia gives an answer that drifts from talking about his medication to his childhood home to the weather, with no logical connection between topics.",question:"This is best described as:",options:{A:"Circumstantiality",B:"Derailment (loose associations)",C:"Clanging",D:"Thought blocking"},correct:"B",rationale:"Derailment (loose associations) describes ideas that slip from one topic to a loosely or unrelated one -- distinct from circumstantiality, which eventually returns to the point. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 44-year-old man's speech dissolves into a completely incoherent jumble of unrelated words during his interview.",question:"This is best described as:",options:{A:"Word salad (incoherence)",B:"Circumstantiality",C:"Perseveration",D:"Echolalia"},correct:"A",rationale:"Incoherence, or 'word salad,' is speech so disorganized it becomes a jumble of words -- the most severe form of formal thought disorder. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 26-year-old man develops sudden neck spasm and eyes rolling upward within hours of his first antipsychotic dose.",question:"What is the appropriate immediate treatment?",options:{A:"Propranolol",B:"IM/IV benztropine or diphenhydramine",C:"Valbenazine",D:"Wait and reassess in 48 hours"},correct:"B",rationale:"Acute dystonia, presenting hours to days after antipsychotic initiation, requires prompt treatment with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 49-year-old man on an antipsychotic reports an inner urge to keep moving and cannot sit still during his appointment.",question:"What is the first-line treatment?",options:{A:"Benztropine",B:"Trihexyphenidyl",C:"Propranolol",D:"Valbenazine"},correct:"C",rationale:"Akathisia is treated first-line with a beta-blocker like propranolol; anticholinergics are less effective for this subtype specifically. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 72-year-old woman on long-term antipsychotic therapy develops involuntary tongue and lip movements.",question:"Which class of medication should be avoided in her management?",options:{A:"VMAT2 inhibitors",B:"Anticholinergics",C:"Clozapine",D:"Dose reduction strategies"},correct:"B",rationale:"Anticholinergics should be avoided in tardive dyskinesia, as they may worsen it, despite being helpful for other EPS subtypes. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A 41-year-old woman with schizophrenia and recurrent suicide attempts has failed two prior antipsychotic trials.",question:"Which medication has an FDA-approved indication specifically for reducing her suicide risk?",options:{A:"Risperidone",B:"Clozapine",C:"Quetiapine",D:"Ziprasidone"},correct:"B",rationale:"Clozapine has an FDA-approved indication specifically for reducing suicidal behavior in schizophrenia/schizoaffective disorder. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A 63-year-old man with bipolar disorder and multiple prior suicide attempts needs long-term suicide risk reduction.",question:"Which medication has the strongest evidence in this specific population?",options:{A:"Valproate",B:"Lithium",C:"Lamotrigine",D:"Olanzapine"},correct:"B",rationale:"Lithium has the strongest evidence base for reducing suicide risk specifically in mood disorders such as bipolar disorder. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A 61-year-old man on a high-potency antipsychotic develops a resting tremor, rigidity, and slowed movement over 3 weeks.",question:"What is the first-line treatment approach?",options:{A:"Propranolol",B:"Anticholinergic or dose reduction",C:"Valbenazine",D:"Switch to clozapine only"},correct:"B",rationale:"Drug-induced parkinsonism is treated first-line with an anticholinergic, amantadine, or dose reduction. (Boland Ch. 5)"}
