ith PTSD begins EMDR. In the second formal phase of the 8-phase protocol, his therapist focuses on building coping resources and a 'safe place' image before any trauma memory is directly targeted.",question:"Which phase of the EMDR protocol is being described?",options:{A:"Assessment",B:"Reevaluation",C:"Desensitization",D:"Preparation"},correct:"D",rationale:"Phase 2 (Preparation) establishes the therapeutic alliance, educates the patient, and builds coping resources (including a 'safe place' exercise) before the Assessment and Desensitization phases begin targeting the trauma memory directly. (Wheeler Ch. 7, Table 7.4)"},{topic:"PTSD",vignette:"A 39-year-old woman is undergoing Trauma-Focused CBT for PTSD following an assault.",question:"Which specific named therapy is explicitly described as a component of TFCBT?",options:{A:"Panic Control Therapy",B:"EMDR",C:"Prolonged Exposure",D:"Present-Centered Therapy"},correct:"C",rationale:"Boland Ch. 10 states TFCBT includes Prolonged Exposure (PE) therapy. EMDR, PCT, and Present-Centered Therapy are listed as separate, coordinate approaches -- not explicitly nested under TFCBT. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 58-year-old man with PTSD reports his nightmares have improved on prazosin, but his daytime intrusive memories and avoidance remain significant.",question:"Which medication class remains first-line for his overall PTSD symptoms, distinct from the nightmare-specific treatment?",options:{A:"Benzodiazepines",B:"SSRIs",C:"Antipsychotics",D:"Stimulants"},correct:"B",rationale:"SSRIs (sertraline, paroxetine) remain first-line for the overall PTSD symptom picture, while prazosin specifically targets nightmares via alpha-1 blockade. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 63-year-old combat veteran's PTSD treatment includes sessions with other veterans who share similar combat experiences, in addition to his individual therapy.",question:"What specific benefit does Boland note for this treatment modality with this population?",options:{A:"It replaces the need for individual therapy entirely",B:"It is only appropriate once individual therapy has completely resolved his symptoms",C:"It has no evidence base for PTSD",D:"It has been particularly successful with combat veterans and disaster survivors"},correct:"D",rationale:"Boland Ch. 10 notes group therapy has been particularly successful with combat veterans and survivors of catastrophic disasters, leveraging shared experience -- as an adjunct to, not a replacement for, individual treatment. (Boland Ch. 10)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 44-year-old woman is 8 days removed from a violent carjacking. She reports intrusive memories, feeling detached from her surroundings, avoidance of driving, and severe anxiety affecting her ability to work.",question:"Which diagnosis fits best at this point in her course?",options:{A:"Acute Stress Disorder",B:"PTSD",C:"Panic Disorder",D:"Generalized Anxiety Disorder"},correct:"A",rationale:"At 8 days post-trauma, she is within the ASD window (3 days to 1 month); PTSD requires symptoms to persist beyond 1 month. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 51-year-old man has sudden attacks of chest pain and sweating that occur unpredictably across many different settings, with no relationship to any past traumatic experience.",question:"What single feature makes Panic Disorder the more likely diagnosis?",options:{A:"The attacks occur in multiple settings",B:"No trauma exposure is present in his history",C:"He is middle-aged",D:"The attacks involve chest pain"},correct:"B",rationale:"PTSD and ASD both require a Criterion A trauma exposure; its absence points toward Panic Disorder, which requires no trauma trigger. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 36-year-old woman's trauma-related symptoms have persisted continuously for 7 months following a violent robbery, significantly impairing her ability to work and maintain relationships.",question:"Which diagnosis fits given this duration?",options:{A:"Panic Disorder",B:"Adjustment Disorder only",C:"PTSD",D:"Acute Stress Disorder"},correct:"C",rationale:"Symptoms persisting well beyond 1 month satisfy PTSD's Criterion F duration requirement; ASD is capped at 1 month. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A researcher is studying why PTSD patients show a blunted, rather than elevated, cortisol response to acute stress testing, unlike what is typically seen in other chronic stress conditions.",question:"This atypical cortisol pattern is most classically associated with which condition?",options:{A:"PTSD",B:"Major Depressive Disorder",C:"Adjustment Disorder",D:"Generalized Anxiety Disorder"},correct:"A",rationale:"PTSD is distinct from other chronic stress conditions (like depression, which shows elevated cortisol) in that cortisol is often low or blunted -- a notable exam distinction. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 41-year-old woman with OCD is starting treatment. Her prescriber explains that cognitive-behavioral therapy is the recommended overarching approach.",question:"Which specific behavioral technique represents CBT's primary component for OCD treatment?",options:{A:"Systematic desensitization alone",B:"Interpersonal skills training",C:"Exposure and Response Prevention",D:"Panic Control Therapy"},correct:"C",rationale:"Boland states it is reasonable to begin CBT first for OCD -- ERP is CBT's specific behavioral component for this disorder, combining exposure to feared triggers with blocking the compulsive response. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 36-year-old man has intrusive, repugnant thoughts about harming strangers, finds them highly distressing, and has no accompanying ritual, though he avoids situations that trigger the thoughts.",question:"Which OCD symptom pattern does this represent?",options:{A:"Intrusive/forbidden thoughts",B:"Symmetry/ordering",C:"Contamination/cleansing",D:"Hoarding-type concerns"},correct:"A",rationale:"Ego-dystonic intrusive thoughts of an aggressive nature, without an accompanying compulsion, describe the intrusive/forbidden thoughts symptom pattern. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 48-year-old woman with OCD has failed two SSRI trials at maximally tolerated doses over adequate durations.",question:"Which medication is an evidence-based next step, despite a less favorable tolerability profile?",options:{A:"Buspirone",B:"Clomipramine",C:"Propranolol",D:"Prazosin"},correct:"B",rationale:"Clomipramine has evidence equal to SSRIs for OCD but a worse side-effect profile (anticholinergic effects, seizure risk, cardiotoxicity in overdose), making it a reasonable next step after SSRI failure. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 64-year-old woman avoids grocery stores, public transportation, and standing in lines for the past 10 months, fearing she cannot escape or get help if she panics. She requires her daughter to accompany her everywhere.",question:"Which diagnosis best fits this presentation?",options:{A:"Specific phobia",B:"Panic Disorder",C:"Agoraphobia",D:"Social Anxiety Disorder"},correct:"C",rationale:"Fear of multiple situations tied to difficulty escaping or getting help, with companion-dependence for \u22656 months, is classic agoraphobia, diagnosed independently of panic disorder. (DSM-5-TR; Boland Ch. 8)"},{topic:"Agoraphobia",vignette:"A 57-year-old man with agoraphobia is starting treatment. His NP explains that this specific therapy is useful for rapid and complete reduction of his condition.",question:"Which therapy is being described?",options:{A:"Behavior therapy",B:"Panic Control Therapy",C:"Cognitive Processing Therapy",D:"Interpersonal Therapy"},correct:"A",rationale:"Boland states directly that behavior therapy is useful for rapid and complete reduction of agoraphobia. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"A 33-year-old man has had 5 unexpected attacks of palpitations and fear of dying over 6 weeks, and has since become persistently worried about future attacks, avoiding his workplace where the first episode occurred.",question:"Which diagnosis fits this presentation?",options:{A:"Generalized Anxiety Disorder",B:"Panic Disorder",C:"Specific phobia",D:"Agoraphobia alone"},correct:"B",rationale:"Recurrent unexpected panic attacks plus \u22651 month of persistent worry/behavioral change is the classic Panic Disorder presentation. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 45-year-old woman with panic disorder is undergoing CBT. In one component, she deliberately hyperventilates to provoke dizziness and practices tolerating it; in another, her therapist corrects her belief that a racing heart means she is dying.",question:"Which two named components of CBT for panic disorder are being described, respectively?",options:{A:"Systematic desensitization and psychodynamic therapy",B:"EMDR and present-centered therapy",C:"Response prevention and family therapy",D:"Panic Control Therapy and Cognitive Therapy"},correct:"D",rationale:"Panic Control Therapy is the behavioral component (deliberately provoking panic-like sensations to reduce fear of them); Cognitive Therapy is the cognitive component (correcting false beliefs about bodily sensations) -- together these make up CBT for panic disorder. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"A 40-year-old man's panic attacks are linked to overactivity of the brain's primary noradrenergic nucleus on functional imaging studies.",question:"Which structure is this?",options:{A:"Substantia nigra",B:"Nucleus accumbens",C:"Locus coeruleus",D:"Raphe nuclei"},correct:"C",rationale:"The locus coeruleus is the brain's primary noradrenergic nucleus, classically implicated in driving panic attacks' autonomic surge. (Boland Ch. 8, Table 8-9)"},{topic:"SAD vs. Specific Phobia",vignette:"A 30-year-old woman avoids all workplace social gatherings, terrified colleagues will judge her as awkward, and this fear extends across multiple types of social situations, not just public speaking.",question:"Which diagnosis and specifier best fit this presentation?",options:{A:"Social Anxiety Disorder, generalized",B:"Social Anxiety Disorder, performance only",C:"Specific phobia, situational type",D:"Agoraphobia"},correct:"A",rationale:"When social anxiety extends across multiple types of social situations (not limited to performance/public speaking specifically), the presentation fits the generalized presentation of Social Anxiety Disorder rather than the 'performance only' specifier. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 55-year-old man's Social Anxiety Disorder is being treated. His NP explains that individual therapy using a specific cognitive-behavioral approach is considered first-line by some treatment guidelines.",question:"Which therapy is this?",options:{A:"EMDR",B:"Individual CBT",C:"Panic Control Therapy",D:"Psychodynamic therapy"},correct:"B",rationale:"Individual CBT is named as first-line psychotherapy for Social Anxiety Disorder per some treatment guidelines, alongside group CBT and interpersonal skills training. (Boland Ch. 8)"},{topic:"GAD",vignette:"A 52-year-old woman has excessively worried about her health, finances, and adult children for the past 8 months, unable to control the worry despite trying, with associated fatigue and muscle tension.",question:"Which diagnosis best fits this presentation?",options:{A:"Panic Disorder",B:"Adjustment Disorder",C:"Illness Anxiety Disorder",D:"Generalized Anxiety Disorder"},correct:"D",rationale:"Excessive, hard-to-control worry across multiple domains for \u22656 months with associated somatic symptoms is the classic GAD presentation. (DSM-5-TR)"},{topic:"GAD",vignette:"A 47-year-old man with GAD asks his NP which overarching therapy category has been shown to have a substantial effect on his condition.",question:"Which therapy is this?",options:{A:"Cognitive-Behavioral Therapy",B:"Interpersonal Therapy",C:"Psychodynamic therapy",D:"EMDR"},correct:"A",rationale:"Boland states studies of CBT suggest it has a substantial effect on GAD, panic disorder, and social anxiety disorder. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 27-year-old man has had active delusions and disorganized speech for 5 months, with no mood episode present and no functional decline noted by his employer.",question:"Which diagnosis is most likely?",options:{A:"Brief Psychotic Disorder",B:"Schizoaffective Disorder",C:"Schizophreniform Disorder",D:"Schizophrenia"},correct:"C",rationale:"A duration of \u22651 month but <6 months, with Criterion A symptoms met and no required functional decline, fits Schizophreniform Disorder. (DSM-5-TR; Boland Ch. 5)"},{topic:"Schizophreniform Disorder",vignette:"A 25-year-old woman's psychotic episode began abruptly within 2 weeks of a noticeable behavioral change; she presented with marked confusion, had good premorbid occupational functioning, and shows no blunted affect.",question:"Which specifier applies to her Schizophreniform Disorder diagnosis?",options:{A:"With good prognostic features",B:"Provisional",C:"With poor prognostic features",D:"With catatonia"},correct:"A",rationale:"'With good prognostic features' requires \u22652 of: onset within 4 weeks of first behavioral change, confusion/perplexity, good premorbid functioning, absence of blunted affect -- she meets all four. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 29-year-old man has withdrawn from coworkers and developed unexplained gastrointestinal complaints over the past 11 months, with no hallucinations or delusions yet confirmed.",question:"This presentation most likely represents which phase of illness?",options:{A:"Residual phase",B:"Malingering",C:"Active-phase schizophrenia",D:"Prodromal phase of schizophrenia"},correct:"D",rationale:"Social withdrawal and unexplained somatic complaints without confirmed positive symptoms is the classic prodromal picture. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 33-year-old woman's prodromal symptoms began after a major life stressor -- the death of a close friend -- and gradually progressed over several months before her first psychotic episode.",question:"What does Boland note about the role of stressors in this context?",options:{A:"Stressors have no established relationship to prodromal onset",B:"A significant stressor can serve as a precipitant that unmasks the prodromal disturbance",C:"Stressors only matter after the first psychotic episode",D:"This confirms an adjustment disorder diagnosis instead"},correct:"B",rationale:"Boland Ch. 5 notes social/environmental stressors may precipitate or unmask an evolving prodromal disturbance. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 49-year-old man's hallucinations occur exclusively during his depressive episodes and fully resolve as his mood improves; he has never had psychosis otherwise.",question:"Which diagnosis is most likely?",options:{A:"Schizoaffective Disorder, depressive type",B:"Schizophrenia",C:"Major Depressive Disorder with psychotic features",D:"Delusional Disorder"},correct:"C",rationale:"Psychosis confined entirely to mood episodes and resolving with them fits Major Depressive Disorder with psychotic features, not Schizoaffective Disorder, which requires \u22652 weeks of psychosis independent of any mood episode. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 44-year-old man with schizoaffective disorder has experienced both manic and major depressive episodes throughout his illness course.",question:"Which specifier applies?",options:{A:"Mixed type",B:"Depressive type",C:"Unspecified type",D:"Bipolar type"},correct:"D",rationale:"'Bipolar type' applies when a manic episode is part of the presentation, even if major depressive episodes also occur. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 56-year-old woman's mood episodes account for about 30% of her total illness duration, with psychosis otherwise persistent and independent of mood.",question:"Which criterion for schizoaffective disorder is NOT satisfied?",options:{A:"The criterion requiring \u22652 weeks of psychosis without a mood episode",B:"The criterion requiring mood symptoms present for the majority of total illness duration",C:"The criterion excluding substance or medical causes",D:"The criterion requiring psychosis concurrent with a mood episode"},correct:"B",rationale:"This criterion requires mood symptoms be present for the MAJORITY of total illness duration; 30% is well short of this threshold. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A family is counseled about the expected long-term course of schizoaffective disorder compared to schizophrenia and mood disorders with psychotic features.",question:"What is the most accurate description of the typical prognosis?",options:{A:"There is no established pattern",B:"Always better than any mood disorder",C:"Always identical to schizophrenia",D:"Generally intermediate between schizophrenia and mood disorders with psychotic features"},correct:"D",rationale:"Boland describes schizoaffective disorder's prognosis as generally intermediate between schizophrenia and mood disorders with psychotic features. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 50-year-old man with schizophrenia shows minimal facial expression, has stopped initiating conversation, and has lost interest in previously enjoyed hobbies, with no current hallucinations.",question:"Which category of symptoms is this?",options:{A:"Prodromal symptoms",B:"Positive symptoms",C:"Extrapyramidal symptoms",D:"Negative symptoms"},correct:"D",rationale:"Affective flattening, avolition, and asociality are classic negative symptoms, defined by absence of normal function. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A schizophrenia treatment team notices that a patient's attention and planning abilities were already mildly impaired years before his first episode of hallucinations or delusions occurred.",question:"Which symptom domain does this describe?",options:{A:"Negative symptoms",B:"Positive symptoms",C:"Cognitive symptoms",D:"Extrapyramidal symptoms"},correct:"C",rationale:"Boland identifies cognitive symptoms (attention, working memory, executive function) as a distinct third domain, often subtle early in the illness. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 32-year-old woman with a history of anorexia nervosa needs an antidepressant for comorbid depression.",question:"Which medication is relatively contraindicated given her history?",options:{A:"Escitalopram",B:"Bupropion",C:"Mirtazapine",D:"Sertraline"},correct:"B",rationale:"Bupropion carries the highest seizure risk among antidepressants, and eating disorders compound this risk via electrolyte disturbances. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 46-year-old man on clozapine 700 mg/day for treatment-resistant schizophrenia is being counseled on his elevated risk for a specific adverse effect.",question:"Which risk is most directly tied to this dose level?",options:{A:"Hyperprolactinemia",B:"Seizures, up to 5% risk above 600 mg/day",C:"Agranulocytosis",D:"QT prolongation exclusively"},correct:"B",rationale:"Clozapine's seizure risk is dose-dependent, reaching up to 5% above 600 mg/day. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 38-year-old woman's anxiety disorder is linked to reduced GABA levels and reduced GABA-A/benzodiazepine receptor binding on functional imaging.",question:"Which medication class directly targets this specific neurochemical finding?",options:{A:"SSRIs",B:"Benzodiazepines",C:"TCAs",D:"Beta-blockers"},correct:"B",rationale:"Benzodiazepines directly potentiate GABA-A receptor activity, mechanistically addressing the reduced GABA-A binding implicated in anxiety disorders. (Boland
