urvived a car bombing 3 months ago. He now has nightmares, avoids driving past the site, feels emotionally cut off from his wife, and startles at loud noises, all significantly disrupting his job.",question:"Which diagnosis best fits this presentation?",options:{A:"Adjustment disorder",B:"Generalized Anxiety Disorder",C:"Brief Psychotic Disorder",D:"PTSD"},correct:"D",rationale:"Intrusive memories, avoidance, emotional numbing/detachment, and hyperarousal (startle) persisting beyond 1 month with functional impairment is the classic PTSD presentation. (DSM-5-TR; Boland Ch. 10)"},{topic:"PTSD",vignette:"A 61-year-old veteran with PTSD is beginning a psychotherapy in which he repeatedly recounts his combat memory aloud and gradually re-enters places he has been avoiding since returning home.",question:"Which therapy is being described?",options:{A:"Cognitive Processing Therapy",B:"Prolonged Exposure",C:"Present-Centered Therapy",D:"Motivational Interviewing"},correct:"B",rationale:"Prolonged Exposure combines imaginal exposure (recounting the memory) with in-vivo exposure (re-entering avoided real-world places) to reduce avoidance and facilitate reprocessing. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 38-year-old woman with PTSD and nightly trauma-related nightmares has had no improvement in this specific symptom despite an adequate sertraline trial.",question:"Which medication should be added to specifically target her nightmares?",options:{A:"Buspirone",B:"Diphenhydramine",C:"Prazosin",D:"Bupropion"},correct:"C",rationale:"Prazosin, an alpha-1 antagonist, has specific evidence for reducing PTSD-related nightmares by reducing central noradrenergic tone. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 50-year-old man with new-onset PTSD symptoms also has a distant history of benzodiazepine dependence, now in sustained remission.",question:"Which class of medication is generally best avoided as his primary treatment?",options:{A:"Benzodiazepines",B:"Alpha-1 antagonists",C:"SNRIs",D:"SSRIs"},correct:"A",rationale:"Benzodiazepines lack evidence for core PTSD symptoms and carry dependence risk, making them relatively contraindicated, especially given his history. (Boland Ch. 10)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 27-year-old woman is 12 days out from a serious assault. She has dissociative episodes, intrusive memories, avoidance, and severe anxiety that are keeping her from returning to work.",question:"Which diagnosis is most appropriate given this timeframe?",options:{A:"Somatic Symptom Disorder",B:"PTSD",C:"Acute Stress Disorder",D:"Panic Disorder"},correct:"C",rationale:"At 12 days post-trauma, she is within the Acute Stress Disorder window (3 days\u20131 month); PTSD requires symptoms to persist beyond 1 month. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 46-year-old man has sudden, unpredictable episodes of racing heart and dread that occur at random times with no connection to any past traumatic event.",question:"Which diagnosis is most likely?",options:{A:"PTSD",B:"Specific phobia",C:"Acute Stress Disorder",D:"Panic Disorder"},correct:"D",rationale:"Unexpected attacks with no trauma history and no identifiable trigger are the hallmark of Panic Disorder, which requires no trauma exposure, unlike PTSD/ASD. (DSM-5-TR; Boland Ch. 8)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 55-year-old woman has had continuous trauma-related symptoms -- nightmares, avoidance, hypervigilance -- for 9 months since a home invasion, significantly impairing her daily life.",question:"Which diagnosis fits this presentation?",options:{A:"Panic Disorder",B:"PTSD",C:"Acute Stress Disorder",D:"Adjustment Disorder"},correct:"B",rationale:"Trauma-related symptoms persisting well beyond 1 month, causing significant impairment, fit PTSD rather than the time-limited ASD. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A researcher studying PTSD finds a group of patients with reduced hippocampal volume, amygdala hyperactivity, and reduced prefrontal cortical activity on imaging, alongside blunted cortisol levels.",question:"This neurobiological pattern is most consistent with which condition?",options:{A:"Major Depressive Disorder",B:"PTSD",C:"Generalized Anxiety Disorder",D:"Schizophrenia"},correct:"B",rationale:"The combination of amygdala hyperactivity, reduced hippocampal volume, reduced prefrontal regulation, and -- notably -- blunted (rather than elevated) cortisol is the classic neurobiological signature of PTSD, distinguishing it from typical chronic-stress patterns seen in depression. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 33-year-old man spends over 4 hours daily washing his hands due to intrusive fears of contamination, to the point his skin has become raw. He recognizes the fear is likely irrational but cannot stop.",question:"Which diagnosis best fits this presentation?",options:{A:"OCD",B:"Generalized Anxiety Disorder",C:"Specific phobia",D:"Somatic Symptom Disorder"},correct:"A",rationale:"Time-consuming (>1 hour/day) contamination obsessions with washing compulsions, causing physical harm and functional impairment, is the classic OCD presentation. (DSM-5-TR; Boland Ch. 9)"},{topic:"OCD",vignette:"A 45-year-old woman with OCD has had minimal improvement after an adequate 10-week trial of fluoxetine at the maximum tolerated dose.",question:"Which medication is an evidence-based alternative, despite a less favorable side-effect profile?",options:{A:"Clomipramine",B:"Buspirone",C:"Propranolol",D:"Prazosin"},correct:"A",rationale:"Clomipramine has evidence equal to SSRIs for OCD but a worse side-effect profile (anticholinergic effects, seizure risk, cardiotoxicity in overdose), making it a reasonable next step after SSRI failure. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 40-year-old man with OCD is starting a specific evidence-based psychotherapy in which he is exposed to a feared trigger and then prevented from performing his usual ritual.",question:"Which therapy is this?",options:{A:"Exposure and Response Prevention",B:"Psychoanalysis",C:"Cognitive Processing Therapy",D:"Supportive therapy"},correct:"A",rationale:"Exposure and Response Prevention (ERP) is defined by exposure to a feared trigger combined with blocking the compulsive response -- the first-line, evidence-based psychotherapy for OCD. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 58-year-old woman avoids grocery stores, buses, and movie theaters for the past 8 months, fearing she won't be able to escape or get help if she feels panicky. She requires her husband to accompany her everywhere.",question:"Which diagnosis best fits this presentation?",options:{A:"Agoraphobia",B:"Panic Disorder",C:"Social Anxiety Disorder",D:"Specific phobia"},correct:"A",rationale:"Fear of multiple situations (crowds, enclosed spaces, public transportation) due to difficulty escaping or getting help, with companion-dependence for \u22656 months, is classic agoraphobia. (DSM-5-TR; Boland Ch. 8)"},{topic:"Agoraphobia",vignette:"A 66-year-old man has become essentially housebound over the past year, refusing to leave home even for medical appointments, due to severe agoraphobia.",question:"What does Boland note about the functional impact of agoraphobia at this severity?",options:{A:"It can be one of the most disabling phobias due to its impact on work and social functioning",B:"It resolves without any intervention",C:"It is typically mild and self-limiting",D:"It has no significant effect on daily functioning"},correct:"A",rationale:"Boland Ch. 8 specifically notes agoraphobia can be one of the most disabling phobias, given how severely it can interfere with work and social functioning. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"A 39-year-old woman has had 5 unexpected attacks of chest tightness, sweating, and fear of dying over the past 2 months, and has since become persistently worried about having another attack, avoiding the gym where her first episode occurred.",question:"Which diagnosis fits this presentation?",options:{A:"Specific phobia",B:"Agoraphobia alone",C:"Generalized Anxiety Disorder",D:"Panic Disorder"},correct:"D",rationale:"Recurrent unexpected panic attacks plus \u22651 month of persistent worry about additional attacks and avoidance behavior is the classic Panic Disorder presentation. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 42-year-old man with panic disorder is being taught to intentionally provoke sensations like dizziness (by spinning in a chair) and then practice tolerating them without escaping.",question:"This technique is best described as:",options:{A:"Free association",B:"Panic Control Therapy",C:"Systematic desensitization to an external object",D:"Cognitive reframing"},correct:"B",rationale:"Panic Control Therapy, a named behavioral technique in Boland Ch. 8, involves deliberately provoking panic-like sensations so the patient learns to tolerate them without escape, reducing fear of the sensations themselves. (Boland Ch. 8, Table 8-7)"},{topic:"Panic Disorder",vignette:"A 34-year-old woman with panic disorder is starting pharmacotherapy for the first time, with no other psychiatric or medical comorbidities.",question:"Which medication class is first-line?",options:{A:"Antipsychotics",B:"SSRIs or SNRIs",C:"Benzodiazepines",D:"Tricyclic antidepressants"},correct:"B",rationale:"SSRIs or the SNRI venlafaxine are first-line for panic disorder. (Boland Ch. 8)"},{topic:"SAD vs. Specific Phobia",vignette:"A 31-year-old man avoids all workplace meetings and presentations, terrified he will visibly shake and be judged as incompetent by colleagues, though he interacts normally one-on-one.",question:"Which diagnosis best fits this presentation?",options:{A:"Specific phobia",B:"Social Anxiety Disorder",C:"Agoraphobia",D:"Panic Disorder"},correct:"B",rationale:"Fear centered on negative judgment by others during social/performance situations is the hallmark of Social Anxiety Disorder. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 49-year-old woman faints every time she has blood drawn, a pattern present since adolescence, leading her to avoid all medical procedures involving needles.",question:"Which diagnosis and physiological mechanism best explain this presentation?",options:{A:"Social Anxiety Disorder, performance type",B:"Specific phobia, blood-injection-injury type, with a vasovagal response",C:"Panic Disorder, with a typical sympathetic surge",D:"Illness Anxiety Disorder"},correct:"B",rationale:"Blood-injection-injury type specific phobia is unique for provoking a vasovagal (fainting) response rather than a typical sympathetic panic surge. (DSM-5-TR; Boland Ch. 8)"},{topic:"GAD",vignette:"A 47-year-old man has worried excessively about his job, finances, and his children's wellbeing for the past 9 months, unable to set the worry aside, with associated muscle tension, fatigue, and poor sleep.",question:"Which diagnosis best fits this presentation?",options:{A:"Adjustment Disorder",B:"OCD",C:"Panic Disorder",D:"Generalized Anxiety Disorder"},correct:"D",rationale:"Excessive, hard-to-control worry across multiple everyday domains for \u22656 months, with associated somatic symptoms, is the classic GAD presentation. (DSM-5-TR)"},{topic:"GAD",vignette:"A 53-year-old woman with GAD and a history of alcohol use disorder in remission wants a medication with no potential for misuse.",question:"Which medication best fits this requirement?",options:{A:"Lorazepam",B:"Buspirone",C:"Diazepam",D:"Alprazolam"},correct:"B",rationale:"Buspirone is non-habit-forming and specific to GAD, in contrast to the benzodiazepines listed, which carry misuse potential. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 28-year-old man has had delusions and disorganized speech continuously for 3 months, with no mood episode present and no decline in his occupational functioning noted by his family.",question:"Which diagnosis is most likely?",options:{A:"Schizoaffective Disorder",B:"Schizophreniform Disorder",C:"Schizophrenia",D:"Brief Psychotic Disorder"},correct:"B",rationale:"A duration of \u22651 month but <6 months with active psychotic symptoms, and no required functional decline, fits Schizophreniform Disorder. (DSM-5-TR; Boland Ch. 5)"},{topic:"Schizophreniform Disorder",vignette:"A 24-year-old woman's psychotic episode resolved completely after only 3 weeks.",question:"Which diagnosis fits this short duration, rather than Schizophreniform Disorder?",options:{A:"Delusional Disorder",B:"Schizophrenia",C:"Brief Psychotic Disorder",D:"Schizoaffective Disorder"},correct:"C",rationale:"An episode under 1 month falls short of Schizophreniform Disorder's minimum duration and instead fits Brief Psychotic Disorder. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 27-year-old man has withdrawn from friends and coworkers over the past year, developed unexplained headaches with no medical cause, and become increasingly preoccupied with unusual religious theories, though he has no hallucinations or delusions yet.",question:"This presentation is most consistent with which phase of illness?",options:{A:"Residual schizophrenia",B:"Malingering",C:"Prodromal phase of schizophrenia",D:"Active-phase schizophrenia"},correct:"C",rationale:"Social withdrawal, unexplained somatic complaints, and preoccupation with unusual ideas -- without confirmed positive symptoms -- is the classic prodromal presentation that can precede overt psychosis by months to years. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 30-year-old woman's family recalls, in retrospect, that her odd behavior and declining hygiene had been present for over a year before her first psychotic break, though they didn't recognize its significance at the time.",question:"What does this timeline illustrate about schizophrenia's prodromal phase?",options:{A:"The prodromal syndrome may last a year or more before overt psychosis develops",B:"The prodrome only occurs after the first hospitalization",C:"The prodrome never lasts more than a few days",D:"This timeline indicates she never had a true prodrome"},correct:"A",rationale:"Boland Ch. 5 notes the prodromal syndrome may last a year or more before the disturbing symptoms of active psychosis emerge. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 52-year-old woman has chronic auditory hallucinations that intensify during her depressive episodes but persist even when her mood is stable, and she has been unable to hold steady employment for over a decade.",question:"Which diagnosis is most classic for this presentation?",options:{A:"Brief Psychotic Disorder",B:"Major Depressive Disorder with psychotic features",C:"Schizoaffective Disorder",D:"Delusional Disorder"},correct:"C",rationale:"Persistence of hallucinations independent of mood state, combined with chronic course and functional impairment, is the classic Schizoaffective Disorder presentation -- distinct from MDD with psychotic features, where psychosis would resolve with the mood episode. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 41-year-old man's hallucinations occur exclusively during his major depressive episodes and fully resolve as soon as his mood improves; he has never had psychotic symptoms otherwise.",question:"Which diagnosis is most likely?",options:{A:"Delusional Disorder",B:"Schizoaffective Disorder, depressive type",C:"Major Depressive Disorder with psychotic features",D:"Schizophrenia"},correct:"C",rationale:"Psychosis occurring exclusively during and resolving with a mood episode fits Major Depressive Disorder with psychotic features, not Schizoaffective Disorder, which requires psychosis for \u22652 weeks independent of any mood episode. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 47-year-old man with schizoaffective disorder has experienced both manic episodes and major depressive episodes throughout his illness.",question:"Which specifier best describes his presentation?",options:{A:"Bipolar type",B:"Rapid-cycling type",C:"Depressive type",D:"Mixed episode type"},correct:"A",rationale:"'Bipolar type' applies when a manic episode is part of the presentation, even if major depressive episodes also occur. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A family is counseled about the expected course of their relative's newly diagnosed schizoaffective disorder compared to schizophrenia and mood disorders with psychosis.",question:"What is the most accurate description of the typical prognosis?",options:{A:"Always better than any mood disorder",B:"Generally intermediate between schizophrenia and mood disorders with psychotic features",C:"Identical to bipolar disorder without psychosis",D:"Always worse than schizophrenia"},correct:"B",rationale:"Boland describes schizoaffective disorder's prognosis as generally intermediate between schizophrenia and mood disorders with psychotic features. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 49-year-old man with schizophrenia shows minimal facial expression, has stopped initiating conversation, and has lost interest in hobbies he once enjoyed, with no current hallucinations or delusions.",question:"Which category of symptoms is this?",options:{A:"Negative symptoms",B:"Positive symptoms",C:"Extrapyramidal symptoms",D:"Cognitive symptoms"},correct:"A",rationale:"Affective flattening, avolition, and anhedonia are classic negative symptoms -- defined by the absence of normal function. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 36-year-old man's hallucinations and delusions resolve within 3 weeks of starting an antipsychotic, but his flat affect and social withdrawal remain essentially unchanged after 2 months.",question:"What does this pattern best illustrate?",options:{A:"This indicates the diagnosis was incorrect",B:"Negative symptoms always resolve before positive symptoms",C:"The medication has completely failed",D:"Positive symptoms generally respond faster to antipsychotics than negative symptoms"},correct:"D",rationale:"Positive symptoms typically respond well and relatively quickly to antipsychotics via D2 blockade, while negative symptoms are far more treatment-resistant. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 30-year-old woman with treatment-resistant depression and a history of bulimia nervosa is being considered for an antidepressant known to carry the highest seizure risk in its class.",question:"Which medication is this?",options:{A:"Escitalopram",B:"Sertraline",C:"Mirtazapine",D:"Bupropion"},correct:"D",rationale:"Bupropion carries the highest seizure risk among antidepressants; this risk is compounded in patients with eating disorders, making it relatively contraindicated here. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 43-year-old man on clozapine 650 mg/day for treatment-resistant schizophrenia develops a new seizure.",question:"What does this dose level explain about his risk?",options:{A:"This dose is below any established risk threshold",B:"Clozapine carries no seizure risk at any dose",C:"His dose is above the 600 mg/day threshold associated with up to 5% seizure risk",D:"Seizure risk with clozapine is unrelated to dose"},correct:"C",rationale:"Boland Ch. 5 cites clozapine seizure risk reaching up to 5% in patients on doses above 600 mg/day. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 40-year-old woman with panic disorder and social anxiety disorder is found to have low postsynaptic 5-HT1A receptor activity on functional studies.",question:"What does this finding help explain?",options:{A:"Why benzodiazepines are absolutely contraindicated",B:"Why her conditions cannot respond to any medication",C:"Why antipsychotics are first-line for her conditions",D:"The rationale for SSRI/SNRI efficacy in her conditions"},correct:"D",rationale:"Low postsynaptic 5-HT1A receptor activity is classically implicated in panic disorder and social anxiety disorder, providing part of the rationale for SSRI/SNRI efficacy. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 46-year-old executive with performance-related anxiety is prescribed a medication to take as needed before public presentations, targeting his physical symptoms of tremor and rapid heartbeat.",question:"Which medication class and neurotransmitter system are involved?",options:{A:"Benzodiazepine; GABAergic system",B:"TCA; combined noradrenergic and serotonergic systems",C:"SSRI; serotonergic system",D:"Beta-blocker; noradrenergic system"},correct:"D",rationale:"Beta-blockers like propranolol target the noradrenergic system and are used for performance-related anxiety to blunt physical autonomic symptoms. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A 45-year-old man with schizophrenia insists that his coworkers can hear his private thoughts as though they were spoken over a loudspeaker.",question:"Which symptom is this?",options:{A:"Thought withdrawal",B:"Thought broadcasting",C:"Delusion of reference",D:"Thought insertion"},correct:"B",rationale:"Thought broadcasting is the delusional belief that one's own private thoughts are being transmitted outward for others to hear. (Boland Ch. 5, Table 5-1)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 29-year-old man's paranoid delusions began during a 3-day methamphetamine binge and resolved completely within a week of stopping use, with no prior psychiatric history.",question:"Which diagnosis fits this course?",options:{A:"Substance/Medication-Induced Psychotic Disorder",B:"Schizoaffective Disorder",C:"Delusional Disorder",D:"Schizophrenia"},correct:"A",rationale:"Symptoms tightly linked in time to substance use, resolving shortly after cessation, is the classic picture of Substance/Medication-Induced Psychotic Disorder. (DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 57-year-old man's hallucinations, which began during a stimulant relapse, persist unchanged 6 weeks after confirmed complete abstinence.",question:"Which diagnosis is now more likely given this persistence?",options:{A:"Substance/Medication-Induced Psychotic Disorder",B:"Delirium",C:"Normal, expected withdrawal symptoms",D:"An independent (primary) psychotic disorder"},correct:"D",rationale:"Persistence of psychotic symptoms roughly a month or more beyond cessation of use points away from a substance-induced cause and toward an independent primary psychotic disorder. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A 50-year-old man with schizophrenia hears two voices arguing about his behavior, providing a running commentary throughout the day.",question:"Which type of hallucination is this, and how common is it in schizophrenia?",options:{A:"Gustatory; common",B:"Tactile; expected",C:"Visual; uncommon",D:"Auditory; the most common type"},correct:"D",rationale:"Auditory hallucinations, including voices commenting or conversing, are the most common hallucination type in schizophrenia. (Boland Ch. 5, Table 5-1)"},{topic:"Understanding Hallucinations",vignette:"A 64-year-old man reports a persistent, unexplained taste of metal that no one else notices, with no dental or medical cause found.",question:"Per Boland, what does this hallucination type suggest?",options:{A:"It confirms a mood disorder diagnosis",B:"It is common in schizophrenia and needs no further workup",C:"It has no clinical relevance",D:"It is unusual in primary psychosis and should prompt a medical/neurologic workup"},correct:"D",rationale:"Gustatory hallucinations are 'unusual' in primary psychotic disorders per Boland Ch. 5 and should prompt consideration of an underlying medical/neurologic cause. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 53-year-old man with schizophrenia, asked about his sleep, gives a rambling answer full of unnecessary detail about his entire evening routine before eventually, after several minutes, answering the question.",question:"This speech pattern is best described as:",options:{A:"Word salad",B:"Clanging",C:"Circumstantiality",D:"Tangentiality"},correct:"C",rationale:"Circumstantiality involves excessive, unnecessary detail before eventually reaching the point -- unlike tangentiality, which never returns to answer the question. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A 47-year-old man with schizophrenia's speech dissolves into a completely incoherent jumble of unrelated words during his exam, impossible to follow.",question:"This is best described as:",options:{A:"Echolalia",B:"Incoherence (word salad)",C:"Perseveration",D:"Circumstantiality"},correct:"B",rationale:"Incoherence, or 'word salad,' is speech so disorganized it becomes an unfollowable jumble of words -- the most severe form of formal thought disorder. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 25-year-old man develops sudden, sustained neck twisting and his eyes roll upward within a day of starting a high-potency antipsychotic.",question:"Which condition is this, and what is the appropriate immediate treatment?",options:{A:"Tardive dyskinesia; switch to clozapine",B:"Akathisia; propranolol",C:"Acute dystonia; IM/IV benztropine or diphenhydramine",D:"Drug-induced parkinsonism; amantadine"},correct:"C",rationale:"Sudden, sustained muscle contraction within hours to a day of antipsychotic initiation is classic acute dystonia, requiring prompt treatment with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 48-year-old man on risperidone for 3 weeks reports feeling like he 'wants to crawl out of his skin' and is observed pacing constantly during his visit.",question:"Which condition is this, and what is the first-line treatment?",options:{A:"Drug-induced parkinsonism; amantadine",B:"Akathisia; propranolol",C:"Acute dystonia; benztropine",D:"Tardive dyskinesia; valbenazine"},correct:"B",rationale:"Subjective inner restlessness with objective pacing is akathisia, treated first-line with a beta-blocker like propranolol; anticholinergics are less effective for this subtype. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 70-year-old woman develops choreoathetoid movements of her hands and fingers, in addition to facial movements, after 6 years on a first-generation antipsychotic. Her family asks about starting an anticholinergic to help.",question:"What is the most accurate response regarding this condition, tardive dyskinesia?",options:{A:"Anticholinergics have no effect either way",B:"Anticholinergics are first-line and should be started immediately",C:"Anticholinergics can worsen tardive dyskinesia and should generally be avoided",D:"Anticholinergics should be combined with a higher antipsychotic dose"},correct:"C",rationale:"Anticholinergics can worsen tardive dyskinesia and should generally be avoided, even though they help other EPS subtypes like dystonia and parkinsonism. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A 44-year-old woman with schizophrenia and two prior serious suicide attempts has failed adequate trials of risperidone and olanzapine.",question:"Which medication should be strongly considered next, given both her diagnosis and suicide history?",options:{A:"Quetiapine",B:"Aripiprazole",C:"Ziprasidone",D:"Clozapine"},correct:"D",rationale:"Clozapine is both the most effective option for treatment-resistant schizophrenia and carries an FDA-approved indication specifically for reducing suicidal behavior in this population. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A 60-year-old man with recurrent major depressive disorder and a history of a serious suicide attempt needs long-term suicide risk reduction, separate from his antidepressant regimen.",question:"Which medication has the strongest evidence for this specific purpose?",options:{A:"Clozapine",B:"Valproate",C:"Lithium",D:"Quetiapine"},correct:"C",rationale:"Lithium has the strongest evidence base for reducing suicide risk specifically in mood disorders, including recurrent MDD. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A 56-year-old man on a high-potency antipsychotic for 3 weeks develops a resting tremor, cogwheel rigidity, a shuffling gait, and a masked facial expression.",question:"Which condition is this, and what is the first-line treatment?",options:{A:"Tardive dyskinesia; VMAT2 inhibitor",B:"Neuroleptic malignant syndrome; dantrolene",C:"Drug-induced parkinsonism; anticholinergic, amantadine, or dose reduction",D:"Acute dystonia; IM benztropine"},correct:"C",rationale:"The classic parkinsonism triad (tremor, rigidity, bradykinesia) plus masked facies, developing over weeks, is drug-induced parkinsonism, treated first-line with an anticholinergic, amantadine, or dose reduction. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A clinic wants to standardize monitoring for early tardive dyskinesia across all patients on long-term antipsychotics.",question:"Which standardized scale should be used?",options:{A:"BARS",B:"PANSS",C:"AIMS",D:"Hamilton Anxiety Scale"},correct:"C",rationale:"The Abnormal Involuntary Movement Scale (AIMS) is the standard tool for monitoring tardive dyskinesia. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"A 55-year-old patient states, 'I feel wonderful today,' but the clinician observes a flat, unchanging facial expression and monotone speech throughout the interview.",question:"How should this presentation be characterized?",options:{A:"Mood is 'wonderful' and affect is flat; the two are incongruent",B:"This is a normal finding requiring no further assessment",C:"Affect and mood are the same concept and don't need separate documentation",D:"Mood and affect are congruent"}
