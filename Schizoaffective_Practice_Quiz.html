"A 30-year-old man has a manic episode with grandiose delusions. The delusions vanish completely once the mania resolves with treatment. This has happened the same way every time, across 4 manic episodes over several years -- he's never had psychosis without mania.",question:"What's the diagnosis?",options:{A:"Schizophrenia",B:"Schizotypal personality disorder",C:"Bipolar I disorder with psychotic features",D:"Schizoaffective disorder, bipolar type"},correct:"C",rationale:"The psychosis only ever shows up riding along with the mania and disappears when the mood stabilizes -- it has never once existed independently. That's the defining feature of bipolar with psychotic features, not schizoaffective disorder, even though both mania and psychosis are clearly present."},{topic:"Schizoaffective Disorder",vignette:"A 45-year-old woman has chronic auditory hallucinations that have been present nearly every day for 12 years, regardless of her mood. Twice in that time she also had a 3-week depressive episode.",question:"What's the most likely diagnosis?",options:{A:"Schizophrenia",B:"Brief psychotic disorder",C:"Schizoaffective disorder, depressive type",D:"Major depressive disorder with psychotic features"},correct:"A",rationale:"The hallucinations are the dominant, near-constant feature, and the depressive episodes are brief and rare in comparison -- nowhere close to being the majority of her illness course. Two 3-week episodes over 12 years is well under 1% of her total illness time. This is schizophrenia with occasional depressive symptoms, not schizoaffective disorder, which requires mood episodes to make up the MAJORITY of the total illness duration."},{topic:"Schizoaffective Disorder",vignette:"A 38-year-old man has a major depressive episode with psychotic features (hearing voices telling him he's worthless). The voices intensify during the depression. Three months after his mood fully returns to normal -- no depression at all -- the voices are still there, unchanged, and continue for over a month before finally stopping.",question:"What's the diagnosis?",options:{A:"Schizoaffective disorder, depressive type",B:"Bipolar disorder with psychotic features",C:"Major depressive disorder with psychotic features",D:"Delusional disorder"},correct:"A",rationale:"The voices persisting for over a month with his mood totally normal proves the psychosis can run independently of the mood episode -- the key requirement for schizoaffective disorder (Criterion B: psychosis for 2+ weeks with no mood episode present). Since he's only ever had depressive episodes (no mania), it's the depressive type."},{topic:"Schizoaffective Disorder",vignette:"General knowledge check.",question:"Which single piece of information would most help you tell schizoaffective disorder apart from bipolar disorder with psychotic features?",options:{A:"The patient's age",B:"How severe the hallucinations are",C:"Whether the patient has a family history of psychiatric illness",D:"Whether the psychosis has ever occurred for 2+ weeks with no mood episode present"},correct:"D",rationale:"This is the single defining fact the diagnosis hinges on. In bipolar with psychosis, the psychosis is entirely tied to the mood episode. In schizoaffective disorder, the psychosis has proven it can run on its own, independent of any mood episode, for at least 2 weeks."},{topic:"Schizoaffective Disorder",vignette:"A 50-year-old woman has manic episodes and, separately, has had psychosis (paranoid delusions) present continuously for the last 5 years -- including plenty of stretches with completely normal mood. Her manic episodes have been frequent and account for well over half of her total time being ill.",question:"What's the diagnosis?",options:{A:"Schizophrenia",B:"Schizoaffective disorder, depressive type",C:"Schizoaffective disorder, bipolar type",D:"Bipolar I disorder with psychotic features"},correct:"C",rationale:"Both boxes are met: the psychosis clearly runs independently of mood (present during normal-mood stretches for years), and mood episodes (mania) still make up the majority of her illness course. Since her mood episodes are manic (not depressive), it's the bipolar type."},{topic:"Schizoaffective Disorder",vignette:"General knowledge check.",question:"Why does schizoaffective disorder exist as its own diagnosis instead of just calling these patients 'schizophrenic' or 'bipolar'?",options:{A:"It's an outdated diagnosis no longer used",B:"Because these patients don't respond to any medication",C:"It's just a milder version of schizophrenia",D:"Because neither label alone captures that the psychosis is genuinely independent AND mood episodes are a major, recurring part of the illness"},correct:"D",rationale:"Calling this patient 'schizophrenia' ignores that mood episodes are a real, major, recurring part of their illness needing dedicated mood treatment. Calling it 'bipolar with psychosis' wrongly implies the psychosis will vanish once the mood is treated -- but it won't, since it's shown it can run on its own. Schizoaffective disorder exists to correctly flag both needs."},{topic:"Schizoaffective Disorder",vignette:"A 41-year-old woman has grandiose delusions during every manic episode she's ever had (6 episodes over 10 years). Each time, the delusions vanish the moment her mood stabilizes back to normal, without exception.",question:"What's the diagnosis?",options:{A:"Schizoaffective disorder, bipolar type",B:"Bipolar I disorder with psychotic features",C:"Schizophrenia",D:"Brief psychotic disorder"},correct:"B",rationale:"The phrase 'every episode' and 'vanish the moment her mood stabilizes' tells you the psychosis has never once existed independently -- it's 100% tied to the mood swings. That's the defining feature of bipolar with psychotic features, not schizoaffective, even though both mania and psychosis are clearly present here."},{topic:"Schizoaffective Disorder",vignette:"A 55-year-old man has recurrent major depressive episodes with paranoid delusions. After his most recent depressive episode resolved, his mood was normal for 4 months -- but the delusions never fully went away during that stretch, just became slightly less intense.",question:"What's the diagnosis?",options:{A:"Schizophrenia",B:"Persistent depressive disorder",C:"Schizoaffective disorder, depressive type",D:"Major depressive disorder with psychotic features"},correct:"C",rationale:"The key phrase is 'the delusions never fully went away' during that 4-month stretch of normal mood. That's independence -- proof the psychosis isn't just riding on the depression. Combined with depressive episodes being a real, recurring part of his history (not just once), this fits schizoaffective disorder, depressive type."},{topic:"Schizoaffective Disorder",vignette:"A 60-year-old man has had constant paranoid delusions for 8 years, present whether his mood is normal or not. He's had one depressive episode in that time, lasting 2 weeks, during which the delusions were also present.",question:"What's the diagnosis?",options:{A:"Schizophrenia",B:"Schizotypal personality disorder",C:"Schizoaffective disorder, depressive type",D:"Major depressive disorder with psychotic features"},correct:"A",rationale:"Two weeks of hallucinations total, against 8 years of illness, is a tiny fraction -- nowhere near a majority. Even though the psychosis technically occurred without a mood episode present (satisfying that one requirement), the overall picture is dominated by chronic, mood-independent psychosis with one rare depressive dip. This is schizophrenia with an occasional depressive episode, not schizoaffective disorder, because the depressive episode doesn't come close to being the majority of his illness course."},{topic:"Schizoaffective Disorder",vignette:"A 48-year-old woman has had both manic and depressive episodes over the past 7 years, making up most of that time. Hallucinations have also persisted for a solid 6-month stretch when her mood was completely normal.",question:"What's the diagnosis?",options:{A:"Schizoaffective disorder, depressive type",B:"Schizoaffective disorder, bipolar type",C:"Schizophrenia",D:"Bipolar I disorder with psychotic features"},correct:"B",rationale:"Both checks pass: (1) psychosis independence -- confirmed, it persisted through 6 months of normal mood. (2) Majority of time -- confirmed, manic/depressive episodes have made up most of her 7-year course. Since she's had both manic AND depressive episodes, it's the bipolar type (mania present = bipolar type, regardless of whether depression also occurs)."}],Dl=we.length;function Vo(){let[l,t]=(0,Ke.useState)(0),[u,a]=(0,Ke.useState)(Array(Dl).fill(null)),[e,n]=(0,Ke.useState)(Array(Dl).fill(!1)),[i,c]=(0,Ke.useState)(!1),f=we[l],d=e[l],h=u[l];function g(b){if(d)return;let E=[...u];E[l]=b,a(E)}function s(){if(!h)return;let b=[...e];b[l]=!0,n(b)}function m(){l<Dl-1?t(l+1):c(!0)}function T(){l>0&&t(l-1)}function O(b){c(!1),t(b)}function D(){a(Array(Dl).fill(null)),n(Array(Dl).fill(!1)),t(0),c(!1)}let v=e.filter(Boolean).length,o=we.reduce((b,E,A)=>b+(e[A]&&u[A]===E.correct?1:0),0),y={};we.forEach((b,E)=>{y[b.topic]||(y[b.topic]={correct:0,total:0}),y[b.topic].total+=1,e[E]&&u[E]===b.correct&&(y[b.topic].correct+=1)});let r=we.map((b,E)=>({...b,i:E})).filter(b=>e[b.i]&&u[b.i]!==b.correct),z=Dl>0?Math.round(o/Dl*100):0;return i?(0,_.jsx)("div",{style:{minHeight:"100vh",background:"#F6F5F1",fontFamily:"system-ui, sans-serif"},children:(0,_.jsxs)("div",{style:{maxWidth:720,margin:"0 auto",padding:"40px 20px 80px"},children:[(0,_.jsx)("h1",{style:{fontFamily:"Georgia, serif",fontSize:28,color:"#1F3864",marginBottom:4},children:"Exam Results"}),(0,_.jsx)("p",{style:{color:"#6b6b6b",marginBottom:28,fontSize:15},children:"NURS 5340 \u2014 Schizoaffective Disorder Practice Quiz"}),(0,_.jsxs)("div",{style:{background:"#fff",border:"1px solid #E3E1D9",borderRadius:12,padding:"28px 28px",display:"flex",alignItems:"center",gap:28,marginBottom:24},child
