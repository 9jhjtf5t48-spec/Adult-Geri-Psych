ent with chronic PTSD is found on imaging to have amygdala hyperactivity, reduced hippocampal volume, reduced prefrontal cortical activity, and a blunted (not elevated) cortisol response to stress testing.",question:"This neurobiological pattern is most consistent with which condition?",options:{A:"Major Depressive Disorder",B:"Generalized Anxiety Disorder",C:"Normal aging changes",D:"PTSD"},correct:"D",rationale:"This exact combination \u2014 amygdala up, hippocampus/PFC down, plus blunted rather than elevated cortisol \u2014 is PTSD's signature pattern. The blunted cortisol is what makes it stand out from typical chronic-stress conditions like depression, which usually show elevated cortisol."},{topic:"PTSD Neuroanatomy",vignette:"A student is confused about why PTSD's cortisol pattern is considered notable, since most people assume chronic stress always means high cortisol.",question:"Why is 'blunted cortisol' considered a distinguishing feature of PTSD rather than just a generic sign of chronic stress?",options:{A:"Because cortisol only matters in geriatric patients",B:"Because blunted cortisol always indicates a substance use disorder instead",C:"Because most chronic stress states (like depression) show elevated cortisol, making PTSD's low/blunted pattern unusual and testable",D:"Because cortisol has no role in any stress-related condition"},correct:"C",rationale:"This is exactly the kind of 'trick' distinction exam writers love: everyone expects chronic stress = high cortisol, so PTSD's blunted pattern stands out as the exception worth memorizing."},{topic:"Agoraphobia",vignette:"A 58-year-old man avoids public buses, movie theaters, and standing in checkout lines for the past 9 months, fearing he can't escape or get help if he starts to feel panicky. He insists his wife accompany him everywhere.",question:"Which diagnosis best fits this presentation?",options:{A:"Social Anxiety Disorder",B:"Panic Disorder",C:"Agoraphobia",D:"Specific phobia, situational type"},correct:"C",rationale:"Fear of \u22652 situations (public transport, enclosed spaces, crowds) tied specifically to difficulty escaping/getting help, with companion-dependence for \u22656 months, is agoraphobia \u2014 even without ever having a full panic attack."},{topic:"Agoraphobia",vignette:"Both agoraphobia and situational-type specific phobia can involve avoiding places like elevators or buses, which makes them easy to mix up on an exam.",question:"What's the core difference between the two, even when the avoided places overlap?",options:{A:"Specific phobia always requires a panic attack first; agoraphobia never does",B:"Agoraphobia involves fear tied to \u22652 situations sharing the theme of 'can't escape/get help'; specific phobia is fear of one discrete object or situation itself",C:"There is no real difference between the two",D:"Agoraphobia requires fear of one specific place; specific phobia requires fear of multiple places"},correct:"B",rationale:"Agoraphobia's defining feature is the underlying reason (escape/help difficulty) across at least 2 of 5 recognized situation categories. Specific phobia is a fear of one particular object/situation for its own sake (e.g., just elevators, just heights)."},{topic:"Panic Disorder",vignette:"A 36-year-old woman has had 6 unexpected attacks of chest tightness and fear of dying over 2 months, and has since become persistently worried about having another attack, avoiding her gym as a result.",question:"Which diagnosis fits this presentation?",options:{A:"Agoraphobia alone",B:"Specific phobia",C:"Generalized Anxiety Disorder",D:"Panic Disorder"},correct:"D",rationale:"Recurrent unexpected attacks (no trigger) plus \u22651 month of persistent worry/avoidance following an attack is the defining Panic Disorder pattern."},{topic:"Panic Disorder",vignette:"During Panic Control Therapy, a patient is taught to deliberately bring on panic-like sensations \u2014 for example, breathing through a straw to cause breathlessness, or spinning to cause dizziness \u2014 and then practice staying with the sensation instead of escaping.",question:"What is this specific technique called, and what is its therapeutic goal?",options:{A:"Free association, with no specific therapeutic goal",B:"Interoceptive exposure; the goal is to teach the patient the sensation itself is not dangerous",C:"Systematic desensitization to an external phobic object",D:"Flooding, which is only used for specific phobias"},correct:"B",rationale:"Deliberately provoking the physical sensations of panic (interoceptive exposure) is the core mechanism of Panic Control Therapy \u2014 the goal is breaking the association between a bodily sensation and catastrophic fear, since the patient learns firsthand the sensation alone isn't dangerous."},{topic:"Panic Disorder",vignette:"A 44-year-old man with panic disorder and no other comorbidities is starting pharmacotherapy for the first time.",question:"Which medication class is first-line?",options:{A:"Benzodiazepine monotherapy",B:"Tricyclic antidepressant",C:"SSRI or the SNRI venlafaxine",D:"Antipsychotic"},correct:"C",rationale:"SSRIs or venlafaxine (SNRI) are first-line for panic disorder; benzodiazepines are reserved for short-term bridging, not first-line monotherapy."},{topic:"SAD vs. Specific Phobia",vignette:"A 29-year-old man avoids every work meeting and team lunch, terrified colleagues will judge him as incompetent if he says something wrong \u2014 though he has no trouble one-on-one or eating alone.",question:"Which diagnosis best fits this presentation?",options:{A:"Agoraphobia",B:"Specific phobia",C:"Social Anxiety Disorder",D:"Panic Disorder"},correct:"C",rationale:"Fear centered specifically on negative judgment by others across social situations \u2014 not a discrete object or place itself \u2014 is Social Anxiety Disorder."},{topic:"SAD vs. Specific Phobia",vignette:"A 52-year-old woman faints every single time she has blood drawn, a pattern present since her teens, causing her to avoid all medical procedures involving needles.",question:"Which diagnosis and physiological mechanism best explain this presentation?",options:{A:"Panic Disorder, with a typical sympathetic surge",B:"Specific phobia, blood-injection-injury type, with a vasovagal (fainting) response",C:"Illness Anxiety Disorder",D:"Social Anxiety Disorder"},correct:"B",rationale:"Blood-injection-injury phobia is the one phobia subtype that causes fainting (vasovagal response) instead of the usual sympathetic panic surge \u2014 a favorite exam distractor-buster."},{topic:"Schizophreniform Disorder",vignette:"A 25-year-old woman is diagnosed with a psychotic episode at day 40 of her illness. Her psychotic symptoms began abruptly within 3 weeks of a noticeable behavioral change, she showed marked confusion at onset, had good premorbid functioning, and shows no blunted affect.",question:"Which specifier applies to her diagnosis?",options:{A:"With good prognostic features",B:"With poor prognostic features",C:"Provisional",D:"With catatonia"},correct:"A",rationale:"'With good prognostic features' requires \u22652 of: onset within 4 weeks of first behavioral change, confusion/perplexity, good premorbid functioning, absence of blunted affect. She meets all four."},{topic:"Schizophreniform Disorder",vignette:"A 30-year-old man is diagnosed with Schizophreniform Disorder at week 5 of his episode, while it's still unclear whether he'll recover or progress past 6 months.",question:"How should this diagnosis be qualified given the uncertain outcome?",options:{A:"Acute",B:"With catatonia",C:"With good prognostic features",D:"Provisional"},correct:"D",rationale:"When the diagnosis must be made before recovery or before the outcome/duration is known, it should be qualified as 'provisional' \u2014 a separate specifier from the prognostic-features one."},{topic:"Seizure Threshold",vignette:"An NP is choosing between chlorpromazine (low-potency FGA) and haloperidol (high-potency FGA) for a patient with a known seizure disorder, wanting to minimize additional risk.",question:"Which choice reflects accurate awareness of relative seizure risk among antipsychotics?",options:{A:"Both carry identical seizure risk",B:"Antipsychotics carry no seizure risk at all",C:"Avoid chlorpromazine \u2014 low-potency FGAs carry greater seizure risk than high-potency FGAs",D:"Choose chlorpromazine \u2014 low-potency FGAs carry lower seizure risk"},correct:"C",rationale:"Low-potency FGAs like chlorpromazine carry greater seizure risk than high-potency FGAs like haloperidol \u2014 the opposite of what many people assume ('low potency' sounds safer, but isn't here)."},{topic:"Seizure Threshold",vignette:"A patient on clozapine 650 mg/day develops a new seizure.",question:"What does this dose level explain about his risk?",options:{A:"This dose is below any risk threshold",B:"Clozapine carries no seizure risk at any dose",C:"Seizure risk with clozapine is unrelated to dose",D:"This dose is above the 600 mg/day threshold associated with seizure risk up to 5%"},correct:"D",rationale:"Clozapine's seizure risk is dose-dependent, reaching up to 5% above 600 mg/day \u2014 a specific number worth memorizing alongside bupropion as the two 'must-know' seizure-risk medications."},{topic:"Seizure Threshold",vignette:"A patient with a history of bulimia nervosa needs an antidepressant.",question:"Which medication should generally be avoided given her history?",options:{A:"Bupropion",B:"Escitalopram",C:"Sertraline",D:"Fluoxetine"},correct:"A",rationale:"Bupropion carries the highest seizure risk of any antidepressant, and eating disorders compound this risk via electrolyte disturbances \u2014 making it relatively contraindicated here."},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher proposes a CRH-1 receptor antagonist as a new anxiolytic, given that persistently increased CRH concentration is implicated in anxiety disorders.",question:"What does Boland note about this treatment approach's clinical track record?",options:{A:"CRH-1 antagonists are already FDA-approved first-line for GAD",B:"CRH-1 receptor antagonists have, to date, failed to demonstrate efficacy in clinical trials",C:"This mechanism has never been studied in humans",D:"CRH-1 antagonists have shown strong, consistent efficacy in trials"},correct:"B",rationale:"Despite a solid theoretical rationale, Boland notes CRH-1 receptor antagonists have failed to show clinical efficacy to date \u2014 a good theory that hasn't panned out in practice, which is exactly why it's testable."},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher notes low postsynaptic 5-HT1A receptor activity in a group of anxiety disorder patients.",question:"This finding is most classically associated with which two conditions specifically?",options:{A:"PTSD and ASD",B:"Specific phobia and agoraphobia",C:"GAD and OCD",D:"Panic disorder and social anxiety disorder"},correct:"D",rationale:"Low postsynaptic 5-HT1A receptor activity is specifically tied to panic disorder and social anxiety disorder, providing part of the SSRI/SNRI efficacy rationale in those two conditions."},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 24-year-old man develops sudden, sustained neck twisting and his eyes roll upward within hours of his first antipsychotic dose.",question:"Which condition is this, and what is the appropriate immediate treatment?",options:{A:"Acute dystonia; treat with IM/IV benztropine or diphenhydramine",B:"Tardive dyskinesia; treat with a VMAT2 inhibitor",C:"Drug-induced parkinsonism; treat with amantadine",D:"Akathisia; treat with propranolol"},correct:"A",rationale:"Sudden, sustained muscle contraction within hours of starting an antipsychotic is acute dystonia \u2014 treated urgently with IM/IV benztropine or diphenhydramine given airway risk."},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient on an antipsychotic for 3 weeks reports 'I feel like I need to crawl out of my skin' and is observed pacing constantly.",question:"Which condition is this, and what is the first-line treatment?",options:{A:"Akathisia; propranolol",B:"Acute dystonia; benztropine",C:"Drug-induced parkinsonism; amantadine",D:"Tardive dyskinesia; valbenazine"},correct:"A",rationale:"Subjective inner restlessness plus observed pacing is akathisia \u2014 the one EPS subtype where a beta-blocker (propranolol), not an anticholinergic, is first-line."},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient on antipsychotics for 6 years develops orofacial chewing and tongue movements. Her family asks about starting an anticholinergic to help.",question:"What is the most accurate response?",options:{A:"Yes, anticholinergics are first-line for this",B:"Anticholinergics have no effect either way",C:"No \u2014 anticholinergics can worsen tardive dyskinesia and should generally be avoided",D:"Anticholinergics should be combined with a higher antipsychotic dose"},correct:"C",rationale:"Anticholinergics can worsen tardive dyskinesia, even though they help the other three EPS subtypes \u2014 a classic 'don't give this' trap question."},{topic:"PTSD",vignette:"A 41-year-old man reports flashbacks so vivid he feels he is reliving his assault, distinct from just remembering it, plus avoidance of the location and hypervigilance, lasting several months.",question:"Which diagnosis best fits this presentation?",options:{A:"Brief Psychotic Disorder",B:"Illness Anxiety Disorder",C:"PTSD",D:"Acute Stress Disorder only"},correct:"C",rationale:"Dissociative flashbacks, avoidance, and hyperarousal together, persisting beyond 1 month, describe PTSD's core symptom clusters."},{topic:"PTSD",vignette:"A patient with newly diagnosed PTSD is being started on an SSRI.",question:"Which two SSRIs carry the strongest evidence base specifically for PTSD?",options:{A:"Sertraline and paroxetine",B:"Fluoxetine and citalopram",C:"Escitalopram and fluvoxamine",D:"Vilazodone and vortioxetine"},correct:"A",rationale:"Sertraline and paroxetine have the most robust PTSD-specific evidence among SSRIs."},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 40-year-old man with panic disorder has an unexpected attack today, with no history of any prior traumatic event.",question:"Which trauma-related disorders require a prior traumatic event, unlike his panic disorder?",options:{A:"Both PTSD and Acute Stress Disorder require a Criterion A trauma exposure; Panic Disorder does not",B:"Only PTSD requires trauma; ASD does not",C:"Neither PTSD nor ASD require trauma exposure",D:"Only ASD requires trauma; PTSD does not"},correct:"A",rationale:"PTSD and ASD both require a Criterion A trauma exposure. Panic Disorder specifically requires no trauma trigger \u2014 attacks are unexpected/unprovoked."},{topic:"OCD",vignette:"A 38-year-old man spends over 3 hours daily washing his hands due to contamination fears, causing his skin to crack, though he recognizes his fear is 'probably not true.'",question:"Which OCD insight specifier applies?",options:{A:"Tic-related specifier",B:"With good or fair insight",C:"With absent insight/delusional beliefs",D:"With poor insight"},correct:"B",rationale:"Recognizing the belief is 'probably not true' is 'good or fair insight' \u2014 distinct from poor insight (believes it's probably true) or absent insight (fully convinced true)."},{topic:"OCD",vignette:"A 40-year-old man with OCD is beginning a psychotherapy that exposes him to feared triggers while blocking his usual ritual response.",question:"Which specific psychotherapy is this, and is it first-line for OCD?",options:{A:"Exposure and Response Prevention; first-line",B:"Interpersonal therapy; not first-line",C:"Psychoanalysis; not first-line",D:"Supportive therapy; not first-line"},correct:"A",rationale:"ERP \u2014 exposure to feared triggers combined with blocking the compulsive response \u2014 is the first-line evidence-based therapy specific to OCD."},{topic:"GAD",vignette:"A 50-year-old man with GAD has a history of substance misuse and wants a medication with zero dependence risk, even if it takes weeks to work.",question:"Which medication best fits this requirement?",options:{A:"Alprazolam",B:"Lorazepam",C:"Buspirone",D:"Diazepam"},correct:"C",rationale:"Buspirone is non-habit-forming and specific to GAD (not effective for panic disorder, no PRN use since it takes weeks to work)."},{topic:"Schizophrenia Prodrome",vignette:"A 26-year-old man has withdrawn from friends, developed unexplained headaches, and become newly preoccupied with unusual religious ideas over the past 9 months \u2014 with no hallucinations or delusions yet confirmed.",question:"This presentation most likely represents which phase of illness?",options:{A:"Active-phase schizophrenia",B:"Prodromal phase of schizophrenia",C:"Malingering",D:"Schizoaffective disorder"},correct:"B",rationale:"Withdrawal, somatic complaints, and unusual preoccupations without confirmed positive symptoms is the classic prodromal picture \u2014 not yet active-phase illness."},{topic:"Positive vs. Negative Symptoms",vignette:"A 49-year-old man with schizophrenia shows minimal facial expression, has stopped initiating conversation, and has lost interest in his hobbies \u2014 with no current hallucinations.",question:"Which category of symptoms is this?",options:{A:"Extrapyramidal symptoms",B:"Prodromal symptoms",C:"Positive symptoms",D:"Negative symptoms"},correct:"D",rationale:"Flat affect, avolition, and anhedonia are negative symptoms \u2014 defined by absence of normal function, and typically more treatment-resistant than positive symptoms."},{topic:"Positive vs. Negative Symptoms",vignette:"Besides positive and negative symptoms, Boland identifies a third symptom domain in schizophrenia involving attention, working memory, and executive function.",question:"What is this third symptom domain called?",options:{A:"Extrapyramidal symptoms",B:"Cognitive symptoms",C:"Prodromal symptoms",D:"Residual symptoms"},correct:"B",rationale:"Cognitive symptoms are a distinct third domain \u2014 often subtle early in the illness but a major driver of long-term disability."},{topic:"Thought Broadcasting",vignette:"A patient with schizophrenia insists coworkers can hear his private thoughts as though broadcast over a loudspeaker.",question:"Which symptom is this?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Delusion of reference",D:"Thought broadcasting"},correct:"D",rationale:"Thought broadcasting is the delusional belief that one's own private thoughts are being transmitted outward for others to hear."},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 29-year-old man's paranoid delusions began during a 3-day methamphetamine binge and resolved completely within a week of stopping, with no prior psychiatric history.",question:"Which diagnosis fits this course?",options:{A:"Delusional disorder",B:"Schizoaffective disorder",C:"Schizophrenia",D:"Substance/Medication-Induced Psychotic Disorder"},correct:"D",rationale:"Symptoms tightly linked to substance use, resolving shortly after stopping, is the classic picture of a substance-induced psychotic disorder."},{topic:"Substance-Induced Psychotic Disorder",vignette:"A patient's psychotic symptoms began during a stimulant relapse and persist unchanged 6 weeks after confirmed abstinence.",question:"What does this persistence suggest about the underlying diagnosis?",options:{A:"This is normal, expected withdrawal",B:"An independent (primary) psychotic disorder is now more likely",C:"This confirms substance-induced psychosis",D:"This confirms delirium"},correct:"B",rationale:"Persistence roughly a month or more beyond cessation points away from substance-induced and toward a primary psychotic disorder."},{topic:"Understanding Hallucinations",vignette:"A patient with schizophrenia reports both auditory hallucinations (voices commenting on his actions) and occasional visual hallucinations of sh
