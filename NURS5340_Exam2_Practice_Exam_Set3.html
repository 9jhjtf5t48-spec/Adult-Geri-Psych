peated recounting of the invasion memory paired with graduated real-world exposure to being home alone?",options:{A:"Cognitive Processing Therapy",B:"Prolonged Exposure",C:"Present-Centered Therapy",D:"Motivational Interviewing"},correct:"B",rationale:"Prolonged Exposure (PE) is defined by repeated imaginal exposure (recounting the trauma memory) plus in-vivo exposure to real-world reminders, aiming to reduce avoidance and facilitate reprocessing. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 45-year-old emergency department nurse has developed PTSD after years of repeated exposure to graphic details of patient trauma cases, without ever personally experiencing a life-threatening event herself.",question:"Which PTSD Criterion A exposure pathway does this represent?",options:{A:"Direct personal experience of the trauma",B:"Witnessing the event happen to someone else in person",C:"Repeated or extreme exposure to aversive details of the traumatic event(s), as in first responders/professionals",D:"Learning that a close family member experienced the trauma"},correct:"C",rationale:"Criterion A(4) covers repeated or extreme exposure to aversive details of a traumatic event, classically applying to first responders, police, and clinicians repeatedly exposed to trauma details through their work -- distinct from direct or witnessed exposure. (DSM-5-TR)"},{topic:"PTSD",vignette:"A 74-year-old combat veteran with longstanding, untreated PTSD is being newly started on pharmacotherapy. He has a remote history of alcohol use disorder, now in sustained remission for over 20 years.",question:"Which medication class should generally be avoided given his history, despite being a fast-acting anxiolytic option?",options:{A:"SSRIs",B:"SNRIs",C:"Benzodiazepines",D:"Alpha-1 antagonists"},correct:"C",rationale:"Benzodiazepines lack evidence for core PTSD symptoms and are relatively contraindicated, particularly given misuse/dependence risk -- a consideration that remains clinically relevant even decades into sustained remission. SSRIs (sertraline/paroxetine) remain first-line. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 39-year-old man with PTSD reports he can no longer recall large portions of the assault, feels completely cut off from friends and family, and has developed the belief that 'people are inherently dangerous.'",question:"These findings best reflect which PTSD symptom cluster?",options:{A:"Intrusion",B:"Avoidance",C:"Negative alterations in cognition and mood",D:"Alterations in arousal and reactivity"},correct:"C",rationale:"Dissociative amnesia for the event, detachment from others, and persistent negative beliefs about others/the world are hallmark features of Criterion D (negative alterations in cognition/mood). (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 30-year-old man was in a workplace explosion 20 days ago. He now has intrusive memories, dissociative episodes, avoidance of the worksite, and hyperarousal significantly impairing his ability to return to work.",question:"Given the current timeframe, which diagnosis is most appropriate?",options:{A:"PTSD",B:"Acute Stress Disorder",C:"Adjustment disorder",D:"Generalized Anxiety Disorder"},correct:"B",rationale:"At 20 days post-trauma, he remains within the ASD window (3 days to 1 month). PTSD cannot be diagnosed until symptoms persist beyond 1 month. (DSM-5-TR; Boland Ch. 10)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 55-year-old woman describes recurrent episodes of sudden chest tightness, sweating, and a feeling of impending doom that occur unpredictably, with no relationship to any prior traumatic event or specific trigger she can identify.",question:"Which feature most clearly points toward Panic Disorder rather than PTSD or Acute Stress Disorder?",options:{A:"The episodes are brief",B:"No identifiable trauma or stressor preceded or triggers the episodes",C:"She has physical symptoms",D:"She avoids situations where attacks have occurred"},correct:"B",rationale:"Unlike PTSD/ASD, which both require a Criterion A trauma exposure, Panic Disorder requires no external trauma/stressor trigger -- attacks classically occur 'out of the blue.' (DSM-5-TR; Boland Ch. 8)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 61-year-old widow has had continuous trauma-related symptoms for 8 months following a violent carjacking, including ongoing hypervigilance and exaggerated startle.",question:"Given this duration, which diagnosis applies?",options:{A:"Acute Stress Disorder",B:"Schizophreniform Disorder",C:"PTSD",D:"Brief Psychotic Disorder"},correct:"C",rationale:"Symptoms persisting past 1 month (here, 8 months) satisfy PTSD's duration requirement (Criterion F, >1 month). ASD would only apply within the first month after the trauma. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A research team is comparing brain imaging findings between adult patients with chronic PTSD and age-matched healthy controls.",question:"Which pattern of findings is most consistent with the current understanding of PTSD neurobiology?",options:{A:"Decreased amygdala activity with increased hippocampal volume",B:"Increased amygdala activity, decreased hippocampal volume, and reduced prefrontal regulation",C:"Isolated cerebellar atrophy with normal amygdala function",D:"Persistently elevated cortisol identical to major depressive disorder"},correct:"B",rationale:"PTSD is classically associated with amygdala hyperactivity, reduced hippocampal volume/activity impairing fear-extinction learning, and reduced prefrontal cortical top-down inhibition of the amygdala. PTSD cortisol is often low/blunted rather than persistently elevated. (Standard psychiatric neuroscience; supplementary to Boland Ch. 10)"},{topic:"OCD",vignette:"A 29-year-old woman spends over 3 hours daily performing handwashing rituals due to intrusive thoughts about contamination, to the point that the skin on her hands has become raw and cracked.",question:"This presentation is most consistent with which OCD symptom pattern?",options:{A:"Contamination/cleansing",B:"Pathologic doubt/checking",C:"Symmetry/ordering",D:"Intrusive/forbidden thoughts"},correct:"A",rationale:"Obsessions about contamination followed by excessive washing/cleansing compulsions -- to the point of physical skin damage -- is the classic presentation of the contamination/cleansing symptom pattern, the most common OCD dimension. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 40-year-old man with OCD has failed an adequate 12-week trial of fluoxetine at the maximum tolerated dose.",question:"Which medication is an evidence-based next step, despite a less favorable side-effect profile?",options:{A:"Buspirone",B:"Clomipramine",C:"Prazosin",D:"Propranolol"},correct:"B",rationale:"Clomipramine has head-to-head evidence showing equal efficacy to SSRIs for OCD but worse tolerability (anticholinergic effects, seizure threshold lowering, cardiotoxicity in overdose) -- a reasonable next step after adequate SSRI failure. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 52-year-old woman believes with complete conviction that failing to check her stove exactly seven times will definitely cause a house fire, with no recognition this belief could be irrational.",question:"Which OCD insight specifier applies?",options:{A:"With good or fair insight",B:"With poor insight",C:"With absent insight/delusional beliefs",D:"Tic-related"},correct:"C",rationale:"Complete conviction that an OCD-related belief is true, without any recognition it might be false, meets criteria for 'absent insight/delusional beliefs.' (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A 60-year-old woman avoids grocery stores, public buses, and movie theaters because she fears she won't be able to escape or get help if she starts to feel panicky. She has never met full criteria for panic disorder but has had these fears for 9 months, requiring a family member to accompany her whenever she leaves home.",question:"Which diagnosis best fits this presentation?",options:{A:"Panic Disorder",B:"Specific phobia, situational type",C:"Agoraphobia",D:"Social Anxiety Disorder"},correct:"C",rationale:"Fear of \u22652 situations (enclosed places, crowds, public transportation) due to difficulty escaping or getting help, with avoidance/companion requirement for \u22656 months, is classic agoraphobia -- diagnosed independently of panic disorder since DSM-5. (DSM-5-TR; Boland Ch. 8)"},{topic:"Agoraphobia",vignette:"A 70-year-old man with chronic obstructive pulmonary disease fears leaving home because of possible sudden breathlessness in public without immediate access to help. His degree of fear and avoidance is judged by his provider to be excessive relative to his actual disease severity.",question:"Which agoraphobia criterion specifically addresses this scenario?",options:{A:"Criterion F (duration)",B:"Criterion H (fear is clearly excessive even though a real medical condition is present)",C:"Criterion A (fear about \u22652 of 5 situations)",D:"Criterion I (rule-out of other disorders)"},correct:"B",rationale:"Criterion H specifically addresses cases where another medical condition is present (e.g., COPD, Parkinson's disease) -- agoraphobia can still be diagnosed if the fear/avoidance is clearly excessive relative to what the medical condition alone would warrant. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 42-year-old man reports a single, isolated episode last month of sudden chest tightness, dizziness, and fear of dying that resolved within 10 minutes, with no recurrence and no ongoing worry about future episodes.",question:"Does this patient meet full criteria for Panic Disorder?",options:{A:"Yes, one panic attack is sufficient for diagnosis",B:"No, because Criterion B (\u22651 month of worry/behavior change) has not been met",C:"Yes, because the episode included \u22654 physical symptoms",D:"No, because panic attacks must be triggered by an identifiable stressor"},correct:"B",rationale:"A single panic attack is necessary but not sufficient for Panic Disorder -- Criterion B requires at least 1 month of persistent worry about additional attacks or significant behavioral change following an attack. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 33-year-old woman with panic disorder is started on an SSRI. While waiting for the medication to reach full effect, the NP considers a short-term adjunct for rapid symptom control.",question:"Which is an appropriate short-term bridging strategy?",options:{A:"Long-term benzodiazepine monotherapy",B:"A brief course of a benzodiazepine while the SSRI takes effect",C:"Discontinuing the SSRI in favor of buspirone",D:"Adding clomipramine"},correct:"B",rationale:"Benzodiazepines can appropriately bridge acute symptom relief while an SSRI/SNRI reaches full effect but are not preferred as long-term monotherapy given dependence risk. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"A 38-year-old patient with panic disorder is found on research imaging to have overactivity of a specific noradrenergic brainstem nucleus during attacks.",question:"Which structure is most classically implicated?",options:{A:"Locus coeruleus",B:"Substantia nigra",C:"Nucleus accumbens",D:"Dorsal raphe nucleus"},correct:"A",rationale:"The locus coeruleus, the brain's primary noradrenergic nucleus, is classically implicated in panic disorder -- its overactivity is thought to drive the autonomic surge characteristic of panic attacks. (Boland Ch. 8, Table 8-9)"},{topic:"SAD vs. Specific Phobia",vignette:"A 35-year-old marketing manager avoids giving presentations at work, fearing he will visibly tremble and be judged as incompetent by his colleagues, though he has no difficulty with one-on-one meetings or being observed at lunch.",question:"Which specifier best fits this presentation, assuming full criteria for the disorder are met?",options:{A:"Performance only",B:"With poor insight",C:"Situational type",D:"Generalized type"},correct:"A",rationale:"When social anxiety is restricted specifically to performing/speaking in public (rather than a broader range of social interactions), the 'performance only' specifier for Social Anxiety Disorder applies. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 50-year-old woman becomes lightheaded and faints whenever she receives a blood draw, and has done so consistently for decades, leading her to avoid all medical procedures involving needles.",question:"Which diagnosis and mechanism best fit this presentation?",options:{A:"Specific phobia, blood-injection-injury type, with a vasovagal response",B:"Panic disorder, with a typical sympathetic surge",C:"Social anxiety disorder, performance only type",D:"Agoraphobia, related to fear of medical settings"},correct:"A",rationale:"Blood-injection-injury (BII) type specific phobia is unique among the phobias for provoking a vasovagal (fainting) response rather than the typical sympathetic activation seen in other phobia types or panic disorder. (DSM-5-TR; Boland Ch. 8)"},{topic:"GAD",vignette:"A 44-year-old accountant presents with 8 months of excessive worry about her job performance, finances, and her aging parents' health. She reports she cannot set these worries aside even when trying to relax, and has developed tension headaches, fatigue, and trouble falling asleep.",question:"Which diagnosis is most consistent with this presentation?",options:{A:"Panic Disorder",B:"Generalized Anxiety Disorder",C:"Adjustment disorder with anxiety",D:"Illness Anxiety Disorder"},correct:"B",rationale:"Excessive, hard-to-control worry about multiple everyday domains for \u22656 months, with associated somatic symptoms (muscle tension, fatigue, sleep disturbance), is the classic GAD presentation. (DSM-5-TR; Boland Ch. 8)"},{topic:"GAD",vignette:"A 39-year-old man with GAD and a remote history of opioid misuse specifically wants to avoid any habit-forming medication.",question:"Which medication would be most appropriate given this history?",options:{A:"Alprazolam",B:"Buspirone",C:"Diazepam",D:"Lorazepam"},correct:"B",rationale:"Buspirone is a non-habit-forming option specifically useful for GAD. The benzodiazepines listed all carry dependence risk and are not preferred given his history. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 26-year-old man has experienced delusions and disorganized speech continuously for 3 months, with no mood episode present during this time and no functional decline noted by his family.",question:"Which diagnosis is most likely at this point in his illness course?",options:{A:"Schizophrenia",B:"Schizophreniform Disorder",C:"Brief Psychotic Disorder",D:"Schizoaffective Disorder"},correct:"B",rationale:"An episode duration of \u22651 month but <6 months, with Criterion A symptoms met, is Schizophreniform Disorder -- a decline in functioning is not a required criterion for this diagnosis. (DSM-5-TR; Boland Ch. 5)"},{topic:"Schizophreniform Disorder",vignette:"A 24-year-old patient diagnosed with Schizophreniform Disorder had sudden onset of psychotic symptoms within 3 weeks of a noticeable change in behavior, presented with confusion and perplexity, had good premorbid occupational functioning, and shows no blunted affect.",question:"Which specifier applies to this presentation?",options:{A:"With catatonia",B:"With good prognostic features",C:"With poor prognostic features",D:"Provisional"},correct:"B",rationale:"'With good prognostic features' requires \u22652 of: onset within 4 weeks of the first noticeable behavioral change, confusion/perplexity, good premorbid functioning, and absence of blunted/flat affect -- this patient meets all four. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 24-year-old graduate student, previously an active member of his research lab, has withdrawn from labmates over the past year, stopped attending department social events, and now spends most of his time alone. His roommate also notes new, unexplained headaches and stomachaches with no medical cause, and his academic performance has declined sharply.",question:"This presentation is most consistent with which phase of illness?",options:{A:"Active-phase schizophrenia",B:"Prodromal phase of schizophrenia",C:"Schizoaffective disorder, depressive type",D:"Malingering"},correct:"B",rationale:"Social withdrawal, functional/occupational decline, and unexplained somatic complaints are classic prodromal features that often precede frank psychotic symptoms by months to years -- positive symptoms like hallucinations/delusions are not yet described here. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 27-year-old man being evaluated for early signs of a possible psychotic disorder is noted by his family to have developed sudden, new obsessive-compulsive-like behaviors over the past several months that were never present before.",question:"How should this finding be interpreted in this context?",options:{A:"It rules out a psychotic illness",B:"It can be part of the prodromal picture preceding schizophrenia",C:"It confirms a primary OCD diagnosis",D:"It suggests a substance-induced etiology"},correct:"B",rationale:"Boland notes that some individuals show a sudden onset of obsessive-compulsive behavior as part of the prodromal picture preceding schizophrenia -- this alone doesn't confirm psychosis, but it is a recognized prodromal feature. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 36-year-old woman experienced a 3-week major depressive episode with concurrent auditory hallucinations and persecutory delusions. Once the depressive episode resolved, the hallucinations and delusions also completely resolved.",question:"Is a diagnosis of Schizoaffective Disorder appropriate here?",options:{A:"Yes, because psychotic symptoms occurred during a mood episode",B:"No, because psychotic symptoms never occurred for \u22652 weeks in the absence of a mood episode",C:"Yes, because the episode lasted more than 2 weeks",D:"No, because the patient never had a manic episode"},correct:"B",rationale:"The defining feature of Schizoaffective Disorder (Criterion B) is that delusions or hallucinations occur for \u22652 weeks in the ABSENCE of a mood episode. Since psychotic symptoms here only occurred during the mood episode and resolved with it, this fits Major Depressive Disorder with psychotic features instead. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 48-year-old woman has chronic auditory hallucinations that persist during both depressive episodes and euthymic periods, but her depressive episodes have made up only about 20% of her total 6-year illness course.",question:"Which criterion for Schizoaffective Disorder is NOT met in this case?",options:{A:"Criterion A (mood episode concurrent with Criterion A symptoms of schizophrenia)",B:"Criterion B (\u22652 weeks of psychosis without a mood episode)",C:"Criterion C (mood symptoms present for the majority of total illness duration)",D:"Criterion D (not attributable to a substance or medical condition)"},correct:"C",rationale:"Criterion C requires mood-episode symptoms to be present for the MAJORITY of the total illness duration. If depressive episodes account for only 20% of the illness course, this criterion fails. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 53-year-old man with schizoaffective disorder has experienced only major depressive episodes throughout his illness course, never a manic or hypomanic episode.",question:"Which subtype specifier applies?",options:{A:"Bipolar type",B:"Depressive type",C:"Mixed type",D:"Unspecified type"},correct:"B",rationale:"'Depressive type' applies when only major depressive episodes are part of the presentation; 'Bipolar type' applies if a manic episode is present. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 62-year-old woman has a decade-long history of chronic auditory hallucinations that intensify during depressive episodes but persist even when her mood is euthymic. She has been unable to maintain steady employment and now lives alone with minimal social contact.",question:"This clinical picture is most classic for which diagnosis?",options:{A:"Major depressive disorder with psychotic features",B:"Schizoaffective disorder",C:"Brief psychotic disorder",D:"Delusional disorder"},correct:"B",rationale:"The persistence of hallucinations independent of mood state, combined with a chronic course and significant functional impairment, is the classic presentation of Schizoaffective Disorder described in Boland Ch. 5. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 58-year-old man with chronic schizophrenia shows minimal facial expression, speaks very little, has lost interest in previously enjoyed hobbies, and rarely initiates social contact. He denies any current hallucinations or delusions.",question:"These findings are best classified as which type of symptom?",options:{A:"Positive symptoms",B:"Negative symptoms",C:"Cognitive symptoms",D:"Extrapyramidal symptoms"},correct:"B",rationale:"Affective flattening, alogia, avolition, and asociality are classic negative symptoms -- defined by the ABSENCE of normal function, and typically more persistent than positive symptoms. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A psychiatric NP explains to a 40-year-old patient's family that certain symptoms of his schizophrenia are less likely to improve significantly with a first-generation antipsychotic.",question:"Which category of symptoms is being described?",options:{A:"Positive symptoms",B:"Negative symptoms",C:"Prodromal symptoms",D:"Catatonic symptoms"},correct:"B",rationale:"Negative symptoms respond poorly to first-generation antipsychotics, with second-generation agents offering only modest additional benefit -- unlike positive symptoms, which generally respond well via D2 blockade. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 28-year-old woman with treatment-resistant depression and a history of bulimia nervosa is being considered for bupropion.",question:"What is the primary safety concern with this choice?",options:{A:"Bupropion has no antidepressant efficacy",B:"Bupropion lowers the seizure threshold, and eating disorders further increase this risk",C:"Bupropion causes significant weight gain in this population",D:"Bupropion is contraindicated in all psychiatric patients"},correct:"B",rationale:"Bupropion carries the highest seizure risk among antidepressants; this risk is compounded in patients with eating disorders due to electrolyte disturbances that further lower the seizure threshold. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 34-year-old man with treatment-resistant schizophrenia is started on a medication known for superior efficacy but requiring counseling about a specific dose-dependent risk that increases substantially above 600 mg/day.",question:"Which medication and risk does this describe?",options:{A:"Risperidone; agranulocytosis",B:"Clozapine; seizures",C:"Haloperidol; tardive dyskinesia",D:"Olanzapine; hyperprolactinemia"},correct:"B",rationale:"Clozapine's seizure risk is dose-dependent, reaching as high as 5% in patients on doses above 600 mg/day per Boland Ch. 5. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher studying anxiety disorders in adults finds that patients demonstrate low postsynaptic 5-HT1A receptor activity.",question:"This finding is most classically associated with which conditions?",options:{A:"Panic disorder and social anxiety disorder",B:"GAD and OCD only",C:"Specific phobia only",D:"Schizophrenia and bipolar disorder"},correct:"A",rationale:"Low postsynaptic 5-HT1A receptor activity has been implicated specifically in panic disorder and social anxiety disorder, providing part of the rationale for SSRI/SNRI efficacy. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 46-year-old executive with performance-related social anxiety is prescribed a medication to take as needed before board presentations, targeting peripheral autonomic symptoms like tremor and tachycardia.",question:"Which medication class is being used, and which neurotransmitter system does it target?",options:{A:"SSRI; serotonergic system",B:"Beta-blocker; noradrenergic system",C:"Benzodiazepine; GABAergic system",D:"TCA; noradrenergic and serotonergic systems"},correct:"B",rationale:"Beta-blockers like propranolol target the noradrenergic system and are specifically used for performance-related/situational anxiety to blunt physical autonomic symptoms. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A 41-year-old man with schizophrenia states, 'Everyone on the bus could hear what I was thinking -- my thoughts were being played out loud for everyone to know.'",question:"This is an example of which symptom?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Thought broadcasting",D:"Ideas of reference"},correct:"C",rationale:"Thought broadcasting is the delusional belief that one's private thoughts are being transmitted/broadcast so others can hear or know them. (Boland Ch. 5, Table 5-1; DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 31-year-old woman developed vivid auditory and visual hallucinations during a 3-day methamphetamine binge. Two months after complete abstinence with no further substance use, the hallucinations persist unchanged and she now also endorses several negative symptoms.",question:"Which diagnosis is now more likely, given the persistence of symptoms?",options:{A:"Substance/Medication-Induced Psychotic Disorder",B:"A primary (independent) psychotic disorder",C:"Delirium",D:"Normal substance withdrawal"},correct:"B",rationale:"Persistence of psychotic symptoms for a substantial period (about 1 month or more per DSM-5-TR) after cessation of acute intoxication/withdrawal points AWAY from a substance-induced etiology and toward an independent primary psychotic disorder. (DSM-5-TR; Boland Ch. 5)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A 66-year-old man presents with new-onset delusions that began during a 2-week course of high-dose corticosteroids for a rheumatologic flare, with no prior psychiatric history.",question:"To diagnose Substance/Medication-Induced Psychotic Disorder, which additional criterion must be confirmed?",options:{A:"The delusions must persist for more than 6 months",B:"The medication must be capable of producing psychotic symptoms and the timeline must fit",C:"The patient must also have hallucinations",D:"The patient must have a family history of psychosis"},correct:"B",rationale:"Criterion B requires evidence that (1) the psychotic symptoms developed during or soon after the substance/medication exposure, AND (2) the substance/medication is capable of producing such symptoms (corticosteroids are a recognized cause). (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A 54-year-old man with chronic schizophrenia reports ongoing auditory hallucinations of voices commenting on his actions, as well as occasional visual hallucinations of shadowy figures.",question:"According to Boland, how should these findings be interpreted?",options:{A:"Both are unusual and should prompt an urgent medical workup",B:"Both auditory and visual hallucinations are common in schizophrenia itself",C:"The visual hallucinations alone suggest a medical/organic cause",D:"Neither type of hallucination is consistent with schizophrenia"},correct:"B",rationale:"Per Boland Ch. 5, both auditory and visual hallucinations are common in schizophrenia; it is specifically tactile, olfactory, and gustatory hallucinations that are 'unusual' in primary psychosis and should prompt consideration of an underlying medical/neurologic cause. (Boland Ch. 5)"},{topic:"Understanding Hallucinations",vignette:"A 59-year-old man in alcohol withdrawal reports a sensation of insects crawling on his skin.",question:"This finding is best classified as which type of hallucination, and what does it suggest?",options:{A:"Auditory hallucination; classic for schizophrenia",B:"Tactile hallucination; classically associated with stimulant use or alcohol withdrawal",C:"Olfactory hallucination; suggests temporal lobe epilepsy",D:"Gustatory hallucination; suggests a mood disorder"},correct:"B",rationale:"Tactile hallucinations, including formication, are classically associated with stimulant intoxication and alcohol withdrawal (delirium tremens) -- an 'unusual' hallucination type warranting consideration of a medical/substance-related cause. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"When asked how she has been sleeping, a 47-year-old woman with schizophrenia responds, 'Sleeping, yes, the moon sleeps too, and moons are made of cheese, and cheese comes from cows, and cows are sacred in some countries...'",question:"This pattern of speech is best described as:",options:{A:"Circumstantiality",B:"Tangentiality",C:"Derailment (loose associations)",D:"Clanging"},correct:"C",rationale:"Derailment (loose associations) describes ideas that slip from one topic to a loosely or unrelated one, as shown in this chain of disconnected associations. (Boland Ch. 5, Table 5-1)"},{topic:"Disorganized Speech",vignette:"A 63-year-old man responds to 'What did you have for breakfast?' with a 5-minute answer full of excessive, unnecessary detail about his entire morning routine before eventually answering, 'eggs.'",question:"This speech pattern is best described as:",options:{A:"Tangentiality",B:"Circumstantiality",C:"Incoherence",D:"Thought blocking"},correct:"B",rationale:"Circumstantiality involves excessive, unnecessary detail before eventually reaching the point -- unlike tangentiality, which never returns to answer the original question. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"Within 24 hours of receiving an IM dose of haloperidol, a 37-year-old man develops sudden, sustained neck twisting, and his eyes roll upward involuntarily.",question:"Which condition is this, and what is the appropriate immediate treatment?",options:{A:"Tardive dyskinesia; switch to clozapine",B:"Acute dystonia; IM/IV benztropine or diphenhydramine",C:"Akathisia; propranolol",D:"Drug-induced parkinsonism; amantadine"},correct:"B",rationale:"Sudden, sustained muscle contraction (torticollis, oculogyric crisis) within hours to days of antipsychotic initiation is classic acute dystonia, requiring prompt treatment with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 44-year-old man on risperidone for 3 weeks reports intense inner restlessness, stating, 'I feel like I want to crawl out of my skin,' and is observed pacing and repeatedly shifting his weight while seated.",question:"Which treatment is considered first-line for this condition?",options:{A:"Benztropine",B:"Trihexyphenidyl",C:"Propranolol",D:"Valbenazine"},correct:"C",rationale:"Akathisia is best treated first-line with a beta-blocker like propranolol (30-90 mg/day); anticholinergics are less effective for akathisia specifically. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 78-year-old nursing home resident who has been on a first-generation antipsychotic for over 6 years develops involuntary lip smacking, tongue protrusion, and chewing movements.",question:"Given her age, which additional consideration is most relevant per Boland?",options:{A:"Elderly patients have a much lower risk of tardive dyskinesia than younger adults",B:"The risk of tardive dyskinesia is much higher in elderly patients, and anticholinergics should be avoided since they may worsen TD",C:"Tardive dyskinesia does not occur after age 70",D:"Anticholinergics are the preferred first-line treatment for TD"},correct:"B",rationale:"Boland Ch. 5 notes that TD risk is much higher in elderly patients, and anticholinergics -- while helpful for other EPS subtypes -- should be avoided in TD because they can worsen it. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A 43-year-old woman with treatment-resistant schizophrenia has had two serious suicide attempts in the past year despite adequate trials of two different antipsychotics.",question:"Which medication has an FDA-approved indication specifically for reducing suicidal behavior in this population?",options:{A:"Risperidone",B:"Clozapine",C:"Aripiprazole",D:"Quetiapine"},correct:"B",rationale:"Clozapine is the only antipsychotic with an FDA-approved indication specifically for reducing recurrent suicidal behavior in schizophrenia/schizoaffective disorder, based on the InterSePT trial. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A 57-year-old man with bipolar I disorder and a history of multiple suicide attempts is being considered for a medication specifically to reduce long-term suicide risk.",question:"Which medication has the strongest evidence base for this purpose in mood disorders?",options:{A:"Valproate",B:"Lithium",C:"Lamotrigine",D:"Quetiapine"},correct:"B",rationale:"Lithium has the strongest evidence base for reducing suicide risk specifically in mood disorders (bipolar disorder and recurrent MDD) -- the parallel answer to clozapine's role in schizophrenia/schizoaffective disorder. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A 49-year-old man started on a high-potency first-generation antipsychotic 2 weeks ago now demonstrates a masked, expressionless face, a resting 'pill-rolling' tremor, cogwheel rigidity, and a shuffling gait.",question:"Which condition is being described, and what is an appropriate treatment?",options:{A:"Tardive dyskinesia; valbenazine",B:"Akinesia/drug-induced parkinsonism; anticholinergic or dose reduction",C:"Acute dystonia; IM benztropine",D:"Neuroleptic malignant syndrome; dantrolene"},correct:"B",rationale:"The classic parkinsonism triad (bradykinesia, rigidity, tremor) plus masked facies and shuffling gait, developing over days to weeks, describes drug-induced parkinsonism/akinesia. First-line treatment includes anticholinergics, amantadine, or dose reduction. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A clinician wants to objectively monitor a 65-year-old patient on long-term antipsychotic therapy for early signs of abnormal involuntary movements at routine visits.",question:"Which standardized rating scale is most appropriate for this purpose?",options:{A:"Barnes Akathisia Rating Scale (BARS)",B:"Abnormal Involuntary Movement Scale (AIMS)",C:"Hamilton Anxiety Rating Scale",D:"PANSS"},correct:"B",rationale:"The AIMS is the standard scale for monitoring tardive dyskinesia/abnormal involuntary movements; BARS is used specifically for akathisia. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"During a mental status exam, a 51-year-old patient states, 'I feel great today,' but the clinician observes a flat, unchanging facial expression, monotone speech, and no spontaneous gestures throughout the interview.",question:"How should the clinician document this finding?",options:{A:"Mood: flat; Affect: euthymic",B:"Mood: 'great' (patient-reported); Affect: blunted/flat, mood-incongruent",C:"Mood and affect are both euthymic and congruent",D:"This is a normal finding requiring no further documentation"},correct:"B",rationale:"Mood is the patient's subjective report ('I feel great'), while affect is the clinician's objective observation (flat, blunted expression) -- here, mood and affect are incongruent, an important clinical finding often seen in schizophrenia. (Boland Ch. 1)"},{topic:"Mood vs. Affect",vignette:"A 72-year-old patient's affect shifts rapidly and unpredictably between crying and laughing within the same brief interview, without an apparent external trigger.",question:"This finding in affect would most likely be documented using which descript
