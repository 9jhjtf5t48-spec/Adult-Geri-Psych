edic developed PTSD after years of repeated exposure to graphic accident scenes, without ever personally being in danger himself. He now avoids emergency scenes, has nightmares, and feels emotionally numb.",question:"Which diagnosis best fits, and what type of trauma exposure led to it?",options:{A:"Adjustment Disorder, unrelated to trauma exposure",B:"Acute Stress Disorder, from witnessing an event",C:"PTSD, from direct personal danger",D:"PTSD, from repeated professional exposure to aversive details"},correct:"D",rationale:"Repeated or extreme professional exposure to aversive details of traumatic events (as in first responders) is a recognized trauma exposure pathway leading to PTSD, distinct from direct danger. (DSM-5-TR; Boland Ch. 10)"},{topic:"PTSD",vignette:"A 55-year-old man with PTSD and significant marital conflict related to his symptoms is beginning treatment; his wife struggles to understand his behavior.",question:"Which therapy modality does Boland specifically note as useful in this situation?",options:{A:"Electroconvulsive therapy",B:"Psychoanalysis alone",C:"Hypnosis alone",D:"Family therapy"},correct:"D",rationale:"Boland Ch. 10 notes family therapy is effective for PTSD, particularly when relational strain and family understanding of the illness are part of the clinical picture. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A 63-year-old woman with PTSD is prescribed an SNRI after not tolerating two SSRIs.",question:"Which SNRI has the strongest evidence base for PTSD?",options:{A:"Venlafaxine",B:"Duloxetine",C:"Levomilnacipran",D:"Desvenlafaxine"},correct:"A",rationale:"Venlafaxine is the SNRI specifically noted in Boland Ch. 10 as having a strong evidence base for PTSD. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A 42-year-old man's PTSD symptoms did not fully meet diagnostic criteria until 7 months after his trauma, though mild symptoms had been present earlier.",question:"Which PTSD specifier applies to this presentation?",options:{A:"Provisional",B:"With dissociative symptoms",C:"With delayed expression",D:"Acute"},correct:"C",rationale:"'With delayed expression' applies when full diagnostic criteria are not met until at least 6 months after the trauma. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 35-year-old man is 6 days out from surviving a building collapse, with intrusive memories, emotional numbing, and severe anxiety impairing his return to work.",question:"Which diagnosis is most appropriate at this point?",options:{A:"PTSD",B:"Acute Stress Disorder",C:"Panic Disorder",D:"Brief Psychotic Disorder"},correct:"B",rationale:"At 6 days post-trauma, he is within the ASD window (3 days\u20131 month); PTSD requires symptoms beyond 1 month. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 48-year-old woman has recurring, unprovoked episodes of dread and sweating occurring regardless of setting, with no history of any traumatic event.",question:"Which diagnosis is most likely?",options:{A:"Acute Stress Disorder",B:"Panic Disorder",C:"PTSD",D:"Adjustment Disorder"},correct:"B",rationale:"Attacks with no trauma exposure and no identifiable trigger point toward Panic Disorder, which requires no trauma trigger, unlike PTSD/ASD. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 59-year-old man's trauma-related symptoms have persisted continuously for 10 months following a serious assault, significantly impairing his daily functioning.",question:"Which diagnosis applies given this duration?",options:{A:"Acute Stress Disorder",B:"PTSD",C:"Brief Psychotic Disorder",D:"Adjustment Disorder only"},correct:"B",rationale:"Symptoms persisting well beyond 1 month satisfy PTSD's Criterion F duration requirement; ASD is capped at 1 month. (DSM-5-TR)"},{topic:"PTSD Neuroanatomy",vignette:"A patient with chronic PTSD shows a pattern of amygdala overactivity coupled with reduced hippocampal and prefrontal activity, resulting in exaggerated, poorly-extinguished fear responses.",question:"Which condition does this neurobiological pattern best explain?",options:{A:"Schizophrenia",B:"Panic Disorder",C:"PTSD",D:"OCD"},correct:"C",rationale:"Amygdala hyperactivity combined with reduced hippocampal/prefrontal activity is the classic PTSD neurocircuitry pattern underlying exaggerated fear responses and impaired extinction learning. (Standard psychiatric neuroscience; Boland Ch. 10)"},{topic:"OCD",vignette:"A 39-year-old man repeatedly returns to check that his stove is off, driven by intrusive doubt, even after confirming it minutes earlier, consuming several hours of his day.",question:"Which diagnosis best fits this presentation?",options:{A:"Illness Anxiety Disorder",B:"OCD",C:"Specific phobia",D:"Generalized Anxiety Disorder"},correct:"B",rationale:"Intrusive doubt-driven checking rituals consuming significant daily time is the classic OCD presentation, specifically the pathologic doubt/checking symptom pattern. (DSM-5-TR; Boland Ch. 9)"},{topic:"OCD",vignette:"A 46-year-old woman with OCD is beginning a psychotherapy that involves exposure to her feared trigger followed by deliberately blocking her usual compulsive response.",question:"Which therapy is this?",options:{A:"Cognitive Processing Therapy",B:"Exposure and Response Prevention",C:"Interpersonal Therapy",D:"Present-Centered Therapy"},correct:"B",rationale:"ERP is defined by exposure to feared triggers combined with blocking the compulsive response, the first-line evidence-based psychotherapy for OCD. (Boland Ch. 9)"},{topic:"OCD",vignette:"A 51-year-old man has accumulated so many old newspapers and containers that most rooms in his home are impassable, and he becomes acutely distressed at the thought of discarding any.",question:"Which OCD-related pattern does this represent?",options:{A:"Contamination/cleansing",B:"Hoarding-type concerns",C:"Symmetry/ordering",D:"Pathologic doubt/checking"},correct:"B",rationale:"Difficulty discarding possessions leading to accumulation and functional impairment describes hoarding-type concerns. (Boland Ch. 9)"},{topic:"Agoraphobia",vignette:"A 73-year-old widower refuses to attend his granddaughter's graduation because it will be held in a large auditorium, fearing he won't be able to leave if he feels unwell.",question:"Which diagnosis best fits this presentation?",options:{A:"Agoraphobia",B:"Social Anxiety Disorder",C:"Specific phobia",D:"Panic Disorder"},correct:"A",rationale:"Fear of being unable to escape a large enclosed gathering is one of the defining agoraphobia situations, distinct from social judgment fears (SAD) or a discrete object fear (specific phobia). (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A 44-year-old man meets full criteria for both Panic Disorder and Agoraphobia at the same time.",question:"How should his diagnoses be documented per DSM-5?",options:{A:"Both diagnoses should be documented, since DSM-5 treats them as independent conditions",B:"Neither can be diagnosed simultaneously",C:"Only Panic Disorder should be diagnosed",D:"Only Agoraphobia should be diagnosed"},correct:"A",rationale:"Since DSM-5, Agoraphobia is diagnosed independently of Panic Disorder; if criteria for both are met, both are documented. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 40-year-old woman experiences abrupt episodes of derealization, palpitations, and fear of dying that peak within minutes, followed by a month of persistent worry about having another episode.",question:"Which diagnosis best fits this presentation?",options:{A:"Specific phobia",B:"PTSD",C:"Panic Disorder",D:"Generalized Anxiety Disorder"},correct:"C",rationale:"Recurrent unexpected attacks with the described symptoms, followed by \u22651 month of persistent worry, is the classic Panic Disorder presentation. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A 36-year-old man's panic attacks are linked on imaging to overactivity of the brainstem's primary noradrenergic nucleus.",question:"Which structure is this?",options:{A:"Dorsal raphe nucleus",B:"Nucleus accumbens",C:"Locus coeruleus",D:"Substantia nigra"},correct:"C",rationale:"The locus coeruleus is the brain's primary noradrenergic nucleus, classically implicated in driving the autonomic surge of panic attacks. (Boland Ch. 8, Table 8-9)"},{topic:"Panic Disorder",vignette:"A 52-year-old man with panic disorder is being counseled about non-pharmacologic treatment options that specifically target catastrophic misinterpretation of physical sensations.",question:"Which psychotherapy approach is this?",options:{A:"Interoceptive-focused CBT",B:"Psychodynamic therapy",C:"Family therapy",D:"Motivational interviewing"},correct:"A",rationale:"CBT for panic disorder that incorporates interoceptive exposure specifically targets catastrophic misinterpretation of bodily sensations, which perpetuates the panic cycle. (Boland Ch. 8)"},{topic:"SAD vs. Specific Phobia",vignette:"A 33-year-old woman avoids eating at restaurants, terrified that others will judge how she handles utensils, though she eats comfortably alone or with close family.",question:"Which diagnosis best fits this presentation?",options:{A:"Social Anxiety Disorder",B:"Agoraphobia",C:"Avoidant/Restrictive Food Intake Disorder",D:"Specific phobia"},correct:"A",rationale:"Fear of negative judgment while performing an activity (eating) in front of others is characteristic of Social Anxiety Disorder. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A 61-year-old man has an intense, lifelong fear of thunderstorms, refusing to leave his home whenever storm clouds appear.",question:"Which diagnosis and phobia subtype best fit this presentation?",options:{A:"Agoraphobia",B:"Specific phobia, natural environment type",C:"Generalized Anxiety Disorder",D:"Specific phobia, situational type"},correct:"B",rationale:"Fear of natural environment phenomena such as storms is classified as the natural environment type of specific phobia. (DSM-5-TR)"},{topic:"GAD",vignette:"A 56-year-old woman has excessively worried about her health, her spouse's job, and household finances for the past year, with associated irritability and difficulty concentrating, unable to control the worry despite trying.",question:"Which diagnosis best fits this presentation?",options:{A:"Panic Disorder",B:"Adjustment Disorder",C:"GAD",D:"Illness Anxiety Disorder"},correct:"C",rationale:"Excessive, hard-to-control worry spanning multiple domains for \u22656 months, with associated symptoms, is the classic GAD presentation. (DSM-5-TR)"},{topic:"GAD",vignette:"A 38-year-old man with GAD asks his PMHNP whether pregabalin carries FDA approval for his condition in the United States.",question:"What is the accurate response?",options:{A:"Pregabalin has evidence for GAD but lacks FDA approval for this specific indication",B:"No, pregabalin has never been studied for anxiety",C:"Yes, it is fully FDA-approved for GAD",D:"Pregabalin is a benzodiazepine with identical risks"},correct:"A",rationale:"Pregabalin has evidence supporting use in GAD but lacks U.S. FDA approval for that specific indication. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A 26-year-old woman has had active hallucinations and grossly disorganized behavior for 4 months, with schizoaffective disorder and mood disorders with psychosis already ruled out.",question:"Which diagnosis fits this duration?",options:{A:"Schizophrenia",B:"Delusional Disorder",C:"Brief Psychotic Disorder",D:"Schizophreniform Disorder"},correct:"D",rationale:"A duration of \u22651 month but <6 months, with other diagnoses ruled out, fits Schizophreniform Disorder. (DSM-5-TR)"},{topic:"Schizophreniform Disorder",vignette:"A 29-year-old man's psychotic symptoms began abruptly within 3 weeks of a noticeable behavioral change; he presented with marked confusion, good premorbid functioning, and no blunted affect.",question:"Which specifier applies to his Schizophreniform Disorder diagnosis?",options:{A:"With catatonia",B:"With poor prognostic features",C:"Provisional",D:"With good prognostic features"},correct:"D",rationale:"'With good prognostic features' requires \u22652 of: rapid onset, confusion, good premorbid functioning, absence of blunted affect -- he meets all four. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 24-year-old woman has developed new, unexplained physical complaints (headaches, GI upset) alongside social withdrawal over several months, initially evaluated only for medical causes before psychiatric referral.",question:"What does this pattern most likely represent?",options:{A:"A confirmed diagnosis of somatic symptom disorder",B:"Definite active-phase schizophrenia",C:"A possible prodromal presentation of schizophrenia, with somatic complaints as an early sign",D:"Malingering for secondary gain"},correct:"C",rationale:"Somatic complaints can be an early prodromal sign, sometimes initially misattributed to medical causes before the psychotic illness is recognized. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A 32-year-old man's prodromal symptoms began shortly after a major life stressor -- the loss of his job -- and gradually progressed over several months before his first psychotic episode.",question:"What does Boland note about the role of stressors in this context?",options:{A:"Stressors have no established relationship to prodromal onset",B:"A significant stressor can serve as a precipitant that unmasks or brings the prodromal disturbance to clinical attention",C:"Stressors only matter after the first psychotic episode",D:"This confirms a diagnosis of adjustment disorder instead"},correct:"B",rationale:"Boland Ch. 5 notes social/environmental stressors may precipitate or unmask an evolving prodromal disturbance. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 58-year-old woman has chronic persecutory delusions that persist during both her manic episodes and euthymic periods; she has had unstable housing and employment for over 15 years.",question:"Which diagnosis is most classic for this presentation?",options:{A:"Schizoaffective Disorder",B:"Brief Psychotic Disorder",C:"Bipolar I Disorder with psychotic features",D:"Delusional Disorder"},correct:"A",rationale:"Persistence of delusions independent of mood state, combined with chronic course and functional impairment, is the classic Schizoaffective Disorder presentation. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A 50-year-old man's psychotic symptoms occur exclusively during his manic episodes and fully resolve as his mood stabilizes; he has never had psychosis otherwise.",question:"Which diagnosis is most likely?",options:{A:"Delusional Disorder",B:"Schizoaffective Disorder, bipolar type",C:"Bipolar I Disorder with psychotic features",D:"Schizophrenia"},correct:"C",rationale:"Psychosis confined entirely to mood episodes and resolving with them fits Bipolar I Disorder with psychotic features, not Schizoaffective Disorder, which requires \u22652 weeks of psychosis independent of mood episodes. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A 45-year-old man with schizoaffective disorder has experienced only major depressive episodes throughout his entire illness course, never a manic or hypomanic episode.",question:"Which specifier applies?",options:{A:"Depressive type",B:"Mixed type",C:"Bipolar type",D:"Unspecified type"},correct:"A",rationale:"'Depressive type' applies when only major depressive episodes are part of the presentation. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A nurse practitioner student asks why a patient newly diagnosed with schizoaffective disorder is being started on both a mood stabilizer and an antipsychotic simultaneously.",question:"What is the most clinically accurate explanation?",options:{A:"Treatment often needs to address both mood and psychotic symptoms given the combined presentation",B:"Mood symptoms in schizoaffective disorder never require treatment",C:"Antipsychotics are never indicated in this diagnosis",D:"Treatment must target only psychotic symptoms"},correct:"A",rationale:"Because schizoaffective disorder combines mood-episode symptoms with psychotic symptoms, treatment typically must address both domains. (Boland Ch. 5)"},{topic:"Positive vs. Negative Symptoms",vignette:"A 43-year-old man with schizophrenia experiences vivid persecutory delusions and grossly disorganized behavior during an acute exacerbation.",question:"Which symptom category is this?",options:{A:"Cognitive symptoms",B:"Residual symptoms only",C:"Negative symptoms",D:"Positive symptoms"},correct:"D",rationale:"Delusions and disorganized behavior are positive symptoms, reflecting an excess or distortion of normal function during an acute episode. (Boland Ch. 5, Table 5-1)"},{topic:"Positive vs. Negative Symptoms",vignette:"A researcher notes that some patients with schizophrenia show subtle deficits in attention and working memory even before their first psychotic episode.",question:"Which symptom domain does this describe?",options:{A:"Extrapyramidal symptoms",B:"Negative symptoms",C:"Positive symptoms",D:"Cognitive symptoms"},correct:"D",rationale:"Boland identifies cognitive symptoms (attention, working memory, executive function) as a distinct third domain, often subtle early in the illness. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A 34-year-old man on chronic tramadol for pain is also being started on an SNRI for depression.",question:"What is the primary safety concern with this combination?",options:{A:"No interaction of concern exists",B:"Tramadol has no effect on seizure threshold",C:"Combining tramadol with an SNRI increases seizure risk",D:"SNRIs eliminate tramadol's seizure risk"},correct:"C",rationale:"Tramadol lowers the seizure threshold, especially in combination with SSRIs/SNRIs/TCAs -- an important interaction to flag. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"A 48-year-old man is being switched between two first-generation antipsychotics; his provider wants to minimize seizure risk given his history of a single unprovoked seizure.",question:"Which choice reflects awareness of relative seizure risk among antipsychotics?",options:{A:"All antipsychotics carry identical seizure risk",B:"Seizure risk is not a consideration with antipsychotics",C:"Choose chlorpromazine, since low-potency FGAs carry lower seizure risk",D:"Avoid chlorpromazine, since low-potency FGAs carry greater seizure risk than high-potency FGAs"},correct:"D",rationale:"Low-potency first-generation antipsychotics like chlorpromazine carry greater seizure risk than high-potency FGAs, an important consideration for a patient with a seizure history. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A 39-year-old man's anxiety disorder is linked to reduced GABA levels and reduced GABA-A/benzodiazepine receptor binding on functional imaging.",question:"Which medication class directly targets this specific neurochemical finding?",options:{A:"Benzodiazepines",B:"TCAs",C:"SSRIs",D:"Beta-blockers"},correct:"A",rationale:"Benzodiazepines directly potentiate GABA-A receptor activity, mechanistically addressing the reduced GABA-A binding implicated in anxiety disorders. (Boland Ch. 8, Table 8-9)"},{topic:"Neurotransmitters & Anxiety",vignette:"A researcher proposes a CRH-1 receptor antagonist as a novel anxiolytic, given persistently increased CRH concentration observed in anxiety disorder patients.",question:"What does Boland note about this treatment approach's clinical track record?",options:{A:"It has shown strong, consistent efficacy in trials",B:"It is already FDA-approved for GAD",C:"CRH-1 receptor antagonists have, to date, failed to demonstrate efficacy in clinical trials",D:"It has never been studied in humans"},correct:"C",rationale:"Despite the theoretical rationale, Boland Ch. 8 notes CRH-1 receptor antagonists have to date failed to demonstrate efficacy in clinical trials. (Boland Ch. 8, Table 8-9)"},{topic:" d salad",D:"Tangentiality"},correct:"B",rationale:"Clanging describes speech in which word choice is governed by sound or rhyme rather than meaning. (Boland Ch. 5, Table 5-1)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 22-year-old man develops sudden jaw spasm and difficulty speaking within hours of his first antipsychotic dose.",question:"Which condition is this, and what is the appropriate treatment?",options:{A:"Akathisia; propranolol",B:"Tardive dyskinesia; VMAT2 inhibitor",C:"Parkinsonism; amantadine",D:"Acute dystonia; IM/IV benztropine or diphenhydramine"},correct:"D",rationale:"Sudden muscle contraction (jaw/speech muscles) within hours of antipsychotic initiation is acute dystonia, treated with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 60-year-old woman on an antipsychotic for 2 weeks develops bradykinesia, rigidity, and a resting tremor.",question:"Which condition is this, and what treatment approach is first-line?",options:{A:"Akathisia; propranolol",B:"Acute dystonia; benztropine IM",C:"Tardive dyskinesia; VMAT2 inhibitor",D:"Drug-induced parkinsonism; anticholinergic or dose reduction"},correct:"D",rationale:"The classic parkinsonism triad (bradykinesia, rigidity, tremor) is drug-induced parkinsonism, treated first-line with an anticholinergic or dose reduction. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 77-year-old woman develops repetitive orofacial dyskinetic movements after 6 years on a first-generation antipsychotic.",question:"Which factor makes her particularly high-risk for this condition, per Boland?",options:{A:"Short-term antipsychotic exposure increases risk more than long-term exposure",B:"Her advanced age, since tardive dyskinesia risk is much higher in elderly patients",C:"Her sex has no bearing on risk",D:"Her young age"},correct:"B",rationale:"Boland Ch. 5 explicitly notes tardive dyskinesia risk is much higher in elderly patients compared to younger patients. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A 49-year-old man with schizoaffective disorder and recurrent suicidal ideation has failed two antipsychotic trials.",question:"Which medication has an FDA-approved indication specifically for reducing his suicide risk?",options:{A:"Clozapine",B:"Ziprasidone",C:"Risperidone",D:"Quetiapine"},correct:"A",rationale:"Clozapine has an FDA-approved indication specifically for reducing suicidal behavior in schizophrenia/schizoaffective disorder. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A 54-year-old woman with bipolar I disorder and multiple past suicide attempts needs long-term suicide risk reduction as part of her maintenance regimen.",question:"Which medication has the strongest evidence base for this specific purpose?",options:{A:"Quetiapine",B:"Valproate",C:"Olanzapine",D:"Lithium"},correct:"D",rationale:"Lithium has the strongest evidence base for reducing suicide risk specifically in mood disorders such as bipolar disorder. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A 28-year-old man starting a high-potency FGA with no prior antipsychotic exposure is at elevated risk for a specific EPS subtype based on his age and sex.",question:"Which EPS subtype is he at highest risk for, and what preventive measure may be considered?",options:{A:"Parkinsonism; no preventive measures exist",B:"Akathisia; prophylactic beta-blockers are mandatory for all patients",C:"Acute dystonia; prophylactic anticholinergics may be considered in this high-risk group",D:"Tardive dyskinesia; no prevention exists"},correct:"C",rationale:"Young men on high-potency FGAs are at highest risk for acute dystonia, and prophylactic anticholinergics may be considered specifically in this high-risk population. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A patient's EPS symptoms only partially improve with an anticholinergic, leaving residual bradykinesia and rigidity.",question:"What does Boland note about anticholinergic effectiveness in managing EPS overall?",options:{A:"Anticholinergics have no role in EPS management",B:"Anticholinergics always completely resolve all EPS",C:"This finding indicates a new diagnosis of tardive dyskinesia",D:"Anticholinergics are often only partially effective, and residual EPS is common"},correct:"D",rationale:"Boland Ch. 5 notes anticholinergics are often only partially effective, and patients may be left with residual extrapyramidal symptoms despite treatment. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"A 62-year-old patient reports feeling 'terrible,' but the clinician observes him smiling broadly and joking throughout the visit.",question:"How should this presentation be characterized?",options:{A:"Mood is 'terrible' and affect is euthymic/smiling; the two are incongruent",B:"Mood and affect must always match, so this is a charting error",C:"Only the observed affect needs to be documented",D:"This presentation has no clinical significance"},correct:"A",rationale:"Mood is the patient's subjective report; affect is the clinician's objective observation. Incongruence between the two, as here, is itself a documented clinical finding. (Boland Ch. 1)"},{topic:"Mood vs. Affect",vignette:"A 68-year-old patient shows almost no variation in facial expression or vocal tone throughout a 40-minute interview, regardless of the topic discussed.",question:"This affect finding is best documented as:",options:{A:"Euthymic",B:"Flat/blunted",C:"Full range",D:"Labile"},correct:"B",rationale:"A near-total absence of variation in facial expression and vocal tone describes flat or blunted affect -- a severe restriction in emotional expression. (Boland Ch. 1)"}],_t=Jn.length;function Vo(){let[t,l]=(0,Kn.useState)(0),[e,a]=(0,Kn.useState)(Array(_t).fill(null)),[n,i]=(0,Kn.useState)(Array(_t).fill(!1)),[u,c]=(0,Kn.useState
