luoxetine and citalopram",B:"Sertraline and paroxetine",C:"Escitalopram and fluvoxamine",D:"Paroxetine and venlafaxine"},correct:"B",rationale:"Sertraline and paroxetine have the most robust evidence for PTSD efficacy among SSRIs. Venlafaxine is an SNRI with promising but less robust evidence; fluoxetine, citalopram, escitalopram, and fluvoxamine are not specifically highlighted with the same strength of evidence for PTSD in Boland. (Boland Ch. 10, Table 10-7)"},{topic:"PTSD",vignette:"A patient's PTSD psychotherapy focuses on correcting distorted beliefs such as 'the world is completely unsafe' and 'the assault was my fault,' emphasizing cognitive restructuring rather than structured repeated exposure to the trauma memory itself.",question:"Which therapy is being described?",options:{A:"Prolonged Exposure",B:"Cognitive Processing Therapy",C:"EMDR",D:"Present-Centered Therapy"},correct:"B",rationale:"Cognitive Processing Therapy (CPT) emphasizes correcting faulty, trauma-related attributions and overgeneralizations (the world as dangerous, uncontrollable, unpredictable), distinct from PE's exposure-based approach or EMDR's bilateral stimulation. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A patient with PTSD and comorbid chronic insomnia is being started on treatment. The NP wants to avoid benzodiazepines for sleep specifically.",question:"Which medication is preferable for insomnia in this context?",options:{A:"Alprazolam",B:"Low-dose trazodone",C:"Diazepam",D:"Lorazepam"},correct:"B",rationale:"Boland notes low-dose trazodone is preferable to benzodiazepines for insomnia in chronic PTSD; the orexin antagonist suvorexant is also mentioned as promising for trauma-related insomnia. (Boland Ch. 10)"},{topic:"PTSD",vignette:"A veteran with PTSD describes recurring nightmares and avoidance of reminders, and also reports he now believes 'no one can be trusted' and feels emotionally numb, unable to feel happiness even at his child's birthday party.",question:"The inability to experience positive emotions falls under which PTSD criterion?",options:{A:"Criterion B (intrusion)",B:"Criterion C (avoidance)",C:"Criterion D (negative alterations in cognition/mood)",D:"Criterion E (arousal/reactivity)"},correct:"C",rationale:"Persistent inability to experience positive emotions is explicitly listed under Criterion D (negative alterations in cognition and mood), alongside persistent negative beliefs like 'no one can be trusted.' (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A 19-year-old survived a mass shooting 25 days ago. She has dissociative symptoms, intrusive memories, and severe anxiety causing her to miss school, meeting roughly 10 of the 14 symptoms across the required symptom categories.",question:"Which diagnosis fits, and why?",options:{A:"PTSD, because she meets a high symptom count",B:"Acute Stress Disorder, because she is within the 3-day-to-1-month post-trauma window",C:"Panic Disorder, because of her anxiety",D:"Adjustment disorder, because of the school impairment"},correct:"B",rationale:"At 25 days post-trauma, she remains within the ASD window (3 days to 1 month). Meeting \u22659 of 14 symptoms across the 5 required categories supports ASD; PTSD cannot be diagnosed until symptoms persist beyond 1 month regardless of symptom count. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A man has sudden episodes of racing heart, sweating, and fear of dying that began after a car accident, but these episodes only occur when he is a passenger in a car -- never in any other situation.",question:"What does this consistently situational trigger pattern suggest?",options:{A:"This points away from Panic Disorder, since Panic Disorder involves unexpected, untriggered attacks rather than a consistent situational cue",B:"This confirms Panic Disorder with agoraphobia",C:"This is diagnostic of GAD",D:"This is diagnostic of OCD"},correct:"A",rationale:"Panic Disorder specifically requires recurrent UNEXPECTED attacks. A pattern of attacks consistently and exclusively tied to one situational cue (riding in a car after an accident) points toward a cued/expected-attack pattern more consistent with PTSD-related reactivity or a specific phobia rather than Panic Disorder. (DSM-5-TR)"},{topic:"PTSD vs. ASD vs. Panic",vignette:"A patient's trauma-related symptoms have lasted 2 months continuously. Her family says, 'she'll probably grow out of it since it hasn't even been that long.'",question:"Is the family's assumption accurate regarding PTSD's expected course?",options:{A:"Yes, PTSD always resolves within a few months",B:"No -- without treatment, PTSD can become chronic; the 1-month mark is a minimum diagnostic threshold, not an expected resolution point",C:"No, because she actually has Acute Stress Disorder, not PTSD",D:"Yes, because her symptoms started only recently"},correct:"B",rationale:"PTSD is described as chronic if untreated, and the >1-month duration criterion is simply the minimum threshold for diagnosis -- it does not imply symptoms will resolve on their own. At 2 months, she already meets PTSD's duration criterion (not ASD, which caps at 1 month). (Boland Ch. 10)"},{topic:"PTSD Neuroanatomy",vignette:"A researcher proposes a new PTSD treatment intended to enhance hippocampal-mediated fear-extinction learning.",question:"Which neurobiological finding in PTSD provides the rationale for this treatment target?",options:{A:"Increased hippocampal volume in PTSD",B:"Reduced hippocampal volume/activity, impairing fear-extinction learning",C:"Isolated basal ganglia dysfunction with a normal hippocampus",D:"Elevated hippocampal serotonin exclusively"},correct:"B",rationale:"PTSD is associated with reduced hippocampal volume and hypoactivity, which impairs contextual memory processing and fear-extinction learning -- this is the direct rationale for hippocampus-targeted interventions. (Standard psychiatric neuroscience, supplementary to Boland Ch. 10)"},{topic:"OCD",vignette:"A man has intrusive, ego-dystonic thoughts of harming his newborn daughter, which cause him extreme distress. He has no accompanying compulsion and would never act on the thoughts, but he does repeatedly seek reassurance from his wife that he is a 'good father.'",question:"This presentation best fits which OCD symptom pattern?",options:{A:"Contamination/cleansing",B:"Pathologic doubt/checking",C:"Intrusive/forbidden thoughts",D:"Symmetry/ordering"},correct:"C",rationale:"Ego-dystonic obsessional thoughts of an aggressive nature, without an accompanying ritualized compulsion, describe the intrusive/forbidden thoughts pattern -- patients often seek reassurance or confess these thoughts because they find them reprehensible. (Boland Ch. 9)"},{topic:"OCD",vignette:"A patient with OCD has been on sertraline 200 mg (maximum dose) for only 6 weeks with minimal improvement.",question:"What is the most appropriate next step before considering this a treatment-resistant case?",options:{A:"Switch immediately to an antipsychotic",B:"Continue the current dose longer, since OCD response typically requires 8-12 weeks",C:"Add clomipramine immediately",D:"Discontinue medication and rely on ERP alone"},correct:"B",rationale:"OCD treatment response to SSRIs classically takes longer than for depression, often 8-12 weeks at an adequate dose. At only 6 weeks, the trial is not yet adequate, so switching or augmenting would be premature. (Boland Ch. 9)"},{topic:"OCD",vignette:"A patient believes with complete conviction that touching doorknobs will definitely cause her family's death, with no recognition that this belief could be irrational.",question:"Which OCD insight specifier applies?",options:{A:"With good or fair insight",B:"With poor insight",C:"With absent insight/delusional beliefs",D:"Tic-related"},correct:"C",rationale:"Complete conviction that an OCD-related belief is true, without any recognition it might be false, meets criteria for 'absent insight/delusional beliefs' -- distinct from poor insight (thinks it's probably true) or good/fair insight (recognizes it's probably not true). (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A man with inflammatory bowel disease fears leaving home due to possible sudden bowel urgency in public without restroom access. His degree of fear and avoidance is judged by his provider to be excessive relative to his actual disease severity and needs.",question:"Which agoraphobia criterion specifically addresses this scenario?",options:{A:"Criterion F (duration)",B:"Criterion H (fear is clearly excessive even though a real medical condition is present)",C:"Criterion A (fear about \u22652 of 5 situations)",D:"Criterion I (rule-out of other disorders)"},correct:"B",rationale:"Criterion H specifically addresses cases where another medical condition is present (e.g., IBD, Parkinson's disease) -- agoraphobia can still be diagnosed if the fear/avoidance is clearly excessive relative to what the medical condition alone would warrant. (DSM-5-TR)"},{topic:"Agoraphobia",vignette:"A patient's panic disorder symptoms improve substantially on an SSRI, and her avoidance of public places also markedly decreases around the same time.",question:"What does Boland note about the relationship between treating panic disorder and comorbid agoraphobia?",options:{A:"Treating panic symptoms often also improves agoraphobia when the two coexist",B:"Agoraphobia never improves regardless of panic treatment",C:"Agoraphobia requires an entirely separate medication class with no overlap",D:"There is no relationship between the two conditions"},correct:"A",rationale:"Per Boland Ch. 8, when agoraphobia is part of a panic disorder presentation, improving panic symptoms often also improves the agoraphobia; behavior therapy is useful for more rapid, complete reduction of agoraphobic avoidance. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"An older adult has a panic attack during a stressful medical procedure and, on reflection, recognizes it was clearly related to the stress of the procedure.",question:"How would this attack be classified?",options:{A:"An unexpected panic attack",B:"An expected (cued) panic attack, since there was an identifiable trigger",C:"This automatically qualifies the patient for a Panic Disorder diagnosis",D:"This is not a true panic attack"},correct:"B",rationale:"DSM-5-TR distinguishes expected (cued) panic attacks, which have an identifiable trigger, from unexpected attacks, which occur 'out of the blue.' Panic Disorder specifically requires recurrent UNEXPECTED attacks -- an expected attack alone does not fulfill Criterion A. (DSM-5-TR)"},{topic:"Panic Disorder",vignette:"A woman with panic disorder wants to avoid daily medication and asks about non-pharmacologic treatment options.",question:"Which psychotherapy specifically targets catastrophic misinterpretation of physical sensations?",options:{A:"Interoceptive exposure-based CBT",B:"Psychodynamic therapy",C:"Present-centered therapy",D:"Family therapy"},correct:"A",rationale:"CBT for panic disorder that incorporates interoceptive exposure specifically targets the catastrophic misinterpretation of bodily sensations (e.g., a racing heart interpreted as a heart attack), which perpetuates the panic cycle. (Boland Ch. 8)"},{topic:"Panic Disorder",vignette:"Research imaging in a patient with panic disorder shows reduced GABA-A/benzodiazepine receptor binding.",question:"Which medication class's mechanism most directly targets this specific finding for acute symptom relief?",options:{A:"SSRIs",B:"Benzodiazepines",C:"Beta-blockers",D:"Tricyclic antidepressants"},correct:"B",rationale:"Benzodiazepines act directly on the GABA-A receptor complex, providing the mechanistic basis for their acute efficacy in panic disorder given the reduced GABA-A/benzodiazepine receptor binding implicated in the condition. (Boland Ch. 8, Table 8-9)"},{topic:"SAD vs. Specific Phobia",vignette:"A man developed an intense fear of elevators after being trapped in one for an hour; he now takes the stairs at all costs, even climbing 20 flights to avoid an elevator.",question:"Which specific phobia subtype does this best represent?",options:{A:"Animal type",B:"Natural environment type",C:"Situational type",D:"Blood-injection-injury type"},correct:"C",rationale:"Fear of a specific situation such as elevators, enclosed spaces, or flying is classified as the situational type of specific phobia. (DSM-5-TR)"},{topic:"SAD vs. Specific Phobia",vignette:"A teenager avoids eating in the school cafeteria because she is terrified classmates will judge how she eats and think she is 'weird,' though she has no difficulty eating alone or with close family.",question:"This is most consistent with which diagnosis?",options:{A:"Specific phobia",B:"Social Anxiety Disorder",C:"Agoraphobia",D:"Avoidant/restrictive food intake disorder"},correct:"B",rationale:"Fear centered on being observed and negatively judged by others (being watched eating) in a social context is the hallmark of Social Anxiety Disorder, not a fear of the food or eating act itself (which would suggest an eating disorder) or of the physical situation alone (specific phobia). (DSM-5-TR)"},{topic:"GAD",vignette:"A 10-year-old boy has worried excessively about his grades for 7 months and reports only one associated symptom (restlessness), with none of the other five GAD-associated symptoms present.",question:"Does this presentation meet the symptom-count portion of GAD criteria for a child?",options:{A:"No, children need \u22653 of 6 symptoms just like adults",B:"Yes -- only 1 of the 6 associated symptoms is required in children",C:"No, GAD cannot be diagnosed before adulthood",D:"Yes, but only if all 6 symptoms are present"},correct:"B",rationale:"DSM-5-TR Criterion C for GAD specifies that while adults need \u22653 of 6 associated symptoms, only 1 symptom is required in children. This boy's single symptom of restlessness would satisfy that portion of the criteria. (DSM-5-TR)"},{topic:"GAD",vignette:"A patient with GAD asks why her provider will not prescribe pregabalin, despite reading online that it has evidence for anxiety.",question:"What is the most accurate response?",options:{A:"Pregabalin is FDA-approved for GAD in the United States",B:"Pregabalin has evidence for GAD but lacks FDA approval for this specific indication in the U.S.",C:"Pregabalin is contraindicated in all anxiety disorders",D:"Pregabalin is a benzodiazepine and carries identical risks"},correct:"B",rationale:"Pregabalin has evidence supporting its use in GAD, but it lacks U.S. FDA approval for that specific indication -- an important prescribing/exam distinction. (Boland Ch. 8)"},{topic:"Schizophreniform Disorder",vignette:"A patient has met full Criterion A symptoms of schizophrenia continuously for 5 months, and it remains unclear whether she will recover or progress to a 6-month course.",question:"How should this diagnosis be qualified at this point in her illness?",options:{A:"Definite schizophrenia",B:"Provisional schizophreniform disorder",C:"Confirmed brief psychotic disorder",D:"Schizoaffective disorder"},correct:"B",rationale:"When schizophreniform disorder must be diagnosed before recovery or before the full duration course is known, it should be qualified as 'provisional' -- appropriate here since she is still within the 1-6 month window with an uncertain outcome. (DSM-5-TR)"},{topic:"Schizophreniform Disorder",vignette:"A clinician is distinguishing schizophreniform disorder from schizophrenia in terms of required functional criteria.",question:"Which requirement is present in schizophrenia's criteria but NOT required for schizophreniform disorder?",options:{A:"Criterion A psychotic symptoms",B:"A marked decline in functioning compared to prior baseline",C:"Exclusion of substance-induced causes",D:"Exclusion of mood disorder with psychotic features"},correct:"B",rationale:"Unlike schizophrenia (Criterion B), schizophreniform disorder does NOT require a decline in social/occupational functioning as part of its diagnostic criteria -- this is a key distinguishing feature between the two disorders. (DSM-5-TR)"},{topic:"Schizophrenia Prodrome",vignette:"A 16-year-old has begun spending hours writing in a private notebook filled with increasingly disorganized, abstract philosophical and religious ideas, alongside declining hygiene and behavior others find increasingly odd.",question:"Which of the following does this vignette illustrate, per Boland's description of the prodrome?",options:{A:"Active-phase catatonia",B:"Development of interest in abstract ideas, philosophy, or religion as part of the prodromal picture",C:"A Schneiderian first-rank symptom",D:"Tardive dyskinesia"},correct:"B",rationale:"Boland Ch. 5 specifically describes increasing preoccupation with abstract ideas, philosophy, and religious/occult questions as part of the prodromal picture that precedes overt psychosis -- along with declining hygiene and increasingly odd behavior. (Boland Ch. 5)"},{topic:"Schizophrenia Prodrome",vignette:"A family reports their son's illness 'started' the day he was hospitalized for his first psychotic break, denying any earlier signs.",question:"What does Boland note about this common family perception?",options:{A:"It is usually accurate; prodromal signs are rare",B:"Signs and symptoms have often been present for months or even years before the first hospitalization, even if families don't recognize this until later",C:"Schizophrenia always has an abrupt, sudden onset with no prodrome",D:"Prodromal symptoms only ever occur after the first hospitalization"},correct:"B",rationale:"Boland notes that although family members often believe the disorder began with the first hospitalization, signs and symptoms have frequently been present for months or even years beforehand, with their significance usually recognized only in retrospect. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A patient has intermittent manic episodes along with persistent psychotic symptoms (hallucinations, delusions) that continue both during and between the manic episodes, with psychosis present well over half of her total illness course outside of any mood episode.",question:"Which criterion for schizoaffective disorder is clearly NOT met in this case?",options:{A:"Criterion A",B:"Criterion B",C:"Criterion C (mood symptoms present for the majority of total illness duration)",D:"Criterion D"},correct:"C",rationale:"Criterion C requires mood-episode symptoms to be present for the MAJORITY of the total illness duration. If psychosis is present well over half the time WITHOUT mood symptoms, then mood symptoms are, by definition, not present for the majority -- so Criterion C fails. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A patient has a manic episode with grandiose delusions and auditory hallucinations that occur exclusively during the episode and resolve completely once the mania resolves. This pattern has repeated across 3 separate manic episodes over several years, with no psychotic symptoms in between.",question:"Which diagnosis is most likely?",options:{A:"Schizoaffective disorder, bipolar type",B:"Bipolar I disorder with psychotic features",C:"Schizophrenia",D:"Delusional disorder"},correct:"B",rationale:"When psychotic symptoms occur exclusively during mood episodes and fully resolve alongside them, the correct diagnosis is a mood disorder with psychotic features (here, Bipolar I with psychotic features) -- NOT schizoaffective disorder, which specifically requires \u22652 weeks of psychosis independent of any mood episode. (DSM-5-TR)"},{topic:"Schizoaffective Disorder",vignette:"A clinician is evaluating a patient for possible schizoaffective disorder and needs to establish the exact length of both the mood episode and the psychotic episode.",question:"Why does Boland describe this timing information as critical?",options:{A:"It has no real clinical importance, just documentation",B:"It is needed to confirm psychotic symptoms occur independently of mood symptoms and that the relative episode lengths support the diagnosis",C:"It only matters for insurance billing purposes",D:"It is relevant only for schizophrenia, not schizoaffective disorder"},correct:"B",rationale:"Boland Ch. 5 emphasizes that knowing when the affective episode ends while psychosis continues is essential to confirm the psychotic symptoms occur independently of mood symptoms (Criterion B), and that the relative lengths of mood versus psychotic episodes should be assessed to appropriately apply Criterion C. (Boland Ch. 5)"},{topic:"Schizoaffective Disorder",vignette:"A patient meets Criterion A of schizophrenia and has a major depressive episode occurring concurrently with the psychotic symptoms.",question:"For schizoaffective disorder's Criterion A to be met via a major depressive episode, which specific symptom must be included in that episode?",options:{A:"Any 5 of the 9 MDD symptoms, regardless of which ones",B:"Depressed mood specifically must be one of the symptoms present",C:"Anhedonia specifically must be present instead of depressed mood",D:"Insomnia and psychomotor agitation specifically"},correct:"B",rationale:"DSM-5-TR specifies that if the mood episode used to satisfy Criterion A is a major depressive episode, it must include depressed mood specifically (not merely anhedonia or another symptom substituting for it). (DSM-5-TR)"},{topic:"Positive vs. Negative Symptoms",vignette:"A patient's family reports, 'he just sits and stares all day, doesn't want to do anything, and never seems happy about anything anymore,' while he currently denies hearing voices or holding any unusual beliefs.",question:"Which specific negative symptoms are being described?",options:{A:"Avolition and anhedonia",B:"Hallucinations and delusions",C:"Disorganized speech and catatonia",D:"Thought broadcasting and thought insertion"},correct:"A",rationale:"Loss of motivation/purposeful activity (avolition) and loss of the capacity to experience pleasure (anhedonia) are both classic negative symptoms -- consistent with this description and the absence of any positive symptoms (hallucinations/delusions) currently. (Boland Ch. 5, Table 5-2)"},{topic:"Positive vs. Negative Symptoms",vignette:"A new antipsychotic trial shows robust reduction in a patient's hallucinations and delusions within 2 weeks, but his flat affect and social withdrawal remain essentially unchanged after 8 weeks of treatment.",question:"This pattern is most consistent with which general principle from Boland?",options:{A:"Positive symptoms typically respond faster/better to antipsychotics than negative symptoms",B:"Negative symptoms always resolve before positive symptoms",C:"Antipsychotics have no effect on positive symptoms",D:"This pattern is unusual and suggests a misdiagnosis"},correct:"A",rationale:"This is the expected, well-documented pattern: positive symptoms (hallucinations, delusions) generally respond well and relatively quickly to antipsychotics via D2 blockade, while negative symptoms are far more persistent and difficult to treat. (Boland Ch. 5)"},{topic:"Seizure Threshold",vignette:"A patient on maximal-dose bupropion for depression is separately prescribed tramadol for chronic pain by another provider.",question:"What is the primary safety concern with this combination?",options:{A:"An additive seizure-threshold-lowering effect",B:"Serotonin syndrome only, with no seizure risk",C:"QT prolongation",D:"Hepatotoxicity"},correct:"A",rationale:"Both bupropion and tramadol independently lower the seizure threshold; combining them creates an additive risk that should prompt caution or reconsideration of the combination. (Stahl's Prescriber's Guide)"},{topic:"Seizure Threshold",vignette:"An NP is choosing between two first-generation antipsychotics for a patient with a known seizure disorder and wants to minimize additional seizure risk.",question:"Which statement reflects an accurate understanding of relative seizure risk among antipsychotics?",options:{A:"Low-potency FGAs like chlorpromazine carry greater seizure risk than high-potency FGAs, so they should generally be avoided here",B:"All antipsychotics carry identical seizure risk",C:"High-potency FGAs always carry more seizure risk than low-potency FGAs",D:"Seizure risk is not a meaningful consideration with antipsychotics"},correct:"A",rationale:"Low-potency first-generation antipsychotics (e.g., chlorpromazine) carry greater seizure risk than high-potency FGAs or most second-generation agents -- an important consideration when selecting an antipsychotic for a patient with a seizure disorder. (Boland Ch. 5)"},{topic:"Neurotransmitters & Anxiety",vignette:"A drug in development selectively targets the corticotropin-releasing hormone (CRH)-1 receptor as a novel anxiolytic.",question:"What does the current evidence, per Boland, say about this drug class's track record?",options:{A:"CRH-1 receptor antagonists have shown strong, consistent efficacy in clinical trials",B:"CRH-1 receptor antagonists have, to date, failed to demonstrate efficacy in clinical trials",C:"This mechanism has never been studied",D:"This is already a first-line treatment for panic disorder"},correct:"B",rationale:"Per Boland Ch. 8, Table 8-9, despite the theoretical rationale (persistently increased CRH concentration implicated in anxiety disorders), CRH-1 receptor antagonists have to date failed to demonstrate efficacy in clinical trials. (Boland Ch. 8)"},{topic:"Neurotransmitters & Anxiety",vignette:"A patient with GAD asks why benzodiazepines work within minutes but her new SSRI is expected to take several weeks.",question:"Which explanation is most accurate regarding mechanism?",options:{A:"Benzodiazepines directly potentiate GABA-A receptor activity for immediate effect, while SSRIs require gradual adaptive changes in serotonergic signaling",B:"Both classes work through identical, equally fast mechanisms",C:"SSRIs actually work faster than benzodiazepines",D:"Benzodiazepines and SSRIs both act exclusively on the HPA axis"},correct:"A",rationale:"Benzodiazepines produce immediate anxiolysis through direct GABA-A receptor potentiation, while SSRIs require weeks of gradual downstream serotonergic receptor adaptation to produce their anxiolytic/antidepressant effect -- explaining the difference in onset. (Boland Ch. 8, Table 8-9)"},{topic:"Thought Broadcasting",vignette:"A patient insists a government agency is placing thoughts into her mind against her will, which she then experiences as her own intrusive ideas.",question:"This describes which symptom, distinct from thought broadcasting?",options:{A:"Thought insertion",B:"Thought withdrawal",C:"Thought broadcasting",D:"Delusion of reference"},correct:"A",rationale:"Thought insertion is the delusional belief that thoughts are being placed into one's mind by an outside force -- distinct from thought broadcasting (belief that one's own thoughts are being transmitted outward for others to hear). (Boland Ch. 5, Table 5-1)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A patient with no prior psychiatric history develops paranoid delusions during a 2-week course of high-dose corticosteroids for a severe asthma exacerbation; the delusions resolve completely within a week of steroid discontinuation.",question:"This clinical course is most consistent with which diagnosis?",options:{A:"Schizophrenia",B:"Substance/Medication-Induced Psychotic Disorder",C:"Schizoaffective disorder",D:"Delusional disorder"},correct:"B",rationale:"New-onset psychotic symptoms temporally linked to a medication known to be capable of producing psychosis (corticosteroids), with resolution shortly after discontinuation, is the classic picture of Substance/Medication-Induced Psychotic Disorder. (DSM-5-TR)"},{topic:"Substance-Induced Psychotic Disorder",vignette:"A patient with a documented 10-year history of chronic auditory hallucinations unrelated to substance use develops new visual hallucinations during a brief period of heavy alcohol intoxication.",question:"How should the clinician interpret the new visual hallucinations in the context of her overall history?",options:{A:"They automatically confirm an entirely new primary psychotic disorder",B:"They should be considered in the context of her known independent psychotic disorder, though the acute intoxication may be an additional precipitant",C:"They rule out any substance contribution entirely",D:"They automatically indicate delirium tremens"},correct:"B",rationale:"A documented history of prior non-substance-related psychotic episodes is evidence favoring an independent (primary) psychotic disorder per DSM-5-TR's differential guidance, even when an acute substance exposure is also present and may be contributing new symptoms. (DSM-5-TR)"},{topic:"Understanding Hallucinations",vignette:"A patient reports intermittently smelling burning rubber, occurring right before brief episodes of altered awareness and lip-smacking movements.",question:"This presentation, given the hallucination type described, should raise suspicion for which underlying condition?",options:{A:"Schizophrenia",B:"Temporal lobe epilepsy (olfactory aura)",C:"A normal variant requiring no workup",D:"A medication side effect only"},correct:"B",rationale:"Olfactory hallucinations are classically associated with temporal lobe epilepsy, often occurring as an aura preceding a seizure -- especially notable here given the accompanying altered awareness and automatisms (lip-smacking). This is an 'unusual' hallucination type in primary psychosis that should prompt medical/neurologic workup. (General psychiatric knowledge; Boland Ch. 5)"},{topic:"Understanding Hallucinations",vignette:"A patient with schizophrenia describes hearing two voices arguing with each other about his behavior, providing a running commentary.",question:"This specific auditory hallucination pattern (voices conversing/commenting) is:",options:{A:"Rare and atypical for schizophrenia",B:"A commonly described auditory hallucination pattern in schizophrenia per Boland's Table 5-1",C:"Diagnostic exclusively of a mood disorder",D:"Seen only in substance-induced psychosis"},correct:"B",rationale:"Boland Table 5-1 specifically lists 'voices commenting' and 'voices conversing' as recognized patterns of auditory hallucinations in schizophrenia -- a commonly tested detail. (Boland Ch. 5, Table 5-1)"},{topic:"Disorganized Speech",vignette:"A patient's speech trails off mid-sentence, and after a pause of several seconds, he seems unable to recall or continue what he was originally saying.",question:"This finding is best described as:",options:{A:"Thought blocking",B:"Clanging",C:"Circumstantiality",D:"Perseveration"},correct:"A",rationale:"Thought blocking is an abrupt interruption in the flow/train of thought, often mid-sentence, with the patient unable to continue or recall what they were saying. (Boland Ch. 5)"},{topic:"Disorganized Speech",vignette:"A patient responds to every question, regardless of topic, by returning to the same phrase about 'the government watching me,' even when asked unrelated questions like 'what did you eat for lunch?'",question:"This repetitive return to the same idea despite changing topics is best described as:",options:{A:"Perseveration",B:"Tangentiality",C:"Clanging",D:"Echolalia"},correct:"A",rationale:"Perseveration is the persistent repetition of a word or idea despite a change in topic or subsequent questions -- distinct from tangentiality (an oblique, irrelevant answer to a single question) or echolalia (repeating another person's words). (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient newly started on a high-potency first-generation antipsychotic develops difficulty swallowing and a spasm causing his neck to twist to one side within the first day of treatment.",question:"Beyond immediate discomfort, what is the most urgent concern if this presentation worsens?",options:{A:"Risk of laryngospasm and airway compromise",B:"Permanent tardive dyskinesia",C:"Agranulocytosis",D:"Hyperprolactinemia"},correct:"A",rationale:"Acute dystonia involving the throat/neck can progress to laryngospasm, a medical emergency due to airway compromise -- this is why acute dystonia requires prompt treatment with IM/IV benztropine or diphenhydramine. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A patient with antipsychotic-induced parkinsonism is treated with an anticholinergic, which provides partial relief, but he continues to have residual bradykinesia and rigidity.",question:"What does Boland note about the general effectiveness of anticholinergic treatment for EPS?",options:{A:"Anticholinergics are always fully effective and completely resolve EPS",B:"Anticholinergics are often only partially effective, leaving patients with residual EPS",C:"Anticholinergics have no role in treating EPS",D:"Anticholinergics work better for tardive dyskinesia than for parkinsonism"},correct:"B",rationale:"Boland Ch. 5 notes that anticholinergic antiparkinsonian medications, while the most effective option for many EPS subtypes, are often only partially effective, leaving patients with substantial amounts of lingering extrapyramidal side effects. (Boland Ch. 5)"},{topic:"Dystonia vs. Akinesia vs. Akathisia vs. TD",vignette:"A 70-year-old patient on a first-generation antipsychotic for several years now shows involuntary tongue and lip movements.",question:"Compared to younger patients, what does Boland note about tardive dyskinesia risk in the elderly?",options:{A:"Risk is identical regardless of age",B:"Risk is much higher in elderly patients",C:"Elderly patients are protected from TD",D:"TD does not occur in patients over 65"},correct:"B",rationale:"Boland Ch. 5 explicitly notes that the risk of tardive dyskinesia is much higher in elderly patients compared to younger patients, an important consideration in geriatric psychopharmacology. (Boland Ch. 5)"},{topic:"EBP Medication for Suicidality",vignette:"A patient with schizoaffective disorder and chronic suicidal ideation has failed two antipsychotic trials and continues to have breakthrough suicidal thoughts despite ongoing therapy.",question:"Which medication should be strongly considered given both her diagnosis and her suicidality?",options:{A:"Quetiapine",B:"Clozapine",C:"Fluoxetine",D:"Buspirone"},correct:"B",rationale:"Clozapine is FDA-approved specifically for reducing recurrent suicidal behavior in schizophrenia/schizoaffective disorder and is also the most effective antipsychotic for treatment-resistant cases -- making it the strongest option here on both counts. (Boland Ch. 5; Stahl's Prescriber's Guide)"},{topic:"EBP Medication for Suicidality",vignette:"A patient is started on clozapine specifically for its FDA-approved indication related to reducing suicidality risk.",question:"Which monitoring requirement is mandated for this medication due to a serious hematologic risk?",options:{A:"Weekly to monthly ANC monitoring depending on treatment duration, per REMS",B:"Annual CBC only",C:"No specific monitoring is required",D:"Monthly EKGs only"},correct:"A",rationale:"Due to agranulocytosis risk, clozapine requires REMS-mandated ANC monitoring: weekly for the first 6 months, biweekly for the next 6 months, then monthly thereafter. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A clinician is trying to determine whether a patient's agitation on an antipsychotic reflects worsening psychiatric symptoms or a medication side effect.",question:"Which specific question would most help distinguish akathisia from psychiatric agitation?",options:{A:"Asking about auditory hallucinations",B:"Asking directly about an inner sense of restlessness or an urge to move that the patient may not otherwise volunteer",C:"Asking about appetite changes",D:"Asking about sleep quality alone"},correct:"B",rationale:"Akathisia's subjective inner restlessness is easily mistaken for anxiety or worsening psychiatric agitation. Directly asking about that internal restlessness/urge to move is key to correctly identifying akathisia rather than misattributing it to the underlying psychiatric illness. (Boland Ch. 5)"},{topic:"EPS Signs/Symptoms and Treatment",vignette:"A patient develops EPS on a second-generation antipsychotic, and the prescriber recalls that not all SGAs carry equal EPS risk.",question:"Which statement about SGA-related EPS risk is accurate per Boland?",options:{A:"All SGAs are entirely free of EPS risk",B:"Risperidone can cause dose-related EPS even though it is a second-generation agent",C:"Only first-generation antipsychotics can ever cause EPS",D:"Clozapine has the highest EPS risk of all antipsychotics"},correct:"B",rationale:"Boland notes that risperidone may cause extrapyramidal side effects even at low doses, with severity and risk increasing at higher doses -- an important exception to the general rule that SGAs carry lower EPS risk than FGAs. Clozapine, by contrast, has one of the lowest EPS risks. (Boland Ch. 5)"},{topic:"Mood vs. Affect",vignette:"A patient reports feeling 'numb, like nothing matters,' while the clinician observes a full range of appropriate emotional expressiveness throughout the interview, including appropriate smiling and tearfulness at relevant points.",question:"How should this be documented?",options:{A:"Mood: 'numb, like nothing matters' (patient-reported); Affect: full range, appropriate",B:"Mood and affect are identical and redundant to document separately",C:"Affect: numb; Mood: full range",D:"This is an inconsistent, impossible presentation that cannot be documented"},correct:"A",rationale:"Mood is documented as the patient's own subjective report (quoted directly), while affect is the clinician's independent objective observation. These can be incongruent, as here, and both are documented as observed/reported rather th
